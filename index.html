<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D 5e Character Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
/* ================================================================
   RESET & BASE
================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 17px; }
body {
  background-color: var(--paper);
  background-image:
    radial-gradient(ellipse at 50% 30%, transparent 55%, rgba(90,60,25,0.16) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .20 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  min-height: 100vh;
  line-height: 1.55;
}
button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
.ico { width: 1em; height: 1em; display: block; }

/* ================================================================
   DESIGN TOKENS — parchment, iron-gall ink, oxblood, leather
================================================================ */
:root {
  --paper:       #e9dcbd;
  --paper-2:     #f2e8cf;
  --paper-3:     #ddcca4;
  --paper-hover: #e4d4ae;

  --rule:        #c2ac80;
  --rule-dark:   #8b7048;

  --ink:   #2b1f15;
  --ink-2: #594632;
  --ink-3: #85704f;

  --blood:       #8a2b1b;
  --blood-light: #a8402c;
  --blood-dark:  #5f1a10;
  --blood-wash:  rgba(138,43,27,0.09);

  --moss:    #476336;
  --leather: #3a281a;
  --leather-2: #51382a;

  --font-heading: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --font-body:    'Alegreya', 'Iowan Old Style', Georgia, serif;
  --font-ui:      'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', sans-serif;

  --radius-sm: 2px;
  --radius:    3px;
  --radius-lg: 3px;

  --shadow:    2px 3px 0 rgba(60,35,10,0.18);
  --shadow-lg: 4px 6px 0 rgba(60,35,10,0.22);
  --transition: 140ms ease;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--paper-3); }
::-webkit-scrollbar-thumb { background: var(--rule-dark); border-radius: 0; }

h1,h2,h3,h4 { font-family: var(--font-heading); font-weight: 400; line-height: 1.15; letter-spacing: 0.01em; }
h1 { font-size: clamp(1.9rem, 4.5vw, 2.8rem); }
h2 { font-size: clamp(1.5rem, 3vw, 2.1rem); }
h3 { font-size: 1.25rem; }

/* ================================================================
   BUTTONS
================================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px;
  border-radius: var(--radius);
  font-family: var(--font-ui); font-size: 0.92rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  transition: var(--transition); white-space: nowrap;
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

.btn-primary {
  background: var(--blood); color: var(--paper-2);
  border: 1px solid var(--blood-dark);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 2px 0 var(--blood-dark);
}
.btn-primary:hover:not(:disabled) { background: var(--blood-light); }
.btn-primary:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); }
.btn-primary:disabled { background: var(--paper-3); color: var(--ink-3); border-color: var(--rule); box-shadow: none; cursor: not-allowed; }

.btn-outline { border: 1px solid var(--ink-2); color: var(--ink); }
.btn-outline:hover { background: var(--ink); color: var(--paper-2); }

.btn-ghost { color: var(--ink-2); padding: 6px 10px; border-radius: var(--radius-sm); }
.btn-ghost:hover { color: var(--blood); background: var(--blood-wash); }
.btn-ghost.danger:hover { color: var(--blood-dark); background: rgba(138,43,27,0.14); }

/* ================================================================
   SITE HEADER — the leather binding
================================================================ */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, var(--leather-2), var(--leather));
  border-bottom: 3px double var(--rule-dark);
  box-shadow: 0 3px 0 rgba(40,20,5,0.25);
  padding: 0 28px; height: 62px;
  display: flex; align-items: center; justify-content: space-between;
  color: var(--paper-2);
}
.site-logo {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-heading); font-size: 1.35rem; letter-spacing: 0.04em;
  color: var(--paper-2); text-decoration: none;
}
.site-logo svg { width: 28px; height: 28px; color: var(--paper-3); }

/* ================================================================
   HOME PAGE
================================================================ */
.home-main { max-width: 1120px; margin: 0 auto; padding: 48px 28px 90px; }
.home-top {
  display: flex; align-items: flex-end; justify-content: space-between;
  flex-wrap: wrap; gap: 16px; margin-bottom: 34px;
  padding-bottom: 14px; border-bottom: 3px double var(--rule-dark);
}
.home-top h1 { color: var(--ink); }

.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 24px; }

.char-card {
  background: var(--paper-2);
  border: 1px solid var(--rule-dark);
  box-shadow: var(--shadow);
  cursor: pointer; transition: var(--transition);
  position: relative; display: flex; flex-direction: column;
  padding: 8px;
}
.char-card:hover { box-shadow: var(--shadow-lg); transform: translate(-1px,-1px); }
.char-avatar {
  width: 100%; aspect-ratio: 4/3;
  display: flex; align-items: center; justify-content: center;
  background: var(--paper-3); color: var(--ink-2);
  border: 1px solid var(--rule-dark);
  box-shadow: inset 0 0 0 3px var(--paper-3), inset 0 0 0 4px var(--rule);
}
.char-avatar svg { width: 76px; height: 76px; }
.char-avatar img { width: 100%; height: 100%; object-fit: cover; }
.char-card-body { padding: 12px 6px 4px; flex: 1; }
.char-name { font-family: var(--font-heading); font-size: 1.2rem; color: var(--ink); margin-bottom: 2px; }
.char-subtitle { font-size: 0.92rem; color: var(--ink-2); font-style: italic; }

.char-badge {
  position: absolute; top: 16px; right: 16px;
  background: var(--blood); color: var(--paper-2);
  font-family: var(--font-ui); font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: var(--radius-sm);
}
.char-card-actions { display: flex; gap: 6px; align-items: center; padding: 4px 0 2px; border-top: 1px solid var(--rule); margin-top: 8px; }

.empty-state { grid-column: 1 / -1; text-align: center; padding: 70px 24px; border: 2px dashed var(--rule-dark); }
.empty-state-icon { margin: 0 auto 14px; width: 64px; height: 64px; color: var(--ink-3); }
.empty-state-icon svg { width: 100%; height: 100%; }
.empty-state h3 { color: var(--ink); margin-bottom: 6px; }
.empty-state p { color: var(--ink-2); margin-bottom: 22px; font-style: italic; }

/* ================================================================
   WIZARD SHELL
================================================================ */
.wizard-layout { min-height: 100vh; display: flex; flex-direction: column; }

.wizard-header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, var(--leather-2), var(--leather));
  border-bottom: 3px double var(--rule-dark);
  color: var(--paper-2);
}
.wizard-header .btn-ghost { color: var(--paper-3); }
.wizard-header .btn-ghost:hover { color: #fff; background: rgba(255,255,255,0.08); }
.wizard-nav { height: 54px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
.wizard-title { font-family: var(--font-heading); font-size: 1.25rem; letter-spacing: 0.05em; color: var(--paper-2); }

.wizard-steps-bar {
  display: flex; align-items: center; gap: 0;
  padding: 0 20px 10px; overflow-x: auto; scrollbar-width: none;
}
.wizard-steps-bar::-webkit-scrollbar { display: none; }

.step-pip {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-ui); font-size: 0.8rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: #a58f6a; white-space: nowrap; padding: 4px 4px;
  border-bottom: 2px solid transparent; transition: var(--transition);
}
.step-pip .pip-dot { width: 6px; height: 6px; transform: rotate(45deg); background: #6e583a; }
.step-pip.active { color: var(--paper-2); border-bottom-color: #d9a441; }
.step-pip.active .pip-dot { background: #d9a441; }
.step-pip.done { color: var(--paper-3); }
.step-pip.done .pip-dot { background: var(--paper-3); }
.step-sep { color: #6e583a; font-size: 0.9rem; padding: 0 9px; }

.wizard-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

.wizard-footer {
  position: sticky; bottom: 0; z-index: 50;
  background: var(--paper-3);
  border-top: 3px double var(--rule-dark);
  padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.footer-hint { font-size: 0.95rem; color: var(--ink-2); font-style: italic; }

/* ================================================================
   LIST + DETAIL (race / class / background)
================================================================ */
.race-step { flex: 1; display: grid; grid-template-columns: 310px 1fr; min-height: 0; overflow: hidden; }
@media (max-width: 700px) {
  .race-step { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .race-list-panel { max-height: 260px; border-right: none !important; border-bottom: 1px solid var(--rule-dark); box-shadow: none !important; }
}

.race-list-panel {
  background: var(--paper-3);
  border-right: 1px solid var(--rule-dark);
  box-shadow: 8px 0 14px -10px rgba(50,28,8,0.45);
  overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column;
  position: relative; z-index: 1;
}
.panel-label {
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.16em; color: var(--ink-3);
  padding: 2px 20px 10px;
}

.race-option {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 20px 10px 17px;
  border-left: 3px solid transparent;
  border-bottom: 1px solid var(--rule);
  cursor: pointer; transition: var(--transition);
  text-align: left; width: 100%; color: var(--ink);
}
.race-option:hover { background: var(--paper-hover); }
.race-option.selected { background: var(--paper-2); border-left-color: var(--blood); }

.race-opt-icon { width: 34px; height: 34px; flex-shrink: 0; color: var(--ink-2); }
.race-opt-icon svg { width: 100%; height: 100%; }
.race-option.selected .race-opt-icon { color: var(--blood); }
.race-opt-name { font-family: var(--font-heading); font-size: 1.12rem; line-height: 1.1; }
.race-opt-tag  { font-size: 0.84rem; color: var(--ink-2); font-style: italic; margin-top: 2px; line-height: 1.25; }

.race-detail-panel { overflow-y: auto; padding: 36px 44px 48px; background: var(--paper-2); }
@media (max-width: 700px) { .race-detail-panel { padding: 22px 18px; } }

.race-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 380px; gap: 14px; color: var(--ink-3); text-align: center;
}
.race-empty-icon { width: 64px; height: 64px; opacity: 0.55; }
.race-empty-icon svg { width: 100%; height: 100%; }
.race-empty p { max-width: 260px; font-style: italic; }

.detail-header {
  display: flex; align-items: center; gap: 20px; margin-bottom: 26px;
  padding-bottom: 16px; border-bottom: 3px double var(--rule-dark);
}
.detail-icon { width: 64px; height: 64px; flex-shrink: 0; color: var(--blood); }
.detail-icon svg { width: 100%; height: 100%; }
.detail-title { font-family: var(--font-heading); font-size: 2.3rem; color: var(--ink); }
.detail-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.meta-pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--rule-dark); border-radius: var(--radius-sm);
  padding: 1px 9px; font-family: var(--font-ui); font-size: 0.8rem; font-weight: 500;
  letter-spacing: 0.04em; color: var(--ink-2); background: var(--paper);
}
.meta-pill svg { width: 12px; height: 12px; }

.section { margin-bottom: 26px; }
.section-label {
  font-family: var(--font-ui); font-size: 0.8rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.16em; color: var(--blood);
  margin-bottom: 10px; padding-bottom: 3px; border-bottom: 1px solid var(--rule-dark);
}

.asi-row { display: flex; flex-wrap: wrap; gap: 8px; }
.asi-chip {
  background: var(--paper); border: 1px solid var(--rule-dark); border-radius: var(--radius-sm);
  padding: 3px 12px; font-size: 1rem; font-weight: 700;
}
.asi-chip .bonus { color: var(--moss); margin-left: 5px; }

.trait-list { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.trait-item { border-bottom: 1px solid var(--rule); }
.trait-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 4px; cursor: pointer; user-select: none;
}
.trait-header:hover .trait-name { color: var(--blood); }
.trait-name { font-weight: 700; font-size: 1.02rem; }
.trait-chevron { color: var(--ink-3); transition: transform var(--transition); }
.trait-chevron svg { width: 14px; height: 14px; display: block; }
.trait-item.open .trait-chevron { transform: rotate(90deg); color: var(--blood); }
.trait-body { display: none; padding: 0 4px 12px; font-size: 1rem; color: var(--ink-2); line-height: 1.6; white-space: pre-line; }
.trait-item.open .trait-body { display: block; }
.trait-loading { color: var(--ink-3); font-style: italic; }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius-sm);
  padding: 1px 10px; font-size: 0.97rem; color: var(--ink-2);
}
.chip.dashed { border-style: dashed; border-color: var(--blood); color: var(--blood); }

.subrace-grid { display: flex; flex-direction: column; gap: 8px; }
.subrace-card {
  background: var(--paper); border: 1px solid var(--rule-dark);
  border-left: 4px solid var(--rule-dark); border-radius: var(--radius-sm);
  padding: 11px 16px; cursor: pointer; transition: var(--transition);
  text-align: left; width: 100%; color: var(--ink);
}
.subrace-card:hover { background: var(--paper-hover); }
.subrace-card.selected { border-color: var(--blood); border-left-color: var(--blood); background: var(--blood-wash); }
.subrace-name { font-family: var(--font-heading); font-size: 1.15rem; margin-bottom: 1px; }
.subrace-asis { font-size: 0.92rem; color: var(--moss); font-weight: 700; margin-bottom: 2px; }
.subrace-traits { font-size: 0.93rem; color: var(--ink-2); font-style: italic; }

/* Loading / error */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; gap: 14px; color: var(--ink-3); flex: 1; font-style: italic; }
.spinner { width: 30px; height: 30px; border: 3px solid var(--rule); border-top-color: var(--blood); border-radius: 50%; animation: spin 0.75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { padding: 40px; text-align: center; color: var(--blood-dark); }
.error-box p { margin-bottom: 14px; }

/* ================================================================
   ABILITY SCORES
================================================================ */
.abil-main, .choices-main, .form-main { max-width: 860px; margin: 0 auto; padding: 32px 24px 48px; width: 100%; }
.choices-main h2, .form-main h2 { color: var(--ink); padding-bottom: 8px; margin-bottom: 6px; border-bottom: 3px double var(--rule-dark); }
.choices-sub { color: var(--ink-2); margin-bottom: 22px; font-style: italic; }

.method-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--rule-dark); }
.method-tab {
  padding: 8px 20px; margin-bottom: -1px;
  font-family: var(--font-ui); font-size: 0.88rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3);
  border: 1px solid transparent; border-bottom: none; transition: var(--transition);
}
.method-tab:hover { color: var(--ink); }
.method-tab.active { background: var(--paper-2); border-color: var(--rule-dark); color: var(--blood); }
.abil-note { color: var(--ink-2); margin-bottom: 18px; }
.pool-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.pool-chip {
  min-width: 42px; text-align: center; background: var(--paper-2);
  border: 1px solid var(--rule-dark); border-radius: var(--radius-sm);
  padding: 2px 10px; font-weight: 700; font-size: 1.1rem;
}
.pool-chip.used { opacity: 0.3; text-decoration: line-through; }
.abil-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.abil-card {
  background: var(--paper-2); border: 1px solid var(--rule-dark); padding: 14px 16px;
  box-shadow: inset 0 0 0 3px var(--paper-2), inset 0 0 0 4px var(--rule);
}
.abil-name { font-family: var(--font-heading); color: var(--blood); font-size: 1.1rem; }
.abil-total { font-family: var(--font-heading); font-size: 2.6rem; line-height: 1.05; margin: 4px 0 0; }
.abil-mod { color: var(--ink-2); font-size: 0.95rem; }
.abil-break { font-size: 0.88rem; color: var(--ink-3); margin: 4px 0 10px; }
.abil-break .bonus { color: var(--moss); font-weight: 700; }
.abil-ctl { display: flex; align-items: center; gap: 8px; }
.abil-select {
  background: var(--paper); color: var(--ink); border: 1px solid var(--rule-dark);
  border-radius: var(--radius-sm); padding: 5px 8px; font: inherit; width: 100%;
}
.pb-btn { width: 30px; height: 30px; border: 1px solid var(--ink-2); border-radius: var(--radius-sm); font-size: 1.2rem; line-height: 1; }
.pb-btn:hover:not(:disabled) { background: var(--ink); color: var(--paper-2); }
.pb-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.pb-val { min-width: 28px; text-align: center; font-weight: 700; font-size: 1.15rem; }
.pb-points { font-weight: 700; color: var(--blood); }

/* ================================================================
   PICKERS: spells, skills, equipment
================================================================ */
.pick-count { color: var(--blood); font-weight: 700; }
.spell-list { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.spell-row { border-bottom: 1px solid var(--rule); transition: var(--transition); }
.spell-row.selected { background: var(--blood-wash); }
.spell-head { display: flex; align-items: stretch; }
.spell-pick { flex: 1; text-align: left; padding: 8px 6px; font-size: 1.02rem; font-weight: 500; display: flex; align-items: center; gap: 12px; }
.spell-pick:disabled { opacity: 0.35; cursor: not-allowed; }
.spell-check {
  width: 17px; height: 17px; border: 1.5px solid var(--ink-2); border-radius: 2px;
  flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; color: var(--paper-2);
}
.spell-row.selected .spell-check { background: var(--blood); border-color: var(--blood); }
.spell-info { padding: 0 12px; color: var(--ink-3); }
.spell-info:hover { color: var(--blood); }
.spell-info svg { width: 14px; height: 14px; display: block; transition: transform var(--transition); }
.spell-row.open .spell-info svg { transform: rotate(90deg); }
.spell-desc { display: none; padding: 2px 8px 12px 36px; color: var(--ink-2); line-height: 1.6; white-space: pre-line; }
.spell-row.open .spell-desc { display: block; }

.pick-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-chip {
  background: var(--paper); border: 1px solid var(--rule-dark); border-radius: var(--radius-sm);
  padding: 3px 14px; font-size: 1rem; color: var(--ink); transition: var(--transition);
}
.pick-chip:hover:not(:disabled) { border-color: var(--blood); }
.pick-chip.selected { background: var(--blood); border-color: var(--blood-dark); color: var(--paper-2); }
.pick-chip:disabled { opacity: 0.35; cursor: not-allowed; }
.pick-chip.fixed { border-style: dashed; color: var(--ink-2); background: transparent; }

.eq-group { background: var(--paper-2); border: 1px solid var(--rule-dark); padding: 14px 16px; margin-bottom: 12px; }
.eq-group-title { font-family: var(--font-ui); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); margin-bottom: 8px; }
.eq-alt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 12px; border: 1px solid var(--rule); border-left: 4px solid var(--rule); margin-bottom: 5px; }
.eq-alt:hover { background: var(--paper-hover); }
.eq-alt.selected { border-color: var(--blood); border-left-color: var(--blood); background: var(--blood-wash); }
.eq-picks { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px 4px; }
.gold-box { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.gold-amt { font-family: var(--font-heading); font-size: 1.8rem; color: var(--blood); }

/* ================================================================
   DETAILS FORM
================================================================ */
.field { margin-bottom: 18px; }
.field label { display: block; font-family: var(--font-ui); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--blood); margin-bottom: 5px; }
.field input[type=text], .field textarea, .field select {
  width: 100%; background: var(--paper); color: var(--ink);
  border: 1px solid var(--rule-dark); border-radius: var(--radius-sm);
  padding: 8px 11px; font: inherit; font-size: 1.05rem;
}
.field textarea { resize: vertical; min-height: 60px; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--blood); box-shadow: 0 0 0 2px var(--blood-wash); }
.field .sugg { margin-top: 6px; font-size: 0.9rem; color: var(--ink-2); }
.portrait-row { display: flex; align-items: center; gap: 18px; }
.portrait-box {
  width: 110px; height: 110px; border: 1px solid var(--rule-dark); background: var(--paper-3); color: var(--ink-2);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  box-shadow: inset 0 0 0 3px var(--paper-3), inset 0 0 0 4px var(--rule);
}
.portrait-box svg { width: 56px; height: 56px; }
.portrait-box img { width: 100%; height: 100%; object-fit: cover; }

/* ================================================================
   CHARACTER SHEET
================================================================ */
.sheet-wrap { max-width: 1000px; margin: 0 auto; padding: 26px 22px 70px; }
.sheet-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.sheet-bar .spacer { flex: 1; }
.sheet-head { display: flex; gap: 20px; align-items: center; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 3px double var(--rule-dark); }
.sheet-head .portrait-box { width: 96px; height: 96px; flex-shrink: 0; }
.sheet-name { font-family: var(--font-heading); font-size: 2.6rem; color: var(--ink); line-height: 1.05; }
.sheet-sub { color: var(--ink-2); font-style: italic; margin-top: 4px; }
.sheet-grid { display: grid; grid-template-columns: 236px 1fr; gap: 18px; }
@media (max-width: 760px) { .sheet-grid { grid-template-columns: 1fr; } }
.sheet-col { display: flex; flex-direction: column; gap: 14px; }
.sheet-card {
  background: var(--paper-2); border: 1px solid var(--rule-dark); padding: 12px 15px;
  box-shadow: inset 0 0 0 3px var(--paper-2), inset 0 0 0 4px var(--rule);
  break-inside: avoid;
}
.sheet-card h4 { font-family: var(--font-ui); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--blood); margin-bottom: 8px; padding-left: 3px; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
.stat-box { text-align: center; background: var(--paper-2); border: 1px solid var(--rule-dark); padding: 8px 4px 6px; box-shadow: inset 0 0 0 3px var(--paper-2), inset 0 0 0 4px var(--rule); }
.stat-box .v { font-family: var(--font-heading); font-size: 1.7rem; color: var(--ink); line-height: 1.1; }
.stat-box .l { font-family: var(--font-ui); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); }
.ab-box { text-align: center; background: var(--paper-2); border: 1px solid var(--rule-dark); padding: 8px 4px; box-shadow: inset 0 0 0 3px var(--paper-2), inset 0 0 0 4px var(--rule); }
.ab-box .l { font-family: var(--font-ui); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--blood); }
.ab-box .m { font-family: var(--font-heading); font-size: 2.1rem; line-height: 1.1; }
.ab-box .sc { font-size: 0.95rem; color: var(--ink-2); }
.prof-list { list-style: none; }
.prof-list li { display: flex; align-items: center; gap: 8px; padding: 1px 0; font-size: 0.95rem; }
.prof-dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-2); flex-shrink: 0; }
.prof-dot.on { background: var(--ink); border-color: var(--ink); }
.prof-list .val { width: 30px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet-text { color: var(--ink-2); line-height: 1.55; }
.sheet-text b { color: var(--ink); }
.sheet-text p + p { margin-top: 4px; }
.sheet-table { width: 100%; border-collapse: collapse; }
.sheet-table th { text-align: left; font-family: var(--font-ui); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); padding: 2px 6px 4px 0; }
.sheet-table td { padding: 3px 6px 3px 0; border-top: 1px solid var(--rule); }
/* Main numbers row: AC, initiative, speed, HP, hit die, proficiency, passive perception */
.sheet-col > .stat-row:first-child { grid-template-columns: repeat(7, 1fr); gap: 8px; }
@media (max-width: 900px) { .sheet-col > .stat-row:first-child { grid-template-columns: repeat(4, 1fr); } }
.prof-list li { white-space: nowrap; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }

/* Class step level picker */
.level-pick { display: flex; align-items: center; gap: 8px; font-family: var(--font-ui); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-2); }
.level-pick select { background: var(--paper); color: var(--ink); border: 1px solid var(--rule-dark); border-radius: var(--radius-sm); padding: 5px 8px; font: inherit; font-size: 1rem; }

.spell-group-label { font-family: var(--font-ui); font-size: 0.74rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); padding: 12px 6px 4px; border-bottom: 1px solid var(--rule); }

/* Sheet: features, slots, coins */
.appearance-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0 14px; }
details.feat { border-bottom: 1px solid var(--rule); }
details.feat summary { cursor: pointer; padding: 5px 2px; font-weight: 700; font-size: 0.97rem; list-style: none; display: flex; align-items: center; gap: 8px; }
details.feat summary::before { content: '▸'; color: var(--ink-3); transition: transform var(--transition); }
details.feat[open] summary::before { transform: rotate(90deg); color: var(--blood); }
details.feat summary:hover { color: var(--blood); }
details.feat .feat-body { padding: 0 2px 10px 18px; color: var(--ink-2); white-space: pre-line; line-height: 1.55; }
.slot-line { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.slot-lv { min-width: 84px; color: var(--ink-2); }
.slot-box { width: 16px; height: 16px; border: 1.5px solid var(--ink-2); border-radius: 2px; display: inline-block; }
.slot-box.round { border-radius: 50%; }
.res-line { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px dotted var(--rule); }
.currency-row { display: flex; gap: 8px; margin-bottom: 8px; }
.coin { flex: 1; text-align: center; border: 1px solid var(--rule-dark); padding: 2px 0 1px; background: var(--paper); }
.coin-v { min-height: 1.4em; font-weight: 700; }
.coin-l { font-family: var(--font-ui); font-size: 0.66rem; letter-spacing: 0.12em; color: var(--ink-3); }
.prof-dot.expert { box-shadow: 0 0 0 2px var(--paper-2), 0 0 0 3px var(--ink); }

/* ================================================================
   TOAST
================================================================ */
#toast-root { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 7px; pointer-events: none; }
.toast {
  background: var(--leather); color: var(--paper-2);
  border: 1px solid var(--rule-dark); border-left: 4px solid var(--rule-dark);
  padding: 9px 16px; box-shadow: var(--shadow-lg); animation: toastIn 0.18s ease; pointer-events: all;
}
.toast.success { border-left-color: #7fa564; }
.toast.error   { border-left-color: #d9604a; }
@keyframes toastIn { from { transform: translateX(16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ================================================================
   PRINT
================================================================ */
@media print {
  :root {
    --paper: #fff; --paper-2: #fff; --paper-3: #f1f1f1; --paper-hover: #eee;
    --rule: #bbb; --rule-dark: #777; --ink: #000; --ink-2: #333; --ink-3: #666;
    --blood: #5f1a10; --blood-wash: #fff;
  }
  html { font-size: 14px; }
  body { background: #fff !important; }
  .no-print, .site-header { display: none !important; }
  .sheet-wrap { padding: 0; max-width: none; }
  .sheet-grid, .two-col { gap: 8px; }
}
</style>

// Eldritch Knight and Arcane Trickster cast as one-third casters using the wizard list
const THIRD_CASTER = { 'eldritch-knight': 'fighter', 'arcane-trickster': 'rogue' };
const isThirdCaster = c => !!c.klass && THIRD_CASTER[c.subclassChoice?.index] === c.klass.index && (c.level || 1) >= 3;
const castingAbility = c => c.klass?.spellcasting?.ability || (isThirdCaster(c) ? 'int' : null);
function thirdCasterSc(char) {
  const lvl = char.level, trickster = char.subclassChoice.index === 'arcane-trickster';
  const slots = lvl >= 19 ? [4, 3, 3, 1] : lvl >= 16 ? [4, 3, 3] : lvl >= 13 ? [4, 3, 2] : lvl >= 10 ? [4, 3] : lvl >= 7 ? [4, 2] : lvl >= 4 ? [3] : [2];
  const sc = { cantrips_known: (lvl >= 10 ? 3 : 2) + (trickster ? 1 : 0),
               spells_known: [0, 0, 3, 4, 4, 4, 5, 6, 6, 7, 8, 8, 9, 10, 10, 11, 11, 11, 12, 13][lvl - 1] };
  slots.forEach((n, i) => { sc['spell_slots_level_' + (i + 1)] = n; });
  return sc;
}

// Class level table (features, spell slots, proficiency, ASIs) — one cached call per class
const classLevels = index => Api.get(`/classes/${index}/levels`);

// Character levels at which an Ability Score Improvement is earned
function asiLevels(levels, upTo) {
  const out = [];
  (levels || []).slice(0, upTo).forEach((l, i) => {
    const prev = i ? levels[i - 1].ability_score_bonuses || 0 : 0;
    if ((l.ability_score_bonuses || 0) > prev) out.push(l.level);
  });
  return out;
}

// What a class gets at this level: slots, cantrips, spells known/prepared
function spellNeeds(char, L) {
  const sc = isThirdCaster(char) ? thirdCasterSc(char) : (L?.spellcasting || {});
  const slots = {};
  for (let n = 1; n <= 9; n++) if (sc['spell_slots_level_' + n] > 0) slots[n] = sc['spell_slots_level_' + n];
  const maxLevel = Math.max(0, ...Object.keys(slots).map(Number));
  if (!maxLevel && !(sc.cantrips_known > 0)) return { casts: false, slots: {}, cantrips: 0, spells: 0, maxLevel: 0, label: '' };
  const k = char.klass.index, lvl = char.level || 1;
  const mod = abilityMod(finalScore(char, castingAbility(char) || 'int'));
  let spells, label;
  if (sc.spells_known != null)  { spells = sc.spells_known; label = 'Spells Known'; }
  else if (k === 'wizard')      { spells = 6 + 2 * (lvl - 1); label = 'Spellbook Spells'; }
  else if (k === 'paladin')     { spells = Math.max(1, mod + Math.floor(lvl / 2)); label = 'Prepared Spells'; }
  else                          { spells = Math.max(1, mod + lvl); label = 'Prepared Spells'; }
  return { casts: true, slots, cantrips: sc.cantrips_known || 0, spells, maxLevel, label };
}

// Total of ability bonuses from race (fixed + chosen) and Ability Score Improvements
function racialBonuses(char) {
  const out = {};
  const add = (k, n) => { out[k] = (out[k] || 0) + n; };
  [...(char.race?.ability_bonuses || []), ...(char.subrace?.ability_bonuses || [])]
    .forEach(b => add(b.ability_score.index, b.bonus));
  const opts = abilityOptionList(char.race);
  (char.raceAbilityChoices || []).forEach(k => add(k, opts.find(o => o.index === k)?.bonus || 1));
  return out;
}
function asiBonuses(char) {
  const out = {};
  const add = (k, n) => { if (k) out[k] = (out[k] || 0) + n; };
  Object.entries(char.asi || {}).forEach(([lvl, e]) => {
    if (Number(lvl) > (char.level || 1)) return;
    if (e.mode === 'plus2') add(e.a, 2);
    if (e.mode === 'plus1') { add(e.a, 1); add(e.b, 1); }
  });
  return out;
}
function abilityOptionList(race) {
  return (race?.ability_bonus_options?.from?.options || [])
    .filter(o => o.ability_score).map(o => ({ index: o.ability_score.index, bonus: o.bonus || 1 }));
}

function finalScore(char, ab) {
  const n = (char.baseScores?.[ab] ?? 8) + (racialBonuses(char)[ab] || 0) + (asiBonuses(char)[ab] || 0);
  return Math.min(20, n);
}

// Hit points: max die at 1st level, average thereafter, plus per-level racial/class bonuses
function maxHP(c, conMod) {
  const hd = c.klass?.hit_die || 8, lvl = c.level || 1;
  const perLevel = (c.subrace?.index === 'hill-dwarf' ? 1 : 0) + (c.subclassChoice?.index === 'draconic' ? 1 : 0);
  return Math.max(1, hd + conMod + (lvl - 1) * Math.max(1, Math.floor(hd / 2) + 1 + conMod) + perLevel * lvl);
}

/* ================================================================
   API LAYER  (fetch + localStorage cache)
================================================================ */
const Api = {
  _mem: null,
  _cache() {
    if (!this._mem) {
      try { this._mem = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); }
      catch { this._mem = {}; }
    }
    return this._mem;
  },
  _flush() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(this._mem)); }
    catch { /* storage full — cache misses are fine */ }
  },
  async get(path) {
    const c = this._cache();
    if (c[path]) return c[path];
    const r = await fetch(path.startsWith('http') ? path : API_BASE + path);
    if (!r.ok) throw new Error(`HTTP ${r.status} — ${path}`);
    const data = await r.json();
    c[path] = data;
    this._flush();
    return data;
  },
};

/* ================================================================
   CHARACTER STORE
================================================================ */
// Bring characters saved by older versions up to the current shape
function migrateChar(c) {
  if (c.level == null) c.level = 1;
  if (!c.spells?.length && c.level1Spells?.length) c.spells = c.level1Spells;
  if (!c.spellSlots || !Object.keys(c.spellSlots).length) c.spellSlots = c.spellSlots1 ? { 1: c.spellSlots1 } : {};
  return c;
}

const Store = {
  all() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]').map(migrateChar); }
    catch { return []; }
  },
  one(id) { return this.all().find(c => c.id === id) || null; },
  save(char) {
    char.updatedAt = Date.now();
    const list = this.all();
    const i = list.findIndex(c => c.id === char.id);
    if (i >= 0) list[i] = char; else list.unshift(char);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
    catch { Toast.show('Storage full — delete a character to free space.', 'error'); }
    return char;
  },
  del(id) {
    const list = this.all().filter(c => c.id !== id);
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
  },
  blank() {
    return {
      id: crypto.randomUUID(),
      createdAt: Date.now(),
      updatedAt: Date.now(),
      step: 'race',         // current creation step
      portrait: null,       // base64 or null
      name: '',
      alignment: '',
      personalityTraits: [],
      ideal: '',
      bond: '',
      flaw: '',
      // Choices
      race:       null,     // { index, name, speed, size, ability_bonuses, traits, languages, language_options, starting_proficiencies, subraces }
      subrace:    null,     // { index, name, ability_bonuses, racial_traits } or null
      klass:      null,     // 'class' is a reserved word
      background: null,
      abilityMethod: null,  // 'standard' | 'pointbuy' | 'roll'
      baseScores: { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 },
      rolledPool: [],       // 6 rolled values (roll method)
      abilityAssign: {},    // ability -> index into pool (standard/roll methods)
      skillProficiencies: [],
      bonusLanguages: [],
      cantrips:     [],
      spellNames:   {},     // spell index -> name
      spells:       [],     // leveled spells known / prepared / in spellbook
      spellLevels:  {},     // spell index -> spell level
      spellSlots:   {},     // spell level -> slot count
      level: 1,
      raceAbilityChoices: [],   // e.g. Half-elf's two free +1s
      asi: {},                  // character level -> { mode: 'plus2'|'plus1'|'feat', a, b, feat }
      racialProficiencies: [],  // skill/tool picks granted by race
      toolProficiencies: [],    // tool/instrument picks granted by class
      expertise: [],            // skill indices (or 'thieves-tools')
      subclassSkills: [],       // skill picks granted by a subclass (e.g. Knowledge domain)
      dragonAncestry: null,     // Dragonborn colour
      draconicAncestry: null,   // Draconic sorcerer colour
      racialCantrips: [],       // High Elf wizard cantrip
      favoredEnemies: [],
      favoredTerrains: [],
      appearance: {},           // age, height, weight, eyes, skin, hair, gender
      backstory: '', allies: '', notes: '',
      subclassChoice: null,
      fightingStyle:  null,
      equipment: [],
      useGold: false,
      startGold: 0,
    };
  },
};

/* ================================================================

================================================================ */
const Toast = {
  show(msg, type = 'info', ms = 3200) {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-root').appendChild(el);
    setTimeout(() => el.remove(), ms);
  },
};

/* ================================================================
   HELPERS
================================================================ */
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Move a character forward to `id`, never backwards and never out of 'complete'.
function advanceStep(char, id) {
  if (char.step === 'complete') return;
  if (STEPS.findIndex(x => x.id === char.step) < STEPS.findIndex(x => x.id === id)) char.step = id;
}

function asiLabel(bonuses) {
  if (!bonuses?.length) return '';
  return bonuses.map(b => {
    const name = ABILITY_FULL[b.ability_score.index] || b.ability_score.name;
    return `${name} +${b.bonus}`;
  }).join(', ');
}

const App = {
  page: 'home',
  ctx: {},

  go(page, ctx = {}) {
    this.page = page;
    this.ctx  = ctx;
    document.getElementById('app').innerHTML = '';
    window.scrollTo(0, 0);
    this.render();
  },

  render() {
    const root = document.getElementById('app');
    switch (this.page) {
      case 'home': HomeView.render(root); break;
      case 'race':  RaceView.render(root, this.ctx); break;
      case 'class': ClassView.render(root, this.ctx); break;
      case 'abilities': AbilityView.render(root, this.ctx); break;
      case 'background': BackgroundView.render(root, this.ctx); break;
      case 'choices': ChoicesView.render(root, this.ctx); break;
      case 'skills': SkillsView.render(root, this.ctx); break;
      case 'equipment': EquipmentView.render(root, this.ctx); break;
      case 'details': DetailsView.render(root, this.ctx); break;
      case 'sheet': SheetView.render(root, this.ctx); break;
      default:
        root.innerHTML = `<div class="loading"><p>Page not found</p></div>`;
    }
  },

  newCharacter() {
    const c = Store.blank();
    Store.save(c);
    App.go('race', { charId: c.id });
  },

  openCharacter(id) {
    const c = Store.one(id);
    if (!c) return;
    const dest = c.step === 'complete' ? 'sheet'
      : STEPS.some(x => x.id === c.step) ? c.step : 'race';
    App.go(dest, { charId: id });
  },

  deleteCharacter(id) {
    if (!confirm('Delete this character? This cannot be undone.')) return;
    Store.del(id);
    App.render();
  },
};

================================================================ */
function wizardShell(activeStepId, bodyHtml, footerHtml) {
  const activeIdx = STEPS.findIndex(s => s.id === activeStepId);
  const pips = STEPS.map((s, i) => {
    const cls = i === activeIdx ? 'active' : i < activeIdx ? 'done' : '';
    return `${i > 0 ? `<span class="step-sep">›</span>` : ''}
      <span class="step-pip ${cls}"><span class="pip-dot"></span>${s.label}</span>`;
  }).join('');

  return `
    <div class="wizard-layout">
      <header class="wizard-header">
        <nav class="wizard-nav">
          <button class="btn btn-ghost" onclick="App.go('home')">${I.back} Home</button>
          <span class="wizard-title">Character Creation</span>
          <div style="width:72px"></div>
        </nav>
        <div class="wizard-steps-bar">${pips}</div>
      </header>
      <div class="wizard-body" id="wizard-body">${bodyHtml}</div>
      <footer class="wizard-footer">
        <span class="footer-hint" id="footer-hint"></span>
        ${footerHtml}
      </footer>
    </div>`;
}
