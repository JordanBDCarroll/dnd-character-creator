/* ================================================================
   RESET & BASE
================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-body);
  min-height: 100vh;
  line-height: 1.6;
}
button { cursor: pointer; border: none; background: none; font: inherit; }

/* ================================================================
   DESIGN TOKENS
================================================================ */
:root {
  --bg-primary:   #0d0d1a;
  --bg-secondary: #13132a;
  --bg-tertiary:  #1a1a35;
  --bg-card:      #181830;
  --bg-hover:     #202040;

  --border:       #252550;
  --border-light: #353565;

  --text-primary:   #e8e0d0;
  --text-secondary: #9a95b5;
  --text-muted:     #55557a;

  --gold:       #c9aa71;
  --gold-light: #e8c87a;
  --gold-dark:  #7a6030;
  --gold-glow:  rgba(201,170,113,0.12);

  --green: #5ab85a;

  --font-heading: 'Cinzel', Georgia, serif;
  --font-body:    'Inter', system-ui, sans-serif;

  --radius-sm: 4px;
  --radius:    8px;
  --radius-lg: 12px;

  --shadow:    0 4px 20px rgba(0,0,0,0.45);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);

  --transition: 180ms ease;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

h1,h2,h3,h4 { font-family: var(--font-heading); font-weight: 600; line-height: 1.2; }
h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }
h2 { font-size: clamp(1.3rem, 3vw, 1.9rem); }
h3 { font-size: 1.15rem; }

/* ================================================================
   BUTTONS
================================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 18px;
  border-radius: var(--radius);
  font-size: 0.9rem;
  font-weight: 500;
  transition: var(--transition);
  white-space: nowrap;
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

.btn-primary { background: var(--gold); color: #0d0d1a; }
.btn-primary:hover:not(:disabled) { background: var(--gold-light); transform: translateY(-1px); }
.btn-primary:disabled { background: var(--border-light); color: var(--text-muted); cursor: not-allowed; }

.btn-outline { border: 1px solid var(--border-light); color: var(--text-secondary); }
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }

.btn-ghost { color: var(--text-secondary); padding: 7px 11px; border-radius: var(--radius-sm); }
.btn-ghost:hover { color: var(--text-primary); background: var(--bg-hover); }
.btn-ghost.danger:hover { color: #e05050; background: rgba(80,0,0,0.3); }

/* ================================================================
   SITE HEADER (home)
================================================================ */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,13,26,0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}
.site-logo {
  display: flex; align-items: center; gap: 11px;
  font-family: var(--font-heading);
  font-size: 1.15rem;
  color: var(--gold);
  text-decoration: none;
}
.site-logo svg { width: 28px; height: 28px; }

/* ================================================================
   HOME PAGE
================================================================ */
.home-main {
  max-width: 1160px;
  margin: 0 auto;
  padding: 44px 24px 80px;
}
.home-top {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 16px;
  margin-bottom: 36px;
}
.home-top h1 { color: var(--gold); }

.char-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 18px;
}

.char-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  display: flex; flex-direction: column;
}
.char-card:hover {
  border-color: var(--gold-dark);
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}
.char-avatar {
  width: 100%; aspect-ratio: 4/3;
  display: flex; align-items: center; justify-content: center;
  font-size: 3.5rem;
  background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
}
.char-avatar img {
  width: 100%; height: 100%; object-fit: cover;
}
.char-card-body { padding: 14px 16px 8px; flex: 1; }
.char-name { font-family: var(--font-heading); font-size: 1rem; color: var(--text-primary); margin-bottom: 3px; }
.char-subtitle { font-size: 0.8rem; color: var(--text-secondary); }

.char-badge {
  position: absolute; top: 9px; right: 9px;
  background: rgba(13,13,26,0.85);
  border: 1px solid var(--border-light);
  border-radius: 20px;
  padding: 2px 9px;
  font-size: 0.7rem;
  color: var(--gold);
  backdrop-filter: blur(4px);
}
.char-card-actions {
  display: flex; gap: 6px; align-items: center;
  padding: 8px 10px 12px;
}

/* Empty state */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 72px 24px;
}
.empty-state-icon { font-size: 3.5rem; margin-bottom: 14px; opacity: 0.35; }
.empty-state h3 { font-family: var(--font-heading); color: var(--text-secondary); margin-bottom: 6px; }
.empty-state p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 22px; }

/* ================================================================
   WIZARD SHELL
================================================================ */
.wizard-layout { min-height: 100vh; display: flex; flex-direction: column; }

.wizard-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,13,26,0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.wizard-nav {
  height: 60px; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.wizard-title { font-family: var(--font-heading); font-size: 1rem; color: var(--gold); }

.wizard-steps-bar {
  display: flex; align-items: center; gap: 2px;
  padding: 0 20px 10px;
  overflow-x: auto; scrollbar-width: none;
}
.wizard-steps-bar::-webkit-scrollbar { display: none; }

.step-pip {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.72rem; font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  padding: 3px 8px;
  border-radius: 20px;
  transition: var(--transition);
}
.step-pip .pip-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--border-light);
  transition: var(--transition);
}
.step-pip.active { color: var(--gold); }
.step-pip.active .pip-dot { background: var(--gold); box-shadow: 0 0 6px var(--gold-dark); }
.step-pip.done { color: var(--text-secondary); }
.step-pip.done .pip-dot { background: var(--text-secondary); }
.step-sep { color: var(--border-light); font-size: 0.7rem; padding: 0 1px; }

.wizard-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

.wizard-footer {
  position: sticky; bottom: 0; z-index: 50;
  background: rgba(13,13,26,0.97);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.footer-hint { font-size: 0.82rem; color: var(--text-secondary); }

/* ================================================================
   RACE SELECTION
================================================================ */
.race-step {
  flex: 1;
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: 0;
  overflow: hidden;
}
@media (max-width: 700px) {
  .race-step { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .race-list-panel { max-height: 260px; border-right: none; border-bottom: 1px solid var(--border); }
}

.race-list-panel {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 14px 10px;
  display: flex; flex-direction: column; gap: 4px;
}
.panel-label {
  font-size: 0.68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-muted);
  padding: 4px 10px 8px;
}

.race-option {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  transition: var(--transition);
  background: transparent;
  text-align: left; width: 100%;
  color: var(--text-primary);
}
.race-option:hover { background: var(--bg-hover); border-color: var(--border-light); }
.race-option.selected { background: var(--gold-glow); border-color: var(--gold-dark); }

.race-opt-icon { font-size: 1.7rem; line-height: 1; flex-shrink: 0; }
.race-opt-name { font-weight: 600; font-size: 0.9rem; }
.race-opt-tag  { font-size: 0.75rem; color: var(--text-secondary); margin-top: 1px; }
.race-option.selected .race-opt-tag { color: var(--gold-dark); }

/* Detail panel */
.race-detail-panel {
  overflow-y: auto;
  padding: 32px 36px;
}
@media (max-width: 700px) { .race-detail-panel { padding: 20px 16px; } }

.race-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 380px; gap: 12px;
  color: var(--text-muted); text-align: center;
}
.race-empty-icon { font-size: 2.5rem; opacity: 0.25; }
.race-empty p { font-size: 0.88rem; max-width: 240px; }

.detail-header { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 28px; }
.detail-icon { font-size: 3rem; line-height: 1; }
.detail-title { font-family: var(--font-heading); font-size: 1.8rem; color: var(--gold); }
.detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.meta-pill {
  display: flex; align-items: center; gap: 5px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 11px;
  font-size: 0.78rem; color: var(--text-secondary);
}
.meta-pill svg { width: 12px; height: 12px; }

.section { margin-bottom: 24px; }
.section-label {
  font-size: 0.67rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--gold);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.asi-row { display: flex; flex-wrap: wrap; gap: 7px; }
.asi-chip {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 5px 13px;
  font-size: 0.88rem; font-weight: 600;
}
.asi-chip .bonus { color: var(--green); margin-left: 4px; }

.trait-list { display: flex; flex-direction: column; gap: 7px; }
.trait-item {
  background: var(--bg-tertiary);
  border: 1px solid transparent;
  border-radius: var(--radius);
  overflow: hidden;
  transition: var(--transition);
}
.trait-item:hover { border-color: var(--border-light); }
.trait-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
}
.trait-name { font-weight: 600; font-size: 0.88rem; }
.trait-chevron { color: var(--text-muted); transition: transform var(--transition); }
.trait-chevron svg { width: 14px; height: 14px; display: block; }
.trait-item.open .trait-chevron { transform: rotate(90deg); }
.trait-body {
  display: none;
  padding: 0 14px 12px;
  font-size: 0.83rem; color: var(--text-secondary);
  line-height: 1.65;
}
.trait-item.open .trait-body { display: block; }
.trait-loading { color: var(--text-muted); font-style: italic; }

.chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px 11px;
  font-size: 0.82rem; color: var(--text-secondary);
}
.chip.dashed { border-style: dashed; color: var(--gold-dark); }

/* Subrace picker */
.subrace-grid { display: flex; flex-direction: column; gap: 9px; }
.subrace-card {
  background: var(--bg-tertiary);
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  cursor: pointer;
  transition: var(--transition);
  text-align: left; width: 100%; color: var(--text-primary);
}
.subrace-card:hover { border-color: var(--border-light); background: var(--bg-hover); }
.subrace-card.selected { border-color: var(--gold); background: var(--gold-glow); }
.subrace-name { font-weight: 600; font-size: 0.92rem; margin-bottom: 3px; }
.subrace-asis { font-size: 0.8rem; color: var(--green); margin-bottom: 4px; }
.subrace-traits { font-size: 0.78rem; color: var(--text-secondary); }

/* Loading / error */
.loading {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px; gap: 14px;
  color: var(--text-muted); flex: 1;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { padding: 40px; text-align: center; color: #e05050; }
.error-box p { margin-bottom: 14px; font-size: 0.88rem; }


/* ================================================================
   ABILITY SCORES
================================================================ */
.abil-main { max-width: 860px; margin: 0 auto; padding: 28px 20px 40px; width: 100%; }
.method-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.method-tab {
  padding: 8px 16px; border-radius: var(--radius);
  border: 1px solid var(--border-light); color: var(--text-secondary);

/* ================================================================
   TOAST
================================================================ */
#toast-root {
  position: fixed; bottom: 20px; right: 20px;

@keyframes toastIn {
  from { transform: translateX(16px); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}

<body>
<div id="app"></div>
<div id="toast-root"></div>

<script>
'use strict';

/* ================================================================
   CONSTANTS
================================================================ */
// Self-hosting: set window.DND_API_BASE before this script (e.g. in config.js)
// to point at your own mirror of dnd5eapi, e.g. '/api/2014'.
const API_BASE    = window.DND_API_BASE || 'https://www.dnd5eapi.co/api/2014';
// Second data source for content the SRD lacks (extra backgrounds). Override like DND_API_BASE.
// Set window.OPEN5E_BASE = '' (in config.js) to disable Open5e entirely.
const OPEN5E_BASE = window.OPEN5E_BASE ?? 'https://api.open5e.com/v1';
const STORE_KEY   = 'dnd5e-characters';
const CACHE_KEY   = 'dnd5e-api-cache';

const STEPS = [
  { id: 'race',       label: 'Race' },
  { id: 'class',      label: 'Class' },
  { id: 'abilities',  label: 'Abilities' },
  { id: 'background', label: 'Background' },
  { id: 'choices',    label: 'Choices' },

];

const RACE_ICONS = {

  'half-elf': '✨', 'half-orc': '⚔️', halfling: '🍀',
  human: '👤', tiefling: '😈',
};

const BG_ICONS = {

  'folk-hero': '🌾', 'guild-artisan': '🔨', hermit: '🏔️', noble: '👑',
  outlander: '🧭', sage: '📜', sailor: '⚓', soldier: '🎖️', urchin: '🐀',
};

const RACE_TAGS = {
  dragonborn: 'Proud dragon-blooded warriors',
  dwarf:      'Stout and resilient craftspeople',
  elf:        'Ancient and graceful wanderers',
  gnome:      'Curious inventors and tricksters',
  'half-elf': 'Adaptable children of two worlds',
  'half-orc': 'Fierce and enduring survivors',
  halfling:   'Lucky and lighthearted wanderers',
  human:      'Ambitious and versatile mortals',

};

const CLASS_ICONS = {
  barbarian: '🪓', bard: '🎶', cleric: '☀️', druid: '🌳',
  fighter: '⚔️', monk: '👊', paladin: '🛡️', ranger: '🏹',
  rogue: '🗡️', sorcerer: '🔥', warlock: '👁️', wizard: '📖',
};

const CLASS_TAGS = {
  barbarian: 'Raging primal warriors',
  bard:      'Inspiring magical performers',
  cleric:    'Divine champions of the gods',
  druid:     'Shapeshifting guardians of nature',
  fighter:   'Masters of weapons and armor',
  monk:      'Disciplined martial artists',
  paladin:   'Holy warriors bound by oath',
  ranger:    'Hunters of the wild frontier',
  rogue:     'Cunning masters of stealth',
  sorcerer:  'Innate wielders of raw magic',
  warlock:   'Pact-bound seekers of forbidden power',
  wizard:    'Scholars of the arcane arts',
};

const ABILITY_FULL = {
  str: 'Strength', dex: 'Dexterity', con: 'Constitution',
  int: 'Intelligence', wis: 'Wisdom', cha: 'Charisma',
};

/* ================================================================
   SVG ICONS
================================================================ */
const I = {
  d20: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2L3 7v10l9 5 9-5V7L12 2z"/><path d="M3 7l9 5 9-5"/><path d="M12 22V12"/>
    <path d="M3 7l9 2.5L21 7"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>`,
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5M12 19l-7-7 7-7"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>`,
  speed: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`,
  ruler: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M3 12l3-3 3 3 3-3 3 3 3-3 3 3M3 18l3-3 3 3 3-3 3 3 3-3 3 3"/></svg>`,
};

/* ================================================================
   API LAYER  (fetch + localStorage cache)
================================================================ */
const Api = {
  _mem: null,
  _cache() {
    if (!this._mem) {
      try { this._mem = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); }
      catch { this._mem = {}; }
    }
    return this._mem;
  },
  _flush() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(this._mem)); }
    catch { /* storage full — cache misses are fine */ }
  },
  async get(path) {
    const c = this._cache();
    if (c[path]) return c[path];
    const r = await fetch(path.startsWith('http') ? path : API_BASE + path);
    if (!r.ok) throw new Error(`HTTP ${r.status} — ${path}`);
    const data = await r.json();
    c[path] = data;
    this._flush();
    return data;
  },
};

/* ================================================================
   CHARACTER STORE
================================================================ */
const Store = {
  all() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
    catch { return []; }
  },
  one(id) { return this.all().find(c => c.id === id) || null; },
  save(char) {
    char.updatedAt = Date.now();
    const list = this.all();
    const i = list.findIndex(c => c.id === char.id);
    if (i >= 0) list[i] = char; else list.unshift(char);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
    catch { Toast.show('Storage full — delete a character to free space.', 'error'); }
    return char;
  },
  del(id) {
    const list = this.all().filter(c => c.id !== id);
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
  },
  blank() {
    return {
      id: crypto.randomUUID(),
      createdAt: Date.now(),
      updatedAt: Date.now(),
      step: 'race',         // current creation step
      portrait: null,       // base64 or null
      name: '',
      alignment: '',
      personalityTraits: [],
      ideal: '',
      bond: '',
      flaw: '',
      // Choices
      race:       null,     // { index, name, speed, size, ability_bonuses, traits, languages, language_options, starting_proficiencies, subraces }
      subrace:    null,     // { index, name, ability_bonuses, racial_traits } or null
      klass:      null,     // 'class' is a reserved word
      background: null,
      abilityMethod: null,  // 'standard' | 'pointbuy' | 'roll'
      baseScores: { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 },
      rolledPool: [],       // 6 rolled values (roll method)
      abilityAssign: {},    // ability -> index into pool (standard/roll methods)
      skillProficiencies: [],
      bonusLanguages: [],
      cantrips:     [],
      spellNames:   {},     // spell index -> name
      spellSlots1:  0,
      level1Spells: [],
      subclassChoice: null,
      fightingStyle:  null,
      equipment: [],
      useGold: false,
      startGold: 0,
    };
  },
};

/* ================================================================
   TOAST
================================================================ */
const Toast = {
  show(msg, type = 'info', ms = 3200) {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toast-root').appendChild(el);
    setTimeout(() => el.remove(), ms);
  },
};

/* ================================================================
   HELPERS
================================================================ */
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Move a character forward to `id`, never backwards and never out of 'complete'.
function advanceStep(char, id) {
  if (char.step === 'complete') return;
  if (STEPS.findIndex(x => x.id === char.step) < STEPS.findIndex(x => x.id === id)) char.step = id;
}

function asiLabel(bonuses) {
  if (!bonuses?.length) return '';
  return bonuses.map(b => {
    const name = ABILITY_FULL[b.ability_score.index] || b.ability_score.name;
    return `${name} +${b.bonus}`;
  }).join(', ');
}

/* ================================================================
   ROUTER / APP
================================================================ */
const App = {
  page: 'home',
  ctx: {},

  go(page, ctx = {}) {
    this.page = page;
    this.ctx  = ctx;
    document.getElementById('app').innerHTML = '';
    window.scrollTo(0, 0);
    this.render();
  },

  render() {
    const root = document.getElementById('app');
    switch (this.page) {
      case 'home': HomeView.render(root); break;
      case 'race':  RaceView.render(root, this.ctx); break;
      case 'class': ClassView.render(root, this.ctx); break;
      case 'abilities': AbilityView.render(root, this.ctx); break;
      case 'background': BackgroundView.render(root, this.ctx); break;
      case 'choices': ChoicesView.render(root, this.ctx); break;
      case 'skills': SkillsView.render(root, this.ctx); break;
      case 'equipment': EquipmentView.render(root, this.ctx); break;
      case 'details': DetailsView.render(root, this.ctx); break;
      case 'sheet': SheetView.render(root, this.ctx); break;
      default:
        root.innerHTML = `<div class="loading"><p>Page not found</p></div>`;
    }
  },

  newCharacter() {
    const c = Store.blank();
    Store.save(c);
    App.go('race', { charId: c.id });
  },

  openCharacter(id) {
    const c = Store.one(id);
    if (!c) return;
    const dest = c.step === 'complete' ? 'sheet'
      : STEPS.some(x => x.id === c.step) ? c.step : 'race';
    App.go(dest, { charId: id });
  },

  deleteCharacter(id) {
    if (!confirm('Delete this character? This cannot be undone.')) return;
    Store.del(id);
    App.render();
  },
};

/* ================================================================
   HOME VIEW
================================================================ */
const HomeView = {
  render(root) {
    const chars = Store.all();
    root.innerHTML = `
      <header class="site-header">
        <div class="site-logo">${I.d20}<span>D&amp;D 5e Creator</span></div>
      </header>
      <main class="home-main">
        <div class="home-top">
          <h1>Your Characters</h1>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-outline" onclick="Transfer.pickImport()">Import JSON</button>
            <button class="btn btn-primary" onclick="App.newCharacter()">
              ${I.plus} New Character
            </button>
          </div>
        </div>
        <div class="char-grid">
          ${chars.length ? chars.map(c => this._card(c)).join('') : this._empty()}
        </div>
      </main>`;
  },

  _empty() {
    return `
      <div class="empty-state">
        <div class="empty-state-icon">🎲</div>
        <h3>No Characters Yet</h3>
        <p>Begin your adventure by creating your first character.</p>
        <button class="btn btn-primary" onclick="App.newCharacter()">
          ${I.plus} Create First Character
        </button>
      </div>`;
  },

  _card(c) {
    const icon    = RACE_ICONS[c.race?.index] || '🎲';
    const name    = c.name || 'Unnamed Adventurer';
    const done    = c.step === 'complete';
    const race    = c.race?.name  || null;
    const klass   = c.klass?.name || null;
    const subline = race
      ? (klass ? `${race} ${klass}` : `${race} · choose class next`)
      : 'In progress · choose race';
    const stepLabel = STEPS.find(x => x.id === c.step)?.label;

    return `
      <div class="char-card" onclick="App.openCharacter('${c.id}')">
        <div class="char-avatar">${c.portrait ? `<img src="${esc(c.portrait)}" alt="">` : icon}</div>
        ${!done ? `<div class="char-badge">In Progress</div>` : ''}
        <div class="char-card-body">
          <div class="char-name">${esc(name)}</div>
          <div class="char-subtitle">${esc(subline)}</div>
          ${!done && stepLabel ? `<div class="char-subtitle" style="margin-top:2px;color:var(--text-muted)">Next: ${esc(stepLabel)}</div>` : ''}
        </div>
        <div class="char-card-actions" onclick="event.stopPropagation()">
          <button class="btn btn-ghost" style="font-size:0.78rem" onclick="App.openCharacter('${c.id}')">
            ${I.edit} Edit
          </button>
          <button class="btn btn-ghost danger" style="font-size:0.78rem;margin-left:auto"
                  onclick="App.deleteCharacter('${c.id}')">
            ${I.trash}
          </button>
        </div>
      </div>`;
  },
};

/* ================================================================
   WIZARD SHELL HELPER
================================================================ */
function wizardShell(activeStepId, bodyHtml, footerHtml) {
  const activeIdx = STEPS.findIndex(s => s.id === activeStepId);
  const pips = STEPS.map((s, i) => {
    const cls = i === activeIdx ? 'active' : i < activeIdx ? 'done' : '';
    return `${i > 0 ? `<span class="step-sep">›</span>` : ''}
      <span class="step-pip ${cls}"><span class="pip-dot"></span>${s.label}</span>`;
  }).join('');

  return `
    <div class="wizard-layout">
      <header class="wizard-header">
        <nav class="wizard-nav">
          <button class="btn btn-ghost" onclick="App.go('home')">${I.back} Home</button>
          <span class="wizard-title">Character Creation</span>
          <div style="width:72px"></div>
        </nav>
        <div class="wizard-steps-bar">${pips}</div>
      </header>
      <div class="wizard-body" id="wizard-body">${bodyHtml}</div>
      <footer class="wizard-footer">
        <span class="footer-hint" id="footer-hint"></span>
        ${footerHtml}
      </footer>
    </div>`;
}

const RaceView = {
  // Module-level state for this step
  charId:          null,
  allRaces:        [],           // full race objects from API
  subraceCache:    {},           // index → full subrace object
  selectedRace:    null,
  selectedSubrace: null,
  traitDescCache:  {},           // trait index → desc string

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell(
      'race',
      `<div class="loading"><div class="spinner"></div><span>Loading races…</span></div>`,
      `<button class="btn btn-primary" id="continue-btn" disabled onclick="RaceView.save()">
         Save &amp; Continue →
       </button>`,
    );
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      const list = await Api.get('/races');

      // Fetch all race details in parallel (9 races — worth the upfront cost for instant switching)
      const races = await Promise.all(list.results.map(r => Api.get(`/races/${r.index}`)));
      races.sort((a, b) => a.name.localeCompare(b.name));

      this.allRaces        = races;
      this.subraceCache    = {};
      this.traitDescCache  = {};
      this.selectedRace    = null;
      this.selectedSubrace = null;

      // Pre-load subraces if character already has a race with subraces
      if (char.race?.subraces?.length) {
        await this._loadSubraces(char.race.index);
      }

      // Restore previous selections
      if (char.race) {
        this.selectedRace    = races.find(r => r.index === char.race.index) || null;
        this.selectedSubrace = char.subrace
          ? (this.subraceCache[char.subrace.index] || null)
          : null;
      }

      this._renderPanels();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `
        <div class="error-box">
          <p>Failed to load races: ${esc(e.message)}</p>
          <button class="btn btn-outline" onclick="RaceView._load()">Retry</button>
        </div>`;
    }
  },

  async _loadSubraces(raceIndex) {
    const race = this.allRaces.find(r => r.index === raceIndex);
    if (!race?.subraces?.length) return;
    const subs = await Promise.all(race.subraces.map(s => Api.get(`/subraces/${s.index}`)));
    subs.forEach(s => { this.subraceCache[s.index] = s; });
  },

  _renderPanels() {
    const char = Store.one(this.charId);
    document.getElementById('wizard-body').innerHTML = `
      <div class="race-step">
        <div class="race-list-panel" id="race-list">
          <div class="panel-label">Choose Your Race</div>
          ${this.allRaces.map(r => `
            <button class="race-option ${this.selectedRace?.index === r.index ? 'selected' : ''}"
                    data-ridx="${r.index}"
                    onclick="RaceView.pickRace('${r.index}')">
              <span class="race-opt-icon">${RACE_ICONS[r.index] || '🎲'}</span>
              <span>
                <div class="race-opt-name">${esc(r.name)}</div>
                <div class="race-opt-tag">${esc(RACE_TAGS[r.index] || '')}</div>
              </span>
            </button>`).join('')}
        </div>
        <div class="race-detail-panel" id="race-detail">
          ${this.selectedRace ? this._detailHtml(this.selectedRace) : this._emptyDetail()}
        </div>
      </div>`;
    this._syncFooter();
  },

  _emptyDetail() {
    return `<div class="race-empty">
      <div class="race-empty-icon">⚔️</div>
      <p>Select a race from the list to see its traits and abilities.</p>
    </div>`;
  },

  async pickRace(raceIndex) {
    const race = this.allRaces.find(r => r.index === raceIndex);
    if (!race) return;

    this.selectedRace    = race;
    this.selectedSubrace = null;

    // Highlight selected in list
    document.querySelectorAll('.race-option').forEach(el => {
      el.classList.toggle('selected', el.dataset.ridx === raceIndex);
    });

    // Show spinner in detail while loading subraces
    const detail = document.getElementById('race-detail');
    detail.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;

    if (race.subraces?.length) {
      await this._loadSubraces(raceIndex);
    }

    detail.innerHTML = this._detailHtml(race);
    detail.scrollTop = 0;
    this._syncFooter();
  },

  _detailHtml(race) {
    const subraces = (race.subraces || [])
      .map(s => this.subraceCache[s.index])
      .filter(Boolean);
    const hasSubraces = race.subraces?.length > 0;

    return `
      <div class="detail-header">
        <span class="detail-icon">${RACE_ICONS[race.index] || '🎲'}</span>
        <div>
          <h2 class="detail-title">${esc(race.name)}</h2>
          <div class="detail-meta">
            <span class="meta-pill">${I.speed} ${race.speed} ft</span>
            <span class="meta-pill">${I.ruler} ${esc(race.size || 'Medium')}</span>
          </div>
        </div>
      </div>

      ${race.ability_bonuses?.length ? `
        <div class="section">
          <div class="section-label">Ability Score Increases</div>
          <div class="asi-row">
            ${race.ability_bonuses.map(b => `
              <div class="asi-chip">
                ${esc(ABILITY_FULL[b.ability_score.index] || b.ability_score.name)}
                <span class="bonus">+${b.bonus}</span>
              </div>`).join('')}
          </div>
        </div>` : ''}

      ${race.traits?.length ? `
        <div class="section">
          <div class="section-label">Racial Traits</div>
          <div class="trait-list">
            ${race.traits.map(t => `
              <div class="trait-item" id="ti-${t.index}">
                <div class="trait-header" onclick="RaceView.toggleTrait('${t.index}')">
                  <span class="trait-name">${esc(t.name)}</span>
                  <span class="trait-chevron">${I.chevron}</span>
                </div>
                <div class="trait-body" id="tb-${t.index}">
                  <span class="trait-loading">Loading…</span>
                </div>
              </div>`).join('')}
          </div>
        </div>` : ''}

      ${race.languages?.length ? `
        <div class="section">
          <div class="section-label">Languages</div>
          <div class="chip-row">
            ${race.languages.map(l => `<span class="chip">${esc(l.name)}</span>`).join('')}
            ${race.language_options?.choose
              ? `<span class="chip dashed">+ ${race.language_options.choose} of your choice</span>`
              : ''}
          </div>
        </div>` : ''}

      ${race.starting_proficiencies?.length ? `
        <div class="section">
          <div class="section-label">Proficiencies</div>
          <div class="chip-row">
            ${race.starting_proficiencies.map(p => `<span class="chip">${esc(p.name)}</span>`).join('')}
          </div>
        </div>` : ''}

      ${hasSubraces ? `
        <div class="section">
          <div class="section-label">Choose Subrace</div>
          ${subraces.length === 0
            ? `<div class="loading" style="padding:20px"><div class="spinner"></div></div>`
            : `<div class="subrace-grid">
                ${subraces.map(s => {
                  const sel = this.selectedSubrace?.index === s.index;
                  return `
                    <button class="subrace-card ${sel ? 'selected' : ''}"
                            data-sidx="${s.index}"
                            onclick="RaceView.pickSubrace('${s.index}')">
                      <div class="subrace-name">${esc(s.name)}</div>
                      ${s.ability_bonuses?.length
                        ? `<div class="subrace-asis">${esc(asiLabel(s.ability_bonuses))}</div>`
                        : ''}
                      ${s.racial_traits?.length
                        ? `<div class="subrace-traits">Traits: ${s.racial_traits.map(t => t.name).join(', ')}</div>`
                        : ''}
                    </button>`;
                }).join('')}
              </div>`}
        </div>` : ''}`;
  },

  async toggleTrait(traitIndex) {
    const item = document.getElementById(`ti-${traitIndex}`);
    if (!item) return;
    const wasOpen = item.classList.contains('open');
    item.classList.toggle('open', !wasOpen);

    if (!wasOpen) {
      const body = document.getElementById(`tb-${traitIndex}`);
      if (!body || !body.querySelector('.trait-loading')) return;
      if (this.traitDescCache[traitIndex]) {
        body.textContent = this.traitDescCache[traitIndex];
        return;
      }
      try {
        const data = await Api.get(`/traits/${traitIndex}`);
        const desc = data.desc?.join('\n\n') || 'No description available.';
        this.traitDescCache[traitIndex] = desc;
        if (body) body.textContent = desc;
      } catch {
        if (body) body.textContent = 'Could not load description.';
      }
    }
  },

  pickSubrace(subraceIndex) {
    this.selectedSubrace = this.subraceCache[subraceIndex] || null;
    document.querySelectorAll('.subrace-card').forEach(el => {
      el.classList.toggle('selected', el.dataset.sidx === subraceIndex);
    });
    this._syncFooter();
  },

  _syncFooter() {
    const btn  = document.getElementById('continue-btn');
    const hint = document.getElementById('footer-hint');
    if (!btn) return;

    const race        = this.selectedRace;
    const needsSub    = race?.subraces?.length > 0;
    const hasValidSub = !needsSub || this.selectedSubrace !== null;
    const ready       = !!race && hasValidSub;

    btn.disabled = !ready;

    if (!race) {
      hint.textContent = 'Select a race to continue.';
    } else if (needsSub && !hasValidSub) {
      hint.textContent = `Choose a ${race.name} subrace to continue.`;
    } else {
      const sub = this.selectedSubrace ? ` · ${this.selectedSubrace.name}` : '';
      hint.textContent = `${race.name}${sub} — ready!`;
    }
  },

  save() {
    const race = this.selectedRace;
    if (!race) return;

    const char = Store.one(this.charId);
    if (!char) return;

    // Persist only the fields we need (avoid bloating localStorage with full API dumps)
    char.race = {
      index:                  race.index,
      name:                   race.name,
      speed:                  race.speed,
      size:                   race.size,
      ability_bonuses:        race.ability_bonuses || [],
      traits:                 race.traits || [],
      languages:              race.languages || [],
      language_options:       race.language_options || null,
      starting_proficiencies: race.starting_proficiencies || [],
      subraces:               race.subraces || [],
    };

    const sr = this.selectedSubrace;
    char.subrace = sr ? {
      index:          sr.index,
      name:           sr.name,
      ability_bonuses: sr.ability_bonuses || [],
      racial_traits:  sr.racial_traits || [],
      language_options: sr.language_options || null,
    } : null;

    // Advance, but never move a character backwards if they are re-editing race
    advanceStep(char, 'class');
    Store.save(char);
    Toast.show(`${race.name} saved!`, 'success');
    App.go('class', { charId: this.charId });
  },
};

const ClassView = {
  charId:        null,
  allClasses:    [],     // full class objects from API
  selectedClass: null,

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell(
      'class',
      `<div class="loading"><div class="spinner"></div><span>Loading classes…</span></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('race', { charId: '${charId}' })">← Race</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="ClassView.save()">
           Save &amp; Continue →
         </button>
       </div>`,
    );
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      const list = await Api.get('/classes');
      const classes = await Promise.all(list.results.map(c => Api.get(`/classes/${c.index}`)));
      classes.sort((a, b) => a.name.localeCompare(b.name));

      this.allClasses    = classes;
      this.selectedClass = char?.klass
        ? (classes.find(c => c.index === char.klass.index) || null)
        : null;

      this._renderPanels();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `
        <div class="error-box">
          <p>Failed to load classes: ${esc(e.message)}</p>
          <button class="btn btn-outline" onclick="ClassView._load()">Retry</button>
        </div>`;
    }
  },

  _renderPanels() {
    document.getElementById('wizard-body').innerHTML = `
      <div class="race-step">
        <div class="race-list-panel">
          <div class="panel-label">Choose Your Class</div>
          ${this.allClasses.map(c => `
            <button class="race-option ${this.selectedClass?.index === c.index ? 'selected' : ''}"
                    data-cidx="${c.index}"
                    onclick="ClassView.pickClass('${c.index}')">
              <span class="race-opt-icon">${CLASS_ICONS[c.index] || '🎲'}</span>
              <span>
                <div class="race-opt-name">${esc(c.name)}</div>
                <div class="race-opt-tag">${esc(CLASS_TAGS[c.index] || '')}</div>
              </span>
            </button>`).join('')}
        </div>
        <div class="race-detail-panel" id="class-detail">
          ${this.selectedClass ? this._detailHtml(this.selectedClass) : this._emptyDetail()}
        </div>
      </div>`;
    this._syncFooter();
  },

  _emptyDetail() {
    return `<div class="race-empty">
      <div class="race-empty-icon">🛡️</div>
      <p>Select a class from the list to see its proficiencies and features.</p>
    </div>`;
  },

  pickClass(classIndex) {
    const klass = this.allClasses.find(c => c.index === classIndex);
    if (!klass) return;
    this.selectedClass = klass;
    document.querySelectorAll('.race-option').forEach(el => {
      el.classList.toggle('selected', el.dataset.cidx === classIndex);
    });
    const detail = document.getElementById('class-detail');
    detail.innerHTML = this._detailHtml(klass);
    detail.scrollTop = 0;
    this._syncFooter();
  },

  _detailHtml(k) {
    const saves  = (k.saving_throws || []).map(s => ABILITY_FULL[s.index] || s.name);
    const skillChoice = k.proficiency_choices?.[0];
    const skillOpts   = (skillChoice?.from?.options || [])
      .map(o => (o.item?.name || '').replace(/^Skill: /, ''))
      .filter(Boolean);
    const caster = k.spellcasting;

    return `
      <div class="detail-header">
        <span class="detail-icon">${CLASS_ICONS[k.index] || '🎲'}</span>
        <div>
          <h2 class="detail-title">${esc(k.name)}</h2>
          <div class="detail-meta">
            <span class="meta-pill">Hit Die d${k.hit_die}</span>
            ${caster
              ? `<span class="meta-pill">Spellcasting · ${esc(ABILITY_FULL[caster.spellcasting_ability?.index] || '')}</span>`
              : ''}
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Saving Throws</div>
        <div class="asi-row">
          ${saves.map(n => `<div class="asi-chip">${esc(n)}</div>`).join('')}
        </div>
      </div>

      ${k.proficiencies?.length ? `
        <div class="section">
          <div class="section-label">Armor, Weapon &amp; Tool Proficiencies</div>
          <div class="chip-row">
            ${k.proficiencies
              .filter(p => !p.index.startsWith('saving-throw-'))
              .map(p => `<span class="chip">${esc(p.name)}</span>`).join('')}
          </div>
        </div>` : ''}

      ${skillChoice ? `
        <div class="section">
          <div class="section-label">Skills — choose ${skillChoice.choose}</div>
          <div class="chip-row">
            ${skillOpts.map(n => `<span class="chip">${esc(n)}</span>`).join('')}
          </div>
        </div>` : ''}

      ${k.starting_equipment?.length ? `
        <div class="section">
          <div class="section-label">Starting Equipment</div>
          <div class="chip-row">
            ${k.starting_equipment.map(e =>
              `<span class="chip">${e.quantity > 1 ? e.quantity + '× ' : ''}${esc(e.equipment.name)}</span>`).join('')}
          </div>
          ${k.starting_equipment_options?.length
            ? `<p style="margin-top:10px;font-size:0.8rem;color:var(--text-muted)">
                 Plus ${k.starting_equipment_options.length} equipment choices, made later.</p>`
            : ''}
        </div>` : ''}`;
  },

  _syncFooter() {
    const btn  = document.getElementById('continue-btn');
    const hint = document.getElementById('footer-hint');
    if (!btn) return;
    const k = this.selectedClass;
    btn.disabled = !k;
    hint.textContent = k ? `${k.name} — ready!` : 'Select a class to continue.';
  },

  save() {
    const k = this.selectedClass;
    if (!k) return;
    const char = Store.one(this.charId);
    if (!char) return;

    // Changing class invalidates class-dependent choices made later
    if (char.klass && char.klass.index !== k.index) {
      char.skillProficiencies = [];
      char.cantrips = [];
      char.level1Spells = [];
      char.subclassChoice = null;
      char.fightingStyle = null;
      char.equipment = [];
    }

    char.klass = {
      index:                      k.index,
      name:                       k.name,
      hit_die:                    k.hit_die,
      saving_throws:              (k.saving_throws || []).map(s => ({ index: s.index, name: s.name })),
      proficiencies:              (k.proficiencies || []).map(p => ({ index: p.index, name: p.name })),
      proficiency_choices:        k.proficiency_choices || [],
      spellcasting:               k.spellcasting
        ? { ability: k.spellcasting.spellcasting_ability?.index || null }
        : null,
      starting_equipment:         k.starting_equipment || [],
      starting_equipment_options: k.starting_equipment_options || [],
    };

    advanceStep(char, 'abilities');
    Store.save(char);
    Toast.show(`${k.name} saved!`, 'success');
    App.go('abilities', { charId: this.charId });
  },
};

/* ================================================================
   ABILITY VIEW
================================================================ */
const ABILITY_KEYS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
const STANDARD_ARRAY = [15, 14, 13, 12, 10, 8];
const POINT_COST = { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 };
const POINT_BUDGET = 27;

function abilityMod(score) { return Math.floor((score - 10) / 2); }
function fmtMod(m) { return (m >= 0 ? '+' : '') + m; }

const AbilityView = {
  charId: null,
  method: 'standard',
  pool:   [],     // pool values for standard/roll
  assign: {},     // ability -> pool index | null
  points: {},     // ability -> score (point buy)
  racial: {},     // ability -> total racial bonus

  render(root, { charId }) {
    this.charId = charId;
    const char = Store.one(charId);
    this.method = char.abilityMethod || 'standard';
    this.racial = {};
    for (const b of [...(char.race?.ability_bonuses || []), ...(char.subrace?.ability_bonuses || [])]) {
      const k = b.ability_score.index;
      this.racial[k] = (this.racial[k] || 0) + b.bonus;
    }
    this.points = {};
    ABILITY_KEYS.forEach(k => { this.points[k] = 8; });
    if (char.abilityMethod === 'pointbuy') Object.assign(this.points, char.baseScores);
    this.assign = { ...(char.abilityAssign || {}) };
    this._setPool(char.rolledPool);

    root.innerHTML = wizardShell(
      'abilities',
      `<div class="abil-main" id="abil-main"></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('class', { charId: '${charId}' })">← Class</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="AbilityView.save()">
           Save &amp; Continue →
         </button>
       </div>`,
    );
    this._draw();
  },

  _setPool(saved) {
    if (this.method === 'standard') this.pool = [...STANDARD_ARRAY];
    else if (this.method === 'roll') this.pool = saved?.length === 6 ? [...saved] : [];
    else this.pool = [];
  },

  setMethod(m) {
    this.method = m;
    this.assign = {};
    this._setPool(Store.one(this.charId)?.rolledPool);
    this._draw();
  },

  roll() {
    // 4d6, drop the lowest die
    this.pool = Array.from({ length: 6 }, () => {
      const d = Array.from({ length: 4 }, () => 1 + Math.floor(Math.random() * 6));
      return d.reduce((a, b) => a + b, 0) - Math.min(...d);
    });
    this.assign = {};
    this._draw();
  },

  assignScore(ab, val) {
    if (val === '') delete this.assign[ab]; else this.assign[ab] = Number(val);
    this._draw();
  },

  adjust(ab, delta) {
    const next = this.points[ab] + delta;
    if (next < 8 || next > 15) return;
    if (delta > 0 && this._spent() - POINT_COST[this.points[ab]] + POINT_COST[next] > POINT_BUDGET) return;
    this.points[ab] = next;
    this._draw();
  },

  _spent() { return ABILITY_KEYS.reduce((n, k) => n + POINT_COST[this.points[k]], 0); },

  _base(ab) {
    if (this.method === 'pointbuy') return this.points[ab];
    const i = this.assign[ab];
    return i == null ? null : this.pool[i];
  },

  _isValid() {
    if (this.method === 'pointbuy') return this._spent() <= POINT_BUDGET;
    return this.pool.length === 6 && ABILITY_KEYS.every(k => this.assign[k] != null);
  },

  _draw() {
    const used = new Set(Object.values(this.assign));
    const tabs = [['standard', 'Standard Array'], ['pointbuy', 'Point Buy'], ['roll', '4d6 Roll']]
      .map(([id, label]) => `<button class="method-tab ${this.method === id ? 'active' : ''}"
        onclick="AbilityView.setMethod('${id}')">${label}</button>`).join('');

    let note = '', pool = '';
    if (this.method === 'standard') {
      note = 'Assign each value of the standard array to one ability.';
    } else if (this.method === 'pointbuy') {
      note = `Spend up to ${POINT_BUDGET} points. Scores range from 8 to 15.
              <span class="pb-points">${POINT_BUDGET - this._spent()} points left</span>`;
    } else {
      note = 'Roll 4d6 and drop the lowest die, six times, then assign the results.';
      pool = `<button class="btn btn-outline" onclick="AbilityView.roll()">
                ${I.d20} ${this.pool.length ? 'Reroll All' : 'Roll Scores'}</button>`;
    }
    if (this.method !== 'pointbuy' && this.pool.length) {
      pool += this.pool.map((v, i) =>
        `<span class="pool-chip ${used.has(i) ? 'used' : ''}">${v}</span>`).join('');
    }

    const cards = ABILITY_KEYS.map(ab => {
      const base  = this._base(ab);
      const bonus = this.racial[ab] || 0;
      const total = base == null ? null : base + bonus;
      let ctl;
      if (this.method === 'pointbuy') {
        const sc = this.points[ab];
        const canUp = sc < 15 && this._spent() - POINT_COST[sc] + POINT_COST[sc + 1] <= POINT_BUDGET;
        ctl = `<div class="abil-ctl">
          <button class="pb-btn" ${sc <= 8 ? 'disabled' : ''} onclick="AbilityView.adjust('${ab}',-1)">−</button>
          <span class="pb-val">${sc}</span>
          <button class="pb-btn" ${canUp ? '' : 'disabled'} onclick="AbilityView.adjust('${ab}',1)">+</button>
        </div>`;
      } else {
        const mine = this.assign[ab];
        ctl = `<select class="abil-select" onchange="AbilityView.assignScore('${ab}', this.value)">
          <option value="">${this.pool.length ? '— assign —' : 'Roll first'}</option>
          ${this.pool.map((v, i) => (used.has(i) && i !== mine) ? '' :
            `<option value="${i}" ${i === mine ? 'selected' : ''}>${v}</option>`).join('')}
        </select>`;
      }
      return `<div class="abil-card">
        <div class="abil-name">${ABILITY_FULL[ab]}</div>
        <div class="abil-total">${total ?? '—'}</div>
        <div class="abil-mod">${total == null ? '' : 'Modifier ' + fmtMod(abilityMod(total))}</div>
        <div class="abil-break">${base ?? '—'} base${bonus ? ` <span class="bonus">+ ${bonus} racial</span>` : ''}</div>
        ${ctl}
      </div>`;
    }).join('');

    document.getElementById('abil-main').innerHTML = `
      <div class="method-tabs">${tabs}</div>
      <p class="abil-note">${note}</p>
      ${pool ? `<div class="pool-row">${pool}</div>` : ''}
      <div class="abil-grid">${cards}</div>`;

    const ok = this._isValid();
    document.getElementById('continue-btn').disabled = !ok;
    document.getElementById('footer-hint').textContent = ok
      ? 'Ability scores ready!'
      : this.method === 'roll' && !this.pool.length ? 'Roll your scores to continue.'
      : 'Assign every ability score to continue.';
  },

  save() {
    if (!this._isValid()) return;
    const char = Store.one(this.charId);
    if (!char) return;
    char.abilityMethod = this.method;
    char.baseScores    = Object.fromEntries(ABILITY_KEYS.map(k => [k, this._base(k)]));
    char.rolledPool    = this.method === 'roll' ? this.pool : char.rolledPool || [];
    char.abilityAssign = this.method === 'pointbuy' ? {} : this.assign;
    advanceStep(char, 'background');
    Store.save(char);
    Toast.show('Ability scores saved!', 'success');
    App.go('background', { charId: this.charId });
  },
};

/* ================================================================
   BACKGROUND VIEW
================================================================ */
// Option entries are either { string } or { desc, alignments } depending on the pool
function bgOptionText(o) { return o.string || o.desc || ''; }
function bgPool(p) {
  return { choose: p?.choose || 0, options: (p?.from?.options || []).map(bgOptionText).filter(Boolean) };
}

const NUM_WORDS = { one: 1, two: 2, three: 3, four: 4 };

// Open5e backgrounds are free-text strings; map them onto the dnd5eapi shape used by this view.
function normalizeOpen5eBackground(o) {
  const split = str => (str || '').split(/,\s*|\s+and\s+/).map(x => x.trim().replace(/\.$/, '')).filter(Boolean);
  const langs = o.languages || '';
  const m = langs.match(/\b(one|two|three|four|\d)\b/i);
  const chooseN = /of your choice/i.test(langs) && m ? (NUM_WORDS[m[1].toLowerCase()] || Number(m[1])) : 0;
  return {
    index: 'o5e-' + o.slug,
    name: o.name,
    source: o.document__title || 'Open5e',
    starting_proficiencies: split(o.skill_proficiencies).map(n => ({ index: 'skill-' + n.toLowerCase().replace(/\s+/g, '-'), name: 'Skill: ' + n })),
    tool_text: o.tool_proficiencies || '',
    language_options: chooseN ? { choose: chooseN } : null,
    language_text: chooseN ? '' : langs,
    starting_equipment: split(o.equipment).map(n => ({ equipment: { index: null, name: n }, quantity: 1 })),
    feature: o.feature ? { name: o.feature, desc: (o.feature_desc || '').split(/\n+/).filter(Boolean) } : null,
    characteristics_text: o.suggested_characteristics || '',
  };
}

const BackgroundView = {
  charId:      null,
  all:         [],
  selected:    null,

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell(
      'background',
      `<div class="loading"><div class="spinner"></div><span>Loading backgrounds…</span></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('abilities', { charId: '${charId}' })">← Abilities</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="BackgroundView.save()">
           Save &amp; Continue →
         </button>
       </div>`,
    );
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      const list = await Api.get('/backgrounds');
      const all  = await Promise.all(list.results.map(b => Api.get(`/backgrounds/${b.index}`)));
      // Extra backgrounds from Open5e; if it is unreachable, carry on with the SRD set.
      try {
        if (!OPEN5E_BASE) throw new Error('Open5e disabled');
        const have = new Set(all.map(b => b.name.toLowerCase()));
        let url = `${OPEN5E_BASE}/backgrounds/?limit=100`;
        for (let page = 0; url && page < 5; page++) {
          const res = await Api.get(url);
          res.results.forEach(o => { if (!have.has(o.name.toLowerCase())) all.push(normalizeOpen5eBackground(o)); });
          url = res.next;
        }
      } catch { /* Open5e optional */ }
      all.sort((a, b) => a.name.localeCompare(b.name));
      this.all      = all;
      this.selected = char?.background
        ? (all.find(b => b.index === char.background.index) || null) : null;
      this._renderPanels();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `
        <div class="error-box">
          <p>Failed to load backgrounds: ${esc(e.message)}</p>
          <button class="btn btn-outline" onclick="BackgroundView._load()">Retry</button>
        </div>`;
    }
  },

  _renderPanels() {
    document.getElementById('wizard-body').innerHTML = `
      <div class="race-step">
        <div class="race-list-panel">
          <div class="panel-label">Choose Your Background</div>
          ${this.all.map(b => `
            <button class="race-option ${this.selected?.index === b.index ? 'selected' : ''}"
                    data-bidx="${b.index}" onclick="BackgroundView.pick('${b.index}')">
              <span class="race-opt-icon">${BG_ICONS[b.index] || '📜'}</span>
              <span><div class="race-opt-name">${esc(b.name)}</div></span>
            </button>`).join('')}
        </div>
        <div class="race-detail-panel" id="bg-detail">
          ${this.selected ? this._detailHtml(this.selected) : `<div class="race-empty">
            <div class="race-empty-icon">📜</div>
            <p>Select a background to see its skills, feature and equipment.</p></div>`}
        </div>
      </div>`;
    this._syncFooter();
  },

  pick(index) {
    const b = this.all.find(x => x.index === index);
    if (!b) return;
    this.selected = b;
    document.querySelectorAll('.race-option').forEach(el => {
      el.classList.toggle('selected', el.dataset.bidx === index);
    });
    const d = document.getElementById('bg-detail');
    d.innerHTML = this._detailHtml(b);
    d.scrollTop = 0;
    this._syncFooter();
  },

  _detailHtml(b) {
    const profs = (b.starting_proficiencies || []).map(p => p.name.replace(/^Skill: /, ''));
    const langs = b.language_options;
    const gear  = b.starting_equipment || [];
    const flavor = [
      ['Personality Traits', bgPool(b.personality_traits)],
      ['Ideals',             bgPool(b.ideals)],
      ['Bonds',              bgPool(b.bonds)],
      ['Flaws',              bgPool(b.flaws)],
    ].filter(([, p]) => p.options.length);

    return `
      <div class="detail-header">
        <span class="detail-icon">${BG_ICONS[b.index] || '📜'}</span>
        <div><h2 class="detail-title">${esc(b.name)}</h2>
          ${b.source ? `<div class="detail-meta"><span class="meta-pill">${esc(b.source)}</span></div>` : ''}</div>
      </div>

      ${profs.length ? `
        <div class="section"><div class="section-label">Skill Proficiencies</div>
          <div class="chip-row">${profs.map(n => `<span class="chip">${esc(n)}</span>`).join('')}</div>
        </div>` : ''}

      ${b.tool_text ? `
        <div class="section"><div class="section-label">Tool Proficiencies</div>
          <div class="chip-row"><span class="chip">${esc(b.tool_text)}</span></div>
        </div>` : ''}

      ${langs?.choose || b.language_text ? `
        <div class="section"><div class="section-label">Languages</div>
          <div class="chip-row">${langs?.choose
            ? `<span class="chip dashed">${langs.choose} of your choice</span>`
            : `<span class="chip">${esc(b.language_text)}</span>`}</div>
        </div>` : ''}

      ${gear.length ? `
        <div class="section"><div class="section-label">Starting Equipment</div>
          <div class="chip-row">${gear.map(e =>
            `<span class="chip">${e.quantity > 1 ? e.quantity + '× ' : ''}${esc(e.equipment.name)}</span>`).join('')}</div>
        </div>` : ''}

      ${b.feature ? `
        <div class="section"><div class="section-label">Feature — ${esc(b.feature.name)}</div>
          <p style="font-size:0.85rem;color:var(--text-secondary);line-height:1.65;white-space:pre-line">${esc((b.feature.desc || []).join('\n\n'))}</p>
        </div>` : ''}

      ${b.characteristics_text ? `
        <div class="section"><div class="section-label">Suggested Characteristics</div>
          <p style="font-size:0.82rem;color:var(--text-secondary);line-height:1.6;white-space:pre-line">${esc(b.characteristics_text)}</p>
        </div>` : ''}

      ${flavor.map(([label, p]) => `
        <div class="section"><div class="section-label">${label}${p.choose ? ` — choose ${p.choose}` : ''}</div>
          <div class="trait-list">${p.options.map(t =>
            `<div class="trait-item"><div class="trait-header"><span class="trait-name" style="font-weight:400">${esc(t)}</span></div></div>`).join('')}</div>
        </div>`).join('')}`;
  },

  _syncFooter() {
    const btn = document.getElementById('continue-btn');
    const hint = document.getElementById('footer-hint');
    if (!btn) return;
    btn.disabled = !this.selected;
    hint.textContent = this.selected ? `${this.selected.name} — ready!` : 'Select a background to continue.';
  },

  save() {
    const b = this.selected;
    if (!b) return;
    const char = Store.one(this.charId);
    if (!char) return;

    // A different background invalidates previously chosen personality flavor
    if (char.background && char.background.index !== b.index) {
      char.personalityTraits = []; char.ideal = ''; char.bond = ''; char.flaw = '';
      char.equipment = [];
    }

    char.background = {
      index:               b.index,
      name:                b.name,
      skill_proficiencies: (b.starting_proficiencies || []).map(p => ({ index: p.index, name: p.name })),
      source:              b.source || 'SRD',
      tool_text:           b.tool_text || '',
      language_text:       b.language_text || '',
      characteristics_text: b.characteristics_text || '',
      language_options:    b.language_options ? { choose: b.language_options.choose } : null,
      starting_equipment:  b.starting_equipment || [],
      starting_equipment_options: b.starting_equipment_options || [],
      feature:             b.feature ? { name: b.feature.name, desc: b.feature.desc || [] } : null,
      personality_traits:  bgPool(b.personality_traits),
      ideals:              bgPool(b.ideals),
      bonds:               bgPool(b.bonds),
      flaws:               bgPool(b.flaws),
    };

    advanceStep(char, 'choices');
    Store.save(char);
    Toast.show(`${b.name} saved!`, 'success');
    App.go('choices', { charId: this.charId });
  },
};

/* ================================================================
   CHOICES VIEW  (level-1 class choices)
================================================================ */
// Classes that pick a subclass / fighting style at level 1 (2014 SRD rules)
const LEVEL1_SUBCLASS = { cleric: 'Divine Domain', sorcerer: 'Sorcerous Origin', warlock: 'Otherworldly Patron' };
const LEVEL1_FIGHTING_STYLE = ['fighter'];

function finalScore(char, ab) {
  let n = char.baseScores?.[ab] ?? 8;
  for (const b of [...(char.race?.ability_bonuses || []), ...(char.subrace?.ability_bonuses || [])]) {
    if (b.ability_score.index === ab) n += b.bonus;
  }
  return n;
}

const ChoicesView = {
  charId: null,
  need:   null,      // { cantrips, spells, spellsLabel, subclass: {label, options}, styles: [] }
  lists:  { cantrips: [], spells: [] },
  sel:    { cantrips: new Set(), spells: new Set(), subclass: null, style: null },
  descCache: {},

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell(
      'choices',
      `<div class="loading"><div class="spinner"></div><span>Loading class options…</span></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('background', { charId: '${charId}' })">← Background</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="ChoicesView.save()">
           Save &amp; Continue →
         </button>
       </div>`,
    );
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      const k = char.klass;
      if (!k) { App.go('class', { charId: this.charId }); return; }

      const lvl1 = await Api.get(`/classes/${k.index}/levels/1`);
      const sc = lvl1.spellcasting || {};
      const casts = (sc.spell_slots_level_1 || 0) > 0 || (sc.cantrips_known || 0) > 0;

      const need = { cantrips: 0, spells: 0, slots: sc.spell_slots_level_1 || 0, spellsLabel: 'Spells', subclass: null, styles: [] };
      this.lists = { cantrips: [], spells: [] };

      if (casts) {
        const mod = abilityMod(finalScore(char, k.spellcasting?.ability || 'int'));
        need.cantrips = sc.cantrips_known || 0;
        if (sc.spells_known != null) {
          need.spells = sc.spells_known; need.spellsLabel = 'Spells Known';
        } else if (k.index === 'wizard') {
          need.spells = 6; need.spellsLabel = 'Spellbook Spells';
        } else {
          need.spells = Math.max(1, mod + 1); need.spellsLabel = 'Prepared Spells';
        }
        const all = await Api.get(`/classes/${k.index}/spells`);
        const byName = (a, b) => a.name.localeCompare(b.name);
        this.lists.cantrips = all.results.filter(x => x.level === 0).sort(byName);
        this.lists.spells   = all.results.filter(x => x.level === 1).sort(byName);
      }

      if (LEVEL1_SUBCLASS[k.index]) {
        const cls  = await Api.get(`/classes/${k.index}`);
        const subs = await Promise.all((cls.subclasses || []).map(x => Api.get(`/subclasses/${x.index}`)));
        need.subclass = { label: LEVEL1_SUBCLASS[k.index], options: subs };
      }

      if (LEVEL1_FIGHTING_STYLE.includes(k.index)) {
        const feat = await Api.get(`/features/${k.index}-fighting-style`);
        const opts = feat.feature_specific?.subfeature_options?.from?.options || [];
        need.styles = opts.map(o => o.item).filter(Boolean);
      }

      this.need = need;
      this.sel = {
        cantrips: new Set(char.cantrips || []),
        spells:   new Set(char.level1Spells || []),
        subclass: char.subclassChoice?.index || null,
        style:    char.fightingStyle?.index || null,
      };
      // Drop stale selections that no longer exist in the lists
      const ok = new Set(this.lists.cantrips.map(x => x.index));
      this.sel.cantrips = new Set([...this.sel.cantrips].filter(i => ok.has(i)));
      const ok2 = new Set(this.lists.spells.map(x => x.index));
      this.sel.spells = new Set([...this.sel.spells].filter(i => ok2.has(i)));

      this._draw();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `
        <div class="error-box">
          <p>Failed to load class options: ${esc(e.message)}</p>
          <button class="btn btn-outline" onclick="ChoicesView._load()">Retry</button>
        </div>`;
    }
  },

  _spellSection(key, title, list, need) {
    const sel = this.sel[key];
    const full = sel.size >= need;
    return `
      <div class="section">
        <div class="section-label">${title} — <span class="pick-count">${sel.size} / ${need}</span></div>
        <div class="spell-list">
          ${list.map(sp => {
            const on = sel.has(sp.index);
            return `
            <div class="spell-row ${on ? 'selected' : ''}" id="sp-${sp.index}">
              <div class="spell-head">
                <button class="spell-pick" ${!on && full ? 'disabled' : ''}
                        onclick="ChoicesView.toggleSpell('${key}','${sp.index}')">
                  <span class="spell-check">${on ? '✓' : ''}</span>${esc(sp.name)}
                </button>
                <button class="spell-info" title="Description" onclick="ChoicesView.toggleDesc('${sp.index}')">${I.chevron}</button>
              </div>
              <div class="spell-desc" id="sd-${sp.index}"></div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  },

  _optionCards(group, items, selected, label) {
    return `
      <div class="section">
        <div class="section-label">${label}</div>
        <div class="subrace-grid">
          ${items.map(o => `
            <button class="subrace-card ${selected === o.index ? 'selected' : ''}"
                    onclick="ChoicesView.pickOption('${group}','${o.index}')">
              <div class="subrace-name">${esc(o.name.replace(/^Fighting Style: /, ''))}</div>
              ${o.desc ? `<div class="subrace-traits">${esc(o.desc[0] || '')}</div>` : ''}
            </button>`).join('')}
        </div>
      </div>`;
  },

  _draw() {
    // Preserve scroll position across re-draws
    const main = document.getElementById('wizard-body');
    const y = window.scrollY;
    const n = this.need;
    const nothing = !n.cantrips && !n.spells && !n.subclass && !n.styles.length;

    main.innerHTML = `<div class="choices-main">
      <h2>Class Choices</h2>
      <p class="choices-sub">${nothing
        ? 'Your class has no choices to make at level 1.'
        : 'Choices your class makes at level 1.'}</p>
      ${n.subclass ? this._optionCards('subclass', n.subclass.options, this.sel.subclass, n.subclass.label) : ''}
      ${n.styles.length ? this._optionCards('style', n.styles, this.sel.style, 'Fighting Style') : ''}
      ${n.cantrips ? this._spellSection('cantrips', 'Cantrips', this.lists.cantrips, n.cantrips) : ''}
      ${n.spells ? this._spellSection('spells', n.spellsLabel, this.lists.spells, n.spells) : ''}
    </div>`;
    window.scrollTo(0, y);
    this._syncFooter();
  },

  toggleSpell(key, index) {
    const set = this.sel[key];
    const max = key === 'cantrips' ? this.need.cantrips : this.need.spells;
    if (set.has(index)) set.delete(index);
    else if (set.size < max) set.add(index);
    this._redrawKeepingOpen();
  },

  _redrawKeepingOpen() {
    const open = [...document.querySelectorAll('.spell-row.open')].map(el => el.id);
    this._draw();
    open.forEach(id => {
      const row = document.getElementById(id);
      if (!row) return;
      row.classList.add('open');
      const idx = id.slice(3);
      if (this.descCache[idx]) document.getElementById('sd-' + idx).textContent = this.descCache[idx];
    });
  },

  async toggleDesc(index) {
    const row = document.getElementById('sp-' + index);
    const body = document.getElementById('sd-' + index);
    if (!row) return;
    const open = row.classList.toggle('open');
    if (!open || this.descCache[index]) { if (open) body.textContent = this.descCache[index]; return; }
    body.textContent = 'Loading…';
    try {
      const d = await Api.get(`/spells/${index}`);
      const head = [d.school?.name, d.casting_time, d.range, d.duration].filter(Boolean).join(' · ');
      this.descCache[index] = head + '\n\n' + (d.desc || []).join('\n\n');
      body.textContent = this.descCache[index];
    } catch { body.textContent = 'Could not load description.'; }
  },

  pickOption(group, index) {
    this.sel[group] = index;
    this._draw();
  },

  _isValid() {
    const n = this.need, s = this.sel;
    if (!n) return false;
    return s.cantrips.size === n.cantrips && s.spells.size === n.spells
      && (!n.subclass || !!s.subclass) && (!n.styles.length || !!s.style);
  },

  _syncFooter() {
    const btn = document.getElementById('continue-btn');
    const hint = document.getElementById('footer-hint');
    if (!btn) return;
    const ok = this._isValid();
    btn.disabled = !ok;
    hint.textContent = ok ? 'Class choices complete!' : 'Make all required choices to continue.';
  },

  save() {
    if (!this._isValid()) return;
    const char = Store.one(this.charId);
    if (!char) return;
    const n = this.need, s = this.sel;
    char.spellNames = {};
    [...this.lists.cantrips, ...this.lists.spells].forEach(x => { char.spellNames[x.index] = x.name; });
    char.spellSlots1  = n.slots || 0;
    char.cantrips     = [...s.cantrips];
    char.level1Spells = [...s.spells];
    const sub = n.subclass?.options.find(o => o.index === s.subclass);
    char.subclassChoice = sub ? { index: sub.index, name: sub.name } : null;
    const st = n.styles.find(o => o.index === s.style);
    char.fightingStyle = st ? { index: st.index, name: st.name.replace(/^Fighting Style: /, '') } : null;

    advanceStep(char, 'skills');
    Store.save(char);
    Toast.show('Class choices saved!', 'success');
    App.go('skills', { charId: this.charId });
  },
};

================================================================ */
const SKILLS = [
  ['acrobatics','Acrobatics','dex'], ['animal-handling','Animal Handling','wis'], ['arcana','Arcana','int'],
  ['athletics','Athletics','str'], ['deception','Deception','cha'], ['history','History','int'],
  ['insight','Insight','wis'], ['intimidation','Intimidation','cha'], ['investigation','Investigation','int'],
  ['medicine','Medicine','wis'], ['nature','Nature','int'], ['perception','Perception','wis'],
  ['performance','Performance','cha'], ['persuasion','Persuasion','cha'], ['religion','Religion','int'],
  ['sleight-of-hand','Sleight of Hand','dex'], ['stealth','Stealth','dex'], ['survival','Survival','wis'],
].map(([i, name, ab]) => ({ index: 'skill-' + i, name, ab }));

// Skills a character already has from race and background
function fixedSkillSet(char) {
  const set = new Set();
  (char.background?.skill_proficiencies || []).forEach(p => set.add(p.index));
  (char.race?.starting_proficiencies || []).forEach(p => { if (p.index.startsWith('skill-')) set.add(p.index); });
  return set;
}

function classSkillChoice(klass) {
  for (const pc of klass?.proficiency_choices || []) {
    const items = (pc.from?.options || []).map(o => o.item || o.of).filter(Boolean);
    if (items.length && items.every(i => i.index.startsWith('skill-'))) return { choose: pc.choose, items };
  }
  return null;
}

function bonusLanguageCount(char) {
  return (char.race?.language_options?.choose || 0)
       + (char.subrace?.language_options?.choose || 0)
       + (char.background?.language_options?.choose || 0);
}

const SkillsView = {
  charId: null, fixed: new Set(), choice: null, langs: [], langNeed: 0, known: new Set(),
  selSkills: new Set(), selLangs: new Set(),

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell('skills',
      `<div class="loading"><div class="spinner"></div><span>Loading…</span></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('choices', { charId: '${charId}' })">← Choices</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="SkillsView.save()">Save &amp; Continue →</button>
       </div>`);
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      this.fixed   = fixedSkillSet(char);
      this.choice  = classSkillChoice(char.klass);
      this.langNeed = bonusLanguageCount(char);
      this.known   = new Set((char.race?.languages || []).map(l => l.index));
      this.langs   = this.langNeed ? (await Api.get('/languages')).results : [];
      const skillOk = new Set((this.choice?.items || []).map(i => i.index));
      this.selSkills = new Set((char.skillProficiencies || []).filter(i => skillOk.has(i) && !this.fixed.has(i)));
      const langOk = new Set(this.langs.map(l => l.index));
      this.selLangs = new Set((char.bonusLanguages || []).map(l => l.index).filter(i => langOk.has(i) && !this.known.has(i)));
      this._draw();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `<div class="error-box"><p>Failed to load: ${esc(e.message)}</p>
        <button class="btn btn-outline" onclick="SkillsView._load()">Retry</button></div>`;
    }
  },

  _draw() {
    const c = this.choice, n = c?.choose || 0;
    const skillsFull = this.selSkills.size >= n;
    const langsFull = this.selLangs.size >= this.langNeed;
    document.getElementById('wizard-body').innerHTML = `<div class="form-main">
      <h2>Skills &amp; Languages</h2>
      <p class="choices-sub">Proficiencies from your race and background are applied automatically.</p>
      ${this.fixed.size ? `<div class="section"><div class="section-label">Already Proficient</div>
        <div class="pick-grid">${[...this.fixed].map(i => `<span class="pick-chip fixed">${esc(SKILLS.find(x => x.index === i)?.name || i)}</span>`).join('')}</div></div>` : ''}
      ${c ? `<div class="section"><div class="section-label">Class Skills — <span class="pick-count">${this.selSkills.size} / ${n}</span></div>
        <div class="pick-grid">${c.items.map(it => {
          const dup = this.fixed.has(it.index), on = this.selSkills.has(it.index);
          return `<button class="pick-chip ${on ? 'selected' : ''}" ${dup || (!on && skillsFull) ? 'disabled' : ''}
            onclick="SkillsView.toggle('selSkills','${it.index}', ${n})">${esc(it.name.replace(/^Skill: /, ''))}</button>`;
        }).join('')}</div></div>` : ''}
      ${this.langNeed ? `<div class="section"><div class="section-label">Bonus Languages — <span class="pick-count">${this.selLangs.size} / ${this.langNeed}</span></div>
        <div class="pick-grid">${this.langs.map(l => {
          const dup = this.known.has(l.index), on = this.selLangs.has(l.index);
          return `<button class="pick-chip ${on ? 'selected' : ''}" ${dup || (!on && langsFull) ? 'disabled' : ''}
            onclick="SkillsView.toggle('selLangs','${l.index}', ${this.langNeed})">${esc(l.name)}</button>`;
        }).join('')}</div></div>` : ''}
      ${!c && !this.langNeed ? '<p class="choices-sub">Nothing to choose here.</p>' : ''}
    </div>`;
    const ok = this._valid();
    document.getElementById('continue-btn').disabled = !ok;
    document.getElementById('footer-hint').textContent = ok ? 'Skills & languages ready!' : 'Make all required picks to continue.';
  },

  toggle(key, index, max) {
    const set = this[key];
    if (set.has(index)) set.delete(index); else if (set.size < max) set.add(index);
    this._draw();
  },

  _valid() { return this.selSkills.size === (this.choice?.choose || 0) && this.selLangs.size === this.langNeed; },

  save() {
    if (!this._valid()) return;
    const char = Store.one(this.charId);
    char.skillProficiencies = [...this.selSkills];
    char.bonusLanguages = this.langs.filter(l => this.selLangs.has(l.index)).map(l => ({ index: l.index, name: l.name }));
    advanceStep(char, 'equipment');
    Store.save(char);
    Toast.show('Skills saved!', 'success');
    App.go('equipment', { charId: this.charId });
  },
};
