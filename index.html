// Starting wealth if you skip equipment: [dice, sides, multiplier]
const START_GOLD = {
  barbarian: [2,4,10], bard: [5,4,10], cleric: [5,4,10], druid: [2,4,10], fighter: [5,4,10], monk: [5,4,1],
  paladin: [5,4,10], ranger: [5,4,10], rogue: [4,4,10], sorcerer: [3,4,10], warlock: [4,4,10], wizard: [4,4,10],
};

// Turn an API equipment option into parts: fixed items, or "pick N from a category"
function eqParseOption(o) {
  switch (o.option_type) {
    case 'counted_reference': return [{ fixed: { index: o.of.index, name: o.of.name, qty: o.count } }];
    case 'reference': return [{ fixed: { index: o.item.index, name: o.item.name, qty: 1 } }];
    case 'choice': {
      const f = o.choice.from;
      return f?.equipment_category ? [{ pick: { n: o.choice.choose || 1, cat: f.equipment_category.index, catName: f.equipment_category.name } }] : [];
    }
    case 'multiple': return (o.items || []).flatMap(eqParseOption);
    default: return [];
  }
}
function eqParseGroup(g, source) {
  const f = g.from || {};
  const alts = f.option_set_type === 'equipment_category' && f.equipment_category
    ? [[{ pick: { n: g.choose || 1, cat: f.equipment_category.index, catName: f.equipment_category.name } }]]
    : (f.options || []).map(eqParseOption).filter(a => a.length);
  return { source, desc: g.desc || '', alts };
}
function eqPartLabel(part) {
  if (part.fixed) return (part.fixed.qty > 1 ? part.fixed.qty + '× ' : '') + part.fixed.name;
  return `${part.pick.n > 1 ? part.pick.n + '× ' : ''}any ${part.pick.catName.toLowerCase()}`;
}

const EquipmentView = {
  charId: null, groups: [], cats: {}, alt: {}, picks: {}, useGold: false, gold: 0,

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell('equipment',
      `<div class="loading"><div class="spinner"></div><span>Loading equipment…</span></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('skills', { charId: '${charId}' })">← Skills</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="EquipmentView.save()">Save &amp; Continue →</button>
       </div>`);
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      this.groups = [
        ...(char.klass?.starting_equipment_options || []).map(g => eqParseGroup(g, 'class')),
        ...(char.background?.starting_equipment_options || []).map(g => eqParseGroup(g, 'background')),
      ].filter(g => g.alts.length);
      const cats = new Set(this.groups.flatMap(g => g.alts.flat().filter(p => p.pick).map(p => p.pick.cat)));
      await Promise.all([...cats].map(async c => {
        const d = await Api.get(`/equipment-categories/${c}`);
        this.cats[c] = [...(d.equipment || [])].sort((a, b) => a.name.localeCompare(b.name));
      }));
      this.alt = {}; this.picks = {};
      this.groups.forEach((g, gi) => { if (g.alts.length === 1) this.alt[gi] = 0; });
      this.useGold = !!char.useGold;
      this.gold = char.startGold || 0;
      this._draw();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `<div class="error-box"><p>Failed to load: ${esc(e.message)}</p>
        <button class="btn btn-outline" onclick="EquipmentView._load()">Retry</button></div>`;
    }
  },

  _active() { return this.groups.map((g, gi) => ({ g, gi })).filter(x => !(this.useGold && x.g.source === 'class')); },

  _draw() {
    const char = Store.one(this.charId);
    const fixedClass = this.useGold ? [] : (char.klass?.starting_equipment || []);
    const fixedBg = char.background?.starting_equipment || [];
    const fmt = e => `<span class="pick-chip fixed">${e.quantity > 1 ? e.quantity + '× ' : ''}${esc(e.equipment.name)}</span>`;
    const gr = START_GOLD[char.klass?.index];

    const groupHtml = this._active().map(({ g, gi }) => {
      const sel = this.alt[gi];
      return `<div class="eq-group">
        <div class="eq-group-title">${esc(g.source === 'class' ? char.klass.name : char.background.name)} — choose one</div>
        ${g.alts.map((parts, ai) => `
          <button class="eq-alt ${sel === ai ? 'selected' : ''}" onclick="EquipmentView.setAlt(${gi},${ai})">
            ${esc(parts.map(eqPartLabel).join(' + '))}
          </button>`).join('')}
        ${sel != null ? g.alts[sel].map((part, pi) => !part.pick ? '' : `
          <div class="eq-picks">${Array.from({ length: part.pick.n }, (_, slot) => {
            const key = `${gi}.${pi}.${slot}`;
            return `<select class="abil-select" style="max-width:260px" onchange="EquipmentView.setPick('${key}', this.value)">
              <option value="">— ${esc(part.pick.catName)} —</option>
              ${(this.cats[part.pick.cat] || []).map(it =>
                `<option value="${it.index}" ${this.picks[key] === it.index ? 'selected' : ''}>${esc(it.name)}</option>`).join('')}
            </select>`;
          }).join('')}</div>`).join('') : ''}
      </div>`;
    }).join('');

    document.getElementById('wizard-body').innerHTML = `<div class="form-main">
      <h2>Equipment</h2>
      <p class="choices-sub">Starting gear from your class and background.</p>
      ${gr ? `<div class="section"><div class="section-label">Starting Gold Alternative</div>
        <div class="gold-box">
          <button class="pick-chip ${this.useGold ? 'selected' : ''}" onclick="EquipmentView.toggleGold()">
            Take gold instead of class equipment</button>
          ${this.useGold ? `<button class="btn btn-outline" onclick="EquipmentView.rollGold()">${I.d20} ${this.gold ? 'Reroll' : 'Roll'} ${gr[0]}d${gr[1]}${gr[2] > 1 ? ' × ' + gr[2] : ''}</button>
            <span class="gold-amt">${this.gold ? this.gold + ' gp' : ''}</span>` : ''}
        </div></div>` : ''}
      ${fixedClass.length || fixedBg.length ? `<div class="section"><div class="section-label">You Receive</div>
        <div class="pick-grid">${[...fixedClass, ...fixedBg].map(fmt).join('')}</div></div>` : ''}
      ${groupHtml ? `<div class="section"><div class="section-label">Choices</div>${groupHtml}</div>` : ''}
    </div>`;
    const ok = this._valid();
    document.getElementById('continue-btn').disabled = !ok;
    document.getElementById('footer-hint').textContent = ok ? 'Equipment ready!'
      : this.useGold && !this.gold ? 'Roll your starting gold to continue.' : 'Make all equipment choices to continue.';
  },

  setAlt(gi, ai) {
    this.alt[gi] = ai;
    Object.keys(this.picks).filter(k => k.startsWith(gi + '.')).forEach(k => delete this.picks[k]);
    this._draw();
  },
  setPick(key, val) { if (val) this.picks[key] = val; else delete this.picks[key]; this._draw(); },
  toggleGold() { this.useGold = !this.useGold; if (!this.useGold) this.gold = 0; this._draw(); },
  rollGold() {
    const [n, sides, mult] = START_GOLD[Store.one(this.charId).klass.index];
    let t = 0; for (let i = 0; i < n; i++) t += 1 + Math.floor(Math.random() * sides);
    this.gold = t * mult; this._draw();
  },

  _valid() {
    if (this.useGold && !this.gold) return false;
    return this._active().every(({ g, gi }) => {
      const a = this.alt[gi];
      if (a == null) return false;
      return g.alts[a].every((part, pi) => !part.pick ||
        Array.from({ length: part.pick.n }, (_, slot) => this.picks[`${gi}.${pi}.${slot}`]).every(Boolean));
    });
  },

  _resolve(char) {
    const out = new Map();
    const add = (index, name, qty) => {
      const k = index || name;
      if (out.has(k)) out.get(k).quantity += qty; else out.set(k, { index: index || null, name, quantity: qty });
    };
    if (!this.useGold) (char.klass?.starting_equipment || []).forEach(e => add(e.equipment.index, e.equipment.name, e.quantity));
    (char.background?.starting_equipment || []).forEach(e => add(e.equipment.index, e.equipment.name, e.quantity));
    this._active().forEach(({ g, gi }) => {
      g.alts[this.alt[gi]].forEach((part, pi) => {
        if (part.fixed) add(part.fixed.index, part.fixed.name, part.fixed.qty);
        else for (let slot = 0; slot < part.pick.n; slot++) {
          const idx = this.picks[`${gi}.${pi}.${slot}`];
          const it = (this.cats[part.pick.cat] || []).find(x => x.index === idx);
          if (it) add(it.index, it.name, 1);
        }
      });
    });
    return [...out.values()];
  },

  save() {
    if (!this._valid()) return;
    const char = Store.one(this.charId);
    char.equipment = this._resolve(char);
    char.useGold = this.useGold;
    char.startGold = this.useGold ? this.gold : 0;
    advanceStep(char, 'details');
    Store.save(char);
    Toast.show('Equipment saved!', 'success');
    App.go('details', { charId: this.charId });
  },
};

     </div>`);
    this._drawPortrait();
    this.sync();

  _v(id) { return (document.getElementById(id)?.value || '').trim(); },
  fill(id, sel) { if (sel.value) { document.getElementById(id).value = sel.value; sel.value = ''; } },

  sync() {
    const ok = !!this._v('d-name') && !!this._v('d-align');
    document.getElementById('continue-btn').disabled = !ok;
    document.getElementById('footer-hint').textContent = ok ? 'Ready to finish!' : 'Enter a name and alignment to finish.';
  },

  _drawPortrait() {
    const c = Store.one(this.charId);
    document.getElementById('portrait-box').innerHTML = this.portrait
      ? `<img src="${esc(this.portrait)}" alt="Portrait">` : (RACE_ICONS[c.race?.index] || '🎲');
  },
  clearPortrait() { this.portrait = null; this._drawPortrait(); },

  upload(file) {
    if (!file) return;
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      // Downscale to keep localStorage small
      const max = 320, scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      this.portrait = cv.toDataURL('image/jpeg', 0.82);
      URL.revokeObjectURL(url);
      this._drawPortrait();
    };
    img.onerror = () => { URL.revokeObjectURL(url); Toast.show('Could not read that image.', 'error'); };
    img.src = url;
  },

    char.portrait = this.portrait;

    Store.save(char);
  },

  save() {
    const char = Store.one(this.charId);
    this.persist(char);
    char.step = 'complete';
    Store.save(char);
    Toast.show(`${char.name} is ready!`, 'success');
    App.go('sheet', { charId: this.charId });
  },
};

const Transfer = {
  exportChar(id) {
    const c = Store.one(id);
    if (!c) return;
    const blob = new Blob([JSON.stringify(c, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${(c.name || 'character').replace(/[^\w-]+/g, '_')}.dnd5e.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },

  pickImport() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => inp.files[0] && this.importFile(inp.files[0]);
    inp.click();
  },

  async importFile(file) {
    try {
      const c = JSON.parse(await file.text());
      if (!c || typeof c !== 'object' || !('race' in c) || !('baseScores' in c)) throw new Error('Not a character file');
      const merged = { ...Store.blank(), ...c };
      if (Store.one(merged.id) || !merged.id) merged.id = crypto.randomUUID();  // never overwrite an existing character
      Store.save(merged);
      Toast.show(`Imported ${merged.name || 'character'}.`, 'success');
      App.render();
    } catch (e) {
      Toast.show('Import failed: ' + e.message, 'error');
    }
  },
};

// All derived numbers in one place; `gear` maps equipment index -> API detail
function deriveStats(c, gear = {}) {
  const score = {}, mod = {};
  ABILITY_KEYS.forEach(k => { score[k] = finalScore(c, k); mod[k] = abilityMod(score[k]); });
  const prof = 2;
  const saves = new Set((c.klass?.saving_throws || []).map(s => s.index));
  const skillProf = new Set([...fixedSkillSet(c), ...(c.skillProficiencies || [])]);

  const items = (c.equipment || []).map(e => gear[e.index]).filter(Boolean);
  const body = items.find(i => i.equipment_category?.index === 'armor' && i.armor_category !== 'Shield');
  const shield = items.find(i => i.armor_category === 'Shield');
  let ac;
  if (body) {
    const a = body.armor_class || {};
    ac = (a.base || 10) + (a.dex_bonus ? (a.max_bonus != null ? Math.min(mod.dex, a.max_bonus) : mod.dex) : 0);
  } else if (c.klass?.index === 'barbarian') ac = 10 + mod.dex + mod.con;
  else if (c.klass?.index === 'monk') ac = 10 + mod.dex + mod.wis;
  else ac = 10 + mod.dex;
  if (shield) ac += shield.armor_class?.base || 2;

  const hp = (c.klass?.hit_die || 8) + mod.con + (c.subrace?.index === 'hill-dwarf' ? 1 : 0);
  const skills = SKILLS.map(sk => ({ ...sk, prof: skillProf.has(sk.index), total: mod[sk.ab] + (skillProf.has(sk.index) ? prof : 0) }));

  const profNames = new Set((c.klass?.proficiencies || []).map(p => p.name));
  const attacks = items.filter(i => i.equipment_category?.index === 'weapon').map(w => {
    const finesse = (w.properties || []).some(p => p.index === 'finesse');
    const ranged = w.weapon_range === 'Ranged';
    const abMod = ranged ? mod.dex : finesse ? Math.max(mod.str, mod.dex) : mod.str;
    const proficient = profNames.has(`${w.weapon_category} Weapons`) || profNames.has(w.name);
    const bonus = abMod + (proficient ? prof : 0);
    return { name: w.name, bonus, damage: `${w.damage?.damage_dice || '—'}${abMod ? fmtMod(abMod) : ''} ${w.damage?.damage_type?.name || ''}`.trim() };
  });

  const cast = c.klass?.spellcasting?.ability;
  const spell = cast ? { ability: cast, dc: 8 + prof + mod[cast], attack: prof + mod[cast] } : null;
  return { score, mod, prof, saves, skills, ac, hp, initiative: mod.dex, speed: c.race?.speed,
           passive: 10 + (skills.find(s => s.index === 'skill-perception')?.total || 0), attacks, spell };
}

const SheetView = {
  async render(root, { charId }) {
    const c = Store.one(charId);
    if (!c) { App.go('home'); return; }
    root.innerHTML = `<div class="loading"><div class="spinner"></div><span>Building sheet…</span></div>`;
    const gear = {};
    await Promise.all((c.equipment || []).filter(e => e.index).map(async e => {
      try { gear[e.index] = await Api.get(`/equipment/${e.index}`); } catch { /* sheet works without gear detail */ }
    }));
    root.innerHTML = this._html(c, deriveStats(c, gear));
  },

  _html(c, st) {
    const list = a => a.length ? a.map(esc).join(', ') : '—';
    const langs = [...(c.race?.languages || []).map(l => l.name), ...(c.bonusLanguages || []).map(l => l.name)];
    const profs = [
      ...(c.klass?.proficiencies || []).filter(p => !p.index.startsWith('saving-throw-')).map(p => p.name),
      ...(c.race?.starting_proficiencies || []).filter(p => !p.index.startsWith('skill-')).map(p => p.name),
    ];
    if (c.background?.tool_text) profs.push(c.background.tool_text);
    const traits = [...(c.race?.traits || []), ...(c.subrace?.racial_traits || [])].map(t => t.name);
    const sp = c.spellNames || {};
    const sub = [c.subclassChoice?.name, c.fightingStyle ? 'Fighting Style: ' + c.fightingStyle.name : ''].filter(Boolean);
    const title = [c.subrace?.name || c.race?.name, c.klass?.name].filter(Boolean).join(' ');
    const stepBtns = STEPS.map(s => `<button class="btn btn-ghost" onclick="App.go('${s.id}', { charId: '${c.id}' })">${s.label}</button>`).join('');

    return `<div class="sheet-wrap">
      <div class="sheet-bar no-print">
        <button class="btn btn-ghost" onclick="App.go('home')">${I.back} Home</button>
        <span class="spacer"></span>
        <button class="btn btn-outline" onclick="window.print()">Print</button>
        <button class="btn btn-outline" onclick="Transfer.exportChar('${c.id}')">Export JSON</button>
      </div>
      <div class="sheet-head">
        <div class="portrait-box">${c.portrait ? `<img src="${esc(c.portrait)}" alt="">` : (RACE_ICONS[c.race?.index] || '🎲')}</div>
        <div>
          <div class="sheet-name">${esc(c.name || 'Unnamed Adventurer')}</div>
          <div class="sheet-sub">${esc(title)} · Level 1 · ${esc(c.background?.name || '')}${c.alignment ? ' · ' + esc(c.alignment) : ''}</div>
        </div>
      </div>

      <div class="sheet-grid">
        <div class="sheet-col">
          ${ABILITY_KEYS.map(k => `<div class="ab-box"><div class="l">${ABILITY_FULL[k]}</div>
            <div class="m">${fmtMod(st.mod[k])}</div><div class="sc">${st.score[k]}</div></div>`).join('')}
          <div class="sheet-card"><h4>Saving Throws</h4><ul class="prof-list">
            ${ABILITY_KEYS.map(k => { const on = st.saves.has(k); return `<li><span class="prof-dot ${on ? 'on' : ''}"></span>
              <span class="val">${fmtMod(st.mod[k] + (on ? st.prof : 0))}</span>${ABILITY_FULL[k]}</li>`; }).join('')}
          </ul></div>
          <div class="sheet-card"><h4>Skills</h4><ul class="prof-list">
            ${st.skills.map(sk => `<li><span class="prof-dot ${sk.prof ? 'on' : ''}"></span>
              <span class="val">${fmtMod(sk.total)}</span>${esc(sk.name)} <span style="color:var(--text-muted);font-size:0.7rem">(${sk.ab.toUpperCase()})</span></li>`).join('')}
          </ul></div>
        </div>

        <div class="sheet-col">
          <div class="stat-row">
            <div class="stat-box"><div class="v">${st.ac}</div><div class="l">Armor Class</div></div>
            <div class="stat-box"><div class="v">${fmtMod(st.initiative)}</div><div class="l">Initiative</div></div>
            <div class="stat-box"><div class="v">${st.speed ?? '—'}</div><div class="l">Speed (ft)</div></div>
            <div class="stat-box"><div class="v">${st.hp}</div><div class="l">Hit Points</div></div>
            <div class="stat-box"><div class="v">d${c.klass?.hit_die ?? '—'}</div><div class="l">Hit Die</div></div>
            <div class="stat-box"><div class="v">+${st.prof}</div><div class="l">Proficiency</div></div>
            <div class="stat-box"><div class="v">${st.passive}</div><div class="l">Passive Perception</div></div>
          </div>

          ${st.attacks.length ? `<div class="sheet-card"><h4>Attacks</h4><table class="sheet-table">
            <tr><th>Weapon</th><th>Attack</th><th>Damage</th></tr>
            ${st.attacks.map(a => `<tr><td>${esc(a.name)}</td><td>${fmtMod(a.bonus)}</td><td>${esc(a.damage)}</td></tr>`).join('')}
          </table></div>` : ''}

          ${st.spell ? `<div class="sheet-card"><h4>Spellcasting</h4>
            <div class="stat-row" style="margin-bottom:10px">
              <div class="stat-box"><div class="v">${esc(ABILITY_FULL[st.spell.ability])}</div><div class="l">Ability</div></div>
              <div class="stat-box"><div class="v">${st.spell.dc}</div><div class="l">Spell Save DC</div></div>
              <div class="stat-box"><div class="v">${fmtMod(st.spell.attack)}</div><div class="l">Spell Attack</div></div>
              <div class="stat-box"><div class="v">${c.spellSlots1 || 0}</div><div class="l">1st-Level Slots</div></div>
            </div>
            <div class="sheet-text">
              ${c.cantrips?.length ? `<p><b>Cantrips:</b> ${list(c.cantrips.map(i => sp[i] || i))}</p>` : ''}
              ${c.level1Spells?.length ? `<p><b>1st Level:</b> ${list(c.level1Spells.map(i => sp[i] || i))}</p>` : ''}
            </div></div>` : ''}

          <div class="two-col">
            <div class="sheet-card"><h4>Features &amp; Traits</h4><div class="sheet-text">
              ${traits.length ? `<p><b>Racial:</b> ${list(traits)}</p>` : ''}
              ${sub.length ? `<p><b>Class:</b> ${list(sub)}</p>` : ''}
              ${c.background?.feature ? `<p><b>${esc(c.background.feature.name)}:</b> ${esc((c.background.feature.desc || [])[0] || '')}</p>` : ''}
            </div></div>
            <div class="sheet-card"><h4>Proficiencies &amp; Languages</h4><div class="sheet-text">
              <p><b>Languages:</b> ${list(langs)}</p>
              <p><b>Other:</b> ${list(profs)}</p>
            </div></div>
          </div>

          <div class="sheet-card"><h4>Equipment</h4><div class="sheet-text">
            ${c.useGold ? `<p><b>Starting gold:</b> ${c.startGold} gp</p>` : ''}
            ${c.equipment?.length ? list(c.equipment.map(e => (e.quantity > 1 ? e.quantity + '× ' : '') + e.name)) : '—'}
          </div></div>

          <div class="sheet-card"><h4>Personality</h4><div class="sheet-text">
            ${c.personalityTraits?.length ? `<p><b>Traits:</b> ${list(c.personalityTraits)}</p>` : ''}
            ${c.ideal ? `<p><b>Ideal:</b> ${esc(c.ideal)}</p>` : ''}
            ${c.bond ? `<p><b>Bond:</b> ${esc(c.bond)}</p>` : ''}
            ${c.flaw ? `<p><b>Flaw:</b> ${esc(c.flaw)}</p>` : ''}
          </div></div>
        </div>
      </div>

      <div class="sheet-card no-print" style="margin-top:18px"><h4>Edit a Step</h4>
        <div style="display:flex;flex-wrap:wrap;gap:4px">${stepBtns}</div></div>
    </div>`;
  },
};

/* ================================================================
   INIT
================================================================ */
App.go('home');
</script>
</body>
</html>
