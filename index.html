const Transfer = {
  exportChar(id) {
    const c = Store.one(id);
    if (!c) return;
    const blob = new Blob([JSON.stringify(c, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${(c.name || 'character').replace(/[^\w-]+/g, '_')}.dnd5e.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },

  pickImport() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => inp.files[0] && this.importFile(inp.files[0]);
    inp.click();
  },

  async importFile(file) {
    try {
      const c = JSON.parse(await file.text());
      if (!c || typeof c !== 'object' || !('race' in c) || !('baseScores' in c)) throw new Error('Not a character file');
      const merged = { ...Store.blank(), ...c };
      if (Store.one(merged.id) || !merged.id) merged.id = crypto.randomUUID();  // never overwrite an existing character
      Store.save(merged);
      Toast.show(`Imported ${merged.name || 'character'}.`, 'success');
      App.render();
    } catch (e) {
      Toast.show('Import failed: ' + e.message, 'error');
    }
  },
};

// All derived numbers in one place; `gear` maps equipment index -> API detail
function deriveStats(c, gear = {}) {
  const level = c.level || 1, prof = profBonus(level);
  const score = {}, mod = {};
  ABILITY_KEYS.forEach(k => { score[k] = finalScore(c, k); mod[k] = abilityMod(score[k]); });
  const saves = new Set((c.klass?.saving_throws || []).map(s => s.index));
  const skillProf = allSkillProfs(c);
  const expert = new Set(c.expertise || []);
  if (SUBCLASS_PICKS[c.subclassChoice?.index]?.skills?.expertise) (c.subclassSkills || []).forEach(i => expert.add(i));
  const style = c.fightingStyle?.index;
  const kIdx = c.klass?.index;

  const items = (c.equipment || []).map(e => ({ ...e, d: gear[e.index] })).filter(e => e.d);
  const body = items.find(i => i.d.equipment_category?.index === 'armor' && i.d.armor_category !== 'Shield')?.d;
  const shield = items.find(i => i.d.armor_category === 'Shield')?.d;
  let ac;
  if (body) {
    const a = body.armor_class || {};
    ac = (a.base || 10) + (a.dex_bonus ? (a.max_bonus != null ? Math.min(mod.dex, a.max_bonus) : mod.dex) : 0);
    if (style === 'defense') ac += 1;
  } else if (kIdx === 'barbarian') ac = 10 + mod.dex + mod.con;
  else if (kIdx === 'monk' && !shield) ac = 10 + mod.dex + mod.wis;
  else if (c.subclassChoice?.index === 'draconic') ac = 13 + mod.dex;
  else ac = 10 + mod.dex;
  if (shield) ac += shield.armor_class?.base || 2;

  const jack = kIdx === 'bard' && level >= 2;
  const skills = SKILLS.map(sk => {
    const p = skillProf.has(sk.index), x = p && expert.has(sk.index);
    return { ...sk, prof: p, expert: x,
             total: mod[sk.ab] + (x ? 2 * prof : p ? prof : jack ? Math.floor(prof / 2) : 0) };
  });

  const profNames = new Set((c.klass?.proficiencies || []).map(p => p.name));
  const attacks = items.filter(i => i.d.equipment_category?.index === 'weapon').map(({ d: w }) => {
    const has = id => (w.properties || []).some(p => p.index === id);
    const ranged = w.weapon_range === 'Ranged';
    const abMod = ranged ? mod.dex : has('finesse') ? Math.max(mod.str, mod.dex) : mod.str;
    const proficient = profNames.has(`${w.weapon_category} Weapons`) || profNames.has(w.name);
    const bonus = abMod + (proficient ? prof : 0) + (ranged && style === 'archery' ? 2 : 0);
    const dmgBonus = abMod + (!ranged && style === 'dueling' && !has('two-handed') ? 2 : 0);
    return { name: w.name, bonus, damage: `${w.damage?.damage_dice || '—'}${dmgBonus ? fmtMod(dmgBonus) : ''} ${w.damage?.damage_type?.name || ''}`.trim() };
  });
  attacks.push({ name: 'Unarmed Strike', bonus: mod.str + prof,
                 damage: kIdx === 'monk' ? `Martial Arts die${mod.dex >= mod.str ? fmtMod(mod.dex) : fmtMod(mod.str)} bludgeoning` : `${1 + mod.str} bludgeoning` });

  const cast = castingAbility(c);
  let spell = null;
  if (cast && (Object.keys(c.spellSlots || {}).length || c.cantrips?.length)) {
    const prepared = { cleric: mod[cast] + level, druid: mod[cast] + level, wizard: mod[cast] + level,
                       paladin: mod[cast] + Math.floor(level / 2) }[kIdx];
    spell = { ability: cast, dc: 8 + prof + mod[cast], attack: prof + mod[cast],
              prepare: prepared != null ? Math.max(1, prepared) : null };
  }

  const weight = items.reduce((n, e) => n + (e.d.weight || 0) * (e.quantity || 1), 0);
  const perception = skills.find(s => s.index === 'skill-perception');
  return { score, mod, prof, level, saves, skills, ac, hp: maxHP(c, mod.con), initiative: mod.dex,
           speed: c.race?.speed != null ? c.race.speed + (c.subrace?.speed_bonus || 0) : undefined,
           passive: 10 + perception.total, attacks, spell, weight, capacity: score.str * 15,
           hitDice: `${level}d${c.klass?.hit_die || 8}` };
}

// Pretty-print class_specific values from the level table (rage count, sneak attack dice, ...)
function classResources(levelObj) {
  const out = [];
  Object.entries(levelObj?.class_specific || {}).forEach(([k, v]) => {
    const label = titleCase(k.replace(/_/g, '-'));
    if (v && typeof v === 'object' && !Array.isArray(v) && 'dice_count' in v) out.push([label, `${v.dice_count}d${v.dice_value}`]);
    else if (typeof v === 'number' || typeof v === 'string') out.push([label, v]);
    else if (typeof v === 'boolean') out.push([label, v ? 'Yes' : 'No']);
  });
  return out;
}

function classifyProf(name) {
  if (/armor|shield/i.test(name)) return 'armor';
  if (/weapon|sword|bow|dagger|dart|sling|club|mace|staff|spear|rapier|scimitar|whip|axe|javelin|sickle|net|blowgun|trident|pike|glaive|halberd|lance|maul|morningstar|flail|hammer/i.test(name)) return 'weapons';
  return 'tools';
}

const SheetView = {
  async render(root, { charId }) {
    const c = Store.one(charId);
    if (!c) { App.go('home'); return; }
    root.innerHTML = `<div class="loading"><div class="spinner"></div><span>Building sheet…</span></div>`;
    const gear = {};
    let levels = [], subLevels = [];
    await Promise.all([
      ...(c.equipment || []).filter(e => e.index).map(async e => {
        try { gear[e.index] = await Api.get(`/equipment/${e.index}`); } catch { /* sheet works without gear detail */ }
      }),
      (async () => { try { levels = await classLevels(c.klass.index); } catch { /* features list is optional */ } })(),
      (async () => { try { if (c.subclassChoice && !extraSubclass(c.klass?.index, c.subclassChoice.index)) subLevels = await Api.get(`/subclasses/${c.subclassChoice.index}/levels`); } catch { /* optional */ } })(),
    ]);
    root.innerHTML = this._html(c, deriveStats(c, gear), levels, subLevels);
    root.querySelectorAll('details[data-src]').forEach(d => d.addEventListener('toggle', () => this.loadDetail(d)));
  },

  async loadDetail(d) {
    const src = d.dataset.src;
    if (!src || d.dataset.done) return;
    d.dataset.done = '1';
    const body = d.querySelector('.feat-body');
    try {
      const x = await Api.get(src);
      const head = x.casting_time ? [x.school?.name, x.casting_time, x.range, x.duration, (x.components || []).join('')].filter(Boolean).join(' · ') + '\n\n' : '';
      const text = [...(x.desc || []), ...(x.higher_level || []).map(h => 'At higher levels: ' + h)].join('\n\n');
      body.textContent = head + (text || 'No description available.');
    } catch { body.textContent = 'Could not load description.'; d.dataset.done = ''; }
  },

  // Open every description, then print — a printed sheet can't expand things itself
  async printFull() {
    const all = [...document.querySelectorAll('details[data-src]')];
    all.forEach(d => { d.open = true; });
    await Promise.all(all.map(d => this.loadDetail(d)));
    document.querySelectorAll('details').forEach(d => { d.open = true; });
    window.print();
  },

  _feat(name, src, text) {
    return `<details class="feat" ${src ? `data-src="${esc(src)}"` : ''}><summary>${esc(name)}</summary>
      <div class="feat-body">${src ? 'Loading…' : esc(text || '')}</div></details>`;
  },

  _html(c, st, levels, subLevels) {
    const list = a => a.length ? a.map(esc).join(', ') : '—';
    const lvlObj = levels[(c.level || 1) - 1];
    const langs = [...(c.race?.languages || []).map(l => l.name), ...(c.bonusLanguages || []).map(l => l.name)];
    const profGroups = { armor: [], weapons: [], tools: [] };
    [...(c.klass?.proficiencies || []).filter(p => !p.index.startsWith('saving-throw-')).map(p => p.name),
     ...(c.race?.starting_proficiencies || []).filter(p => !p.index.startsWith('skill-')).map(p => p.name),
     ...(c.subrace?.starting_proficiencies || []).map(p => p.name),
     ...(c.racialProficiencies || []).filter(p => !p.index.startsWith('skill-')).map(p => p.name),
     ...(c.toolProficiencies || []).map(p => p.name),
     ...(SUBCLASS_PROFS[c.subclassChoice?.index] || []),
     ...(c.background?.tool_text ? [c.background.tool_text] : [])]
      .forEach(n => { const g = profGroups[classifyProf(n)]; if (!g.includes(n)) g.push(n); });
    if ((c.expertise || []).includes('thieves-tools') && !profGroups.tools.some(n => /thieves/i.test(n))) profGroups.tools.push("Thieves' Tools");

    // ----- features -----
    const raceTraits = [...(c.race?.traits || []), ...(c.subrace?.racial_traits || [])];
    const classFeats = levels.slice(0, c.level || 1).flatMap(l => (l.features || []).map(f => ({ ...f, level: l.level })))
      .filter(f => !/^Ability Score Improvement$/i.test(f.name));
    const ex = extraSubclass(c.klass?.index, c.subclassChoice?.index);
    const subFeats = ex
      ? ex.features.filter(f => f[0] <= (c.level || 1)).map(f => ({ name: f[1], level: f[0], text: f[2] }))
      : (subLevels || []).filter(l => l.level <= (c.level || 1)).flatMap(l => (l.features || []).map(f => ({ ...f, level: l.level })));
    const featNames = Object.entries(c.asi || {}).filter(([, e]) => e.mode === 'feat' && e.feat);

    const choices = [];
    if (c.fightingStyle) choices.push(['Fighting Style: ' + c.fightingStyle.name, FIGHTING_STYLES[c.fightingStyle.index]?.desc]);
    if (c.dragonAncestry) { const d = DRAGON_ANCESTRY[c.dragonAncestry];
      choices.push([`Draconic Ancestry: ${titleCase(c.dragonAncestry)}`,
        `Breath weapon: ${breathDice(c.level || 1)}d6 ${d.damage.toLowerCase()} damage, ${d.shape === 'line' ? '5×30 ft line' : '15 ft cone'}, ${ABILITY_FULL[d.save]} save DC ${8 + st.prof + st.mod.con}. Resistance to ${d.damage.toLowerCase()} damage.`]); }
    if (c.draconicAncestry) choices.push([`Dragon Ancestor: ${titleCase(c.draconicAncestry)}`, `Damage affinity: ${DRAGON_ANCESTRY[c.draconicAncestry].damage}.`]);
    if (c.favoredEnemies?.length) choices.push(['Favored Enemy', c.favoredEnemies.join(', ')]);
    if (c.favoredTerrains?.length) choices.push(['Favored Terrain', c.favoredTerrains.join(', ')]);
    if (c.racialCantrips?.length) choices.push(['High Elf Cantrip', c.racialCantrips.map(i => c.spellNames?.[i] || spellLabel(i)).join(', ')]);
    const bonusCantrips = [...(c.subrace?.cantrips || []), ...(SUBCLASS_CANTRIPS[c.subclassChoice?.index] || [])];
    if (bonusCantrips.length) choices.push(['Bonus Cantrip' + (bonusCantrips.length > 1 ? 's' : ''), bonusCantrips.map(x => x.name).join(', ')]);
    if (c.subclassSkills?.length) choices.push([`${c.subclassChoice.name} Skills`, c.subclassSkills.map(i => SKILLS.find(x => x.index === i)?.name || i).join(', ')]);
    if ((c.expertise || []).length) choices.push(['Expertise', c.expertise.map(i => SKILLS.find(x => x.index === i)?.name || "Thieves' Tools").join(', ')]);

    // ----- spells -----
    const sp = c.spellNames || {}, lv = c.spellLevels || {};
    const spellEntries = [...(c.spells || []), ...domainSpells(c)]
      .filter((i, n, a) => a.indexOf(i) === n)
      .map(i => ({ index: i, name: sp[i] || spellLabel(i), level: lv[i] || 1, domain: domainSpells(c).includes(i) }))
      .sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
    const cantripEntries = [...(c.cantrips || []), ...(c.racialCantrips || [])].map(i => ({ index: i, name: sp[i] || spellLabel(i) }));
    const slotRow = Object.entries(c.spellSlots || {}).map(([l, n]) =>
      `<div class="slot-line"><span class="slot-lv">Level ${l}</span>${'<span class="slot-box"></span>'.repeat(n)}</div>`).join('');

    const res = classResources(lvlObj);
    const ap = c.appearance || {};
    const apLine = APPEARANCE_FIELDS.filter(([k]) => ap[k]).map(([k, l]) => `<b>${l}:</b> ${esc(ap[k])}`).join(' &nbsp; ');
    const stepBtns = STEPS.map(x => `<button class="btn btn-ghost" onclick="App.go('${x.id}', { charId: '${c.id}' })">${x.label}</button>`).join('');
    const title = [c.subrace?.name || c.race?.name, c.klass?.name].filter(Boolean).join(' ');
    const over = st.weight > st.capacity;

    return `<div class="sheet-wrap">
      <div class="sheet-bar no-print">
        <button class="btn btn-ghost" onclick="App.go('home')">${I.back} Home</button>
        <span class="spacer"></span>
        <button class="btn btn-outline" onclick="window.print()">Print</button>
        <button class="btn btn-outline" onclick="SheetView.printFull()">Print with descriptions</button>
        <button class="btn btn-outline" onclick="Transfer.exportChar('${c.id}')">Export JSON</button>
      </div>
      <div class="sheet-head">
        <div class="portrait-box">${c.portrait ? `<img src="${esc(c.portrait)}" alt="">` : (RACE_ICONS[c.race?.index] || I.d20)}</div>
        <div>
          <div class="sheet-name">${esc(c.name || 'Unnamed Adventurer')}</div>
          <div class="sheet-sub">${esc(title)}${c.subclassChoice ? ' (' + esc(c.subclassChoice.name) + ')' : ''} · Level ${st.level} · ${esc(c.background?.name || '')}${c.alignment ? ' · ' + esc(c.alignment) : ''}</div>
          ${apLine ? `<div class="sheet-sub" style="font-style:normal;font-size:0.88rem">${apLine}</div>` : ''}
        </div>
      </div>

      <div class="sheet-grid">
        <div class="sheet-col">
          ${ABILITY_KEYS.map(k => `<div class="ab-box"><div class="l">${ABILITY_FULL[k]}</div>
            <div class="m">${fmtMod(st.mod[k])}</div><div class="sc">${st.score[k]}</div></div>`).join('')}
          <div class="sheet-card"><h4>Saving Throws</h4><ul class="prof-list">
            ${ABILITY_KEYS.map(k => { const on = st.saves.has(k); return `<li><span class="prof-dot ${on ? 'on' : ''}"></span>
              <span class="val">${fmtMod(st.mod[k] + (on ? st.prof : 0))}</span>${ABILITY_FULL[k]}</li>`; }).join('')}
          </ul></div>
          <div class="sheet-card"><h4>Skills</h4><ul class="prof-list">
            ${st.skills.map(sk => `<li><span class="prof-dot ${sk.expert ? 'on expert' : sk.prof ? 'on' : ''}"></span>
              <span class="val">${fmtMod(sk.total)}</span>${esc(sk.name)} <span style="color:var(--ink-3);font-size:0.7rem">(${sk.ab.toUpperCase()})</span></li>`).join('')}
          </ul></div>
        </div>

        <div class="sheet-col">
          <div class="stat-row">
            <div class="stat-box"><div class="v">${st.ac}</div><div class="l">Armor Class</div></div>
            <div class="stat-box"><div class="v">${fmtMod(st.initiative)}</div><div class="l">Initiative</div></div>
            <div class="stat-box"><div class="v">${st.speed ?? '—'}</div><div class="l">Speed (ft)</div></div>
            <div class="stat-box"><div class="v">${st.hp}</div><div class="l">Hit Points</div></div>
            <div class="stat-box"><div class="v">${st.hitDice}</div><div class="l">Hit Dice</div></div>
            <div class="stat-box"><div class="v">+${st.prof}</div><div class="l">Proficiency</div></div>
            <div class="stat-box"><div class="v">${st.passive}</div><div class="l">Passive Perception</div></div>
          </div>

          <div class="two-col">
            <div class="sheet-card"><h4>Death Saves</h4><div class="sheet-text">
              <div class="slot-line"><span class="slot-lv">Successes</span>${'<span class="slot-box round"></span>'.repeat(3)}</div>
              <div class="slot-line"><span class="slot-lv">Failures</span>${'<span class="slot-box round"></span>'.repeat(3)}</div>
              <div class="slot-line"><span class="slot-lv">Inspiration</span><span class="slot-box round"></span></div>
            </div></div>
            ${res.length ? `<div class="sheet-card"><h4>Class Resources</h4><div class="sheet-text">
              ${res.map(([k, v]) => `<div class="res-line"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div></div>` : ''}
          </div>

          <div class="sheet-card"><h4>Attacks</h4><table class="sheet-table">
            <tr><th>Weapon</th><th>Attack</th><th>Damage</th></tr>
            ${st.attacks.map(a => `<tr><td>${esc(a.name)}</td><td>${fmtMod(a.bonus)}</td><td>${esc(a.damage)}</td></tr>`).join('')}
          </table></div>

          ${st.spell ? `<div class="sheet-card"><h4>Spellcasting</h4>
            <div class="stat-row" style="margin-bottom:10px">
              <div class="stat-box"><div class="v">${esc(ABILITY_FULL[st.spell.ability])}</div><div class="l">Ability</div></div>
              <div class="stat-box"><div class="v">${st.spell.dc}</div><div class="l">Spell Save DC</div></div>
              <div class="stat-box"><div class="v">${fmtMod(st.spell.attack)}</div><div class="l">Spell Attack</div></div>
              ${st.spell.prepare != null ? `<div class="stat-box"><div class="v">${st.spell.prepare}</div><div class="l">Prepared</div></div>` : ''}
            </div>
            ${slotRow ? `<div class="sheet-text" style="margin-bottom:8px"><b>Spell Slots</b>${slotRow}</div>` : ''}
            ${cantripEntries.length ? `<div class="sheet-text"><b>Cantrips</b></div>${cantripEntries.map(x => this._feat(x.name, '/spells/' + x.index)).join('')}` : ''}
            ${[...new Set(spellEntries.map(x => x.level))].map(l => `<div class="sheet-text" style="margin-top:8px"><b>Level ${l}</b></div>
              ${spellEntries.filter(x => x.level === l).map(x => this._feat(x.name + (x.domain ? ' (domain)' : ''), '/spells/' + x.index)).join('')}`).join('')}
          </div>` : ''}

          <div class="sheet-card"><h4>Features &amp; Traits</h4>
            ${choices.length ? `<div class="sheet-text"><b>Your choices</b></div>${choices.map(([n, t]) => this._feat(n, null, t)).join('')}` : ''}
            ${classFeats.length ? `<div class="sheet-text" style="margin-top:8px"><b>${esc(c.klass?.name || 'Class')} features</b></div>
              ${classFeats.map(f => this._feat(`${f.name} (Lv ${f.level})`, `/features/${f.index}`)).join('')}` : ''}
            ${subFeats.length ? `<div class="sheet-text" style="margin-top:8px"><b>${esc(c.subclassChoice.name)}</b></div>
              ${subFeats.map(f => f.text ? this._feat(`${f.name} (Lv ${f.level})`, null, f.text)
                : this._feat(`${f.name} (Lv ${f.level})`, `/features/${f.index}`)).join('')}` : ''}
            ${featNames.length ? `<div class="sheet-text" style="margin-top:8px"><b>Feats</b></div>
              ${featNames.map(([l, e]) => this._feat(`${e.feat.name} (Lv ${l})`, `/feats/${e.feat.index}`)).join('')}` : ''}
            ${raceTraits.length ? `<div class="sheet-text" style="margin-top:8px"><b>${esc(c.race?.name || 'Racial')} traits</b></div>
              ${raceTraits.map(t => t.desc ? this._feat(t.name, null, t.desc) : this._feat(t.name, `/traits/${t.index}`)).join('')}` : ''}
            ${c.background?.feature ? `<div class="sheet-text" style="margin-top:8px"><b>Background feature</b></div>
              ${this._feat(c.background.feature.name, null, (c.background.feature.desc || []).join('\n\n'))}` : ''}
          </div>

          <div class="two-col">
            <div class="sheet-card"><h4>Proficiencies &amp; Languages</h4><div class="sheet-text">
              <p><b>Armor:</b> ${list(profGroups.armor)}</p>
              <p><b>Weapons:</b> ${list(profGroups.weapons)}</p>
              <p><b>Tools:</b> ${list(profGroups.tools)}</p>
              <p><b>Languages:</b> ${list(langs)}</p>
            </div></div>
            <div class="sheet-card"><h4>Equipment</h4><div class="sheet-text">
              <div class="currency-row">${['cp', 'sp', 'ep', 'gp', 'pp'].map(k =>
                `<div class="coin"><div class="coin-v">${k === 'gp' && c.useGold ? c.startGold : ''}</div><div class="coin-l">${k.toUpperCase()}</div></div>`).join('')}</div>
              ${c.equipment?.length ? list(c.equipment.map(e => (e.quantity > 1 ? e.quantity + '× ' : '') + e.name)) : '—'}
              ${st.weight ? `<p style="margin-top:6px"><b>Weight:</b> ${Math.round(st.weight * 10) / 10} lb of ${st.capacity} lb capacity${over ? ' <span style="color:var(--blood)">(encumbered)</span>' : ''}</p>` : ''}
            </div></div>
          </div>

          ${c.personalityTraits?.length || c.ideal || c.bond || c.flaw ? `<div class="sheet-card"><h4>Personality</h4><div class="sheet-text">
            ${c.personalityTraits?.length ? `<p><b>Traits:</b> ${list(c.personalityTraits)}</p>` : ''}
            ${c.ideal ? `<p><b>Ideal:</b> ${esc(c.ideal)}</p>` : ''}
            ${c.bond ? `<p><b>Bond:</b> ${esc(c.bond)}</p>` : ''}
            ${c.flaw ? `<p><b>Flaw:</b> ${esc(c.flaw)}</p>` : ''}
          </div></div>` : ''}

          ${c.backstory || c.allies || c.notes ? `<div class="sheet-card"><h4>Backstory &amp; Notes</h4><div class="sheet-text" style="white-space:pre-line">
            ${c.backstory ? `<p><b>Backstory:</b> ${esc(c.backstory)}</p>` : ''}
            ${c.allies ? `<p><b>Allies &amp; organizations:</b> ${esc(c.allies)}</p>` : ''}
            ${c.notes ? `<p><b>Notes:</b> ${esc(c.notes)}</p>` : ''}</div></div>` : ''}
        </div>
      </div>

      <div class="sheet-card no-print" style="margin-top:18px"><h4>Edit a Step</h4>
        <div style="display:flex;flex-wrap:wrap;gap:4px">${stepBtns}</div></div>
    </div>`;
  },
};

/* ================================================================
   INIT
================================================================ */
App.go('home');
</script>
</body>
</html>
