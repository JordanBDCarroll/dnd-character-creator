const RaceView = {
  // Module-level state for this step
  charId:          null,
  allRaces:        [],           // full race objects from API
  subraceCache:    {},           // index → full subrace object
  selectedRace:    null,
  selectedSubrace: null,
  traitDescCache:  {},           // trait index → desc string

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell(
      'race',
      `<div class="loading"><div class="spinner"></div><span>Loading races…</span></div>`,
      `<button class="btn btn-primary" id="continue-btn" disabled onclick="RaceView.save()">
         Save &amp; Continue →
       </button>`,
    );
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      const list = await Api.get('/races');

      // Fetch all race details in parallel (9 races — worth the upfront cost for instant switching)
      const races = await Promise.all(list.results.map(r => Api.get(`/races/${r.index}`)));
      races.sort((a, b) => a.name.localeCompare(b.name));

      // Add Player's Handbook subraces the SRD data lacks
      races.forEach(r => {
        const have = new Set((r.subraces || []).map(x => x.index));
        r.subraces = [...(r.subraces || []),
          ...(EXTRA_SUBRACES[r.index] || []).filter(e => !have.has(e.index)).map(e => ({ index: e.index, name: e.name }))];
      });

      this.allRaces        = races;
      this.subraceCache    = {};
      this.traitDescCache  = {};
      this.selectedRace    = null;
      this.selectedSubrace = null;

      // Pre-load subraces if character already has a race with subraces
      if (char.race?.subraces?.length) {
        await this._loadSubraces(char.race.index);
      }

      // Restore previous selections
      if (char.race) {
        this.selectedRace    = races.find(r => r.index === char.race.index) || null;
        this.selectedSubrace = char.subrace
          ? (this.subraceCache[char.subrace.index] || null)
          : null;
      }

      this._renderPanels();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `
        <div class="error-box">
          <p>Failed to load races: ${esc(e.message)}</p>
          <button class="btn btn-outline" onclick="RaceView._load()">Retry</button>
        </div>`;
    }
  },

  async _loadSubraces(raceIndex) {
    const race = this.allRaces.find(r => r.index === raceIndex);
    if (!race?.subraces?.length) return;
    const extras = EXTRA_SUBRACES[raceIndex] || [];
    extras.forEach(e => { this.subraceCache[e.index] = e; });
    const subs = await Promise.all(race.subraces.filter(s => !extras.some(e => e.index === s.index))
      .map(s => Api.get(`/subraces/${s.index}`)));
    subs.forEach(s => { this.subraceCache[s.index] = s; });
  },

  _renderPanels() {
    const char = Store.one(this.charId);
    document.getElementById('wizard-body').innerHTML = `
      <div class="race-step">
        <div class="race-list-panel" id="race-list">
          <div class="panel-label">Choose Your Race</div>
          ${this.allRaces.map(r => `
            <button class="race-option ${this.selectedRace?.index === r.index ? 'selected' : ''}"
                    data-ridx="${r.index}"
                    onclick="RaceView.pickRace('${r.index}')">
              <span class="race-opt-icon">${RACE_ICONS[r.index] || I.d20}</span>
              <span>
                <div class="race-opt-name">${esc(r.name)}</div>
                <div class="race-opt-tag">${esc(RACE_TAGS[r.index] || '')}</div>
              </span>
            </button>`).join('')}
        </div>
        <div class="race-detail-panel" id="race-detail">
          ${this.selectedRace ? this._detailHtml(this.selectedRace) : this._emptyDetail()}
        </div>
      </div>`;
    this._syncFooter();
  },

  _emptyDetail() {
    return `<div class="race-empty">
      <div class="race-empty-icon">${RACE_ICONS.human}</div>
      <p>Select a race from the list to see its traits and abilities.</p>
    </div>`;
  },

  async pickRace(raceIndex) {
    const race = this.allRaces.find(r => r.index === raceIndex);
    if (!race) return;

    this.selectedRace    = race;
    this.selectedSubrace = null;

    // Highlight selected in list
    document.querySelectorAll('.race-option').forEach(el => {
      el.classList.toggle('selected', el.dataset.ridx === raceIndex);
    });

    // Show spinner in detail while loading subraces
    const detail = document.getElementById('race-detail');
    detail.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;

    if (race.subraces?.length) {
      await this._loadSubraces(raceIndex);
    }

    detail.innerHTML = this._detailHtml(race);
    detail.scrollTop = 0;
    this._syncFooter();
  },

  _detailHtml(race) {
    const subraces = (race.subraces || [])
      .map(s => this.subraceCache[s.index])
      .filter(Boolean);
    const hasSubraces = race.subraces?.length > 0;

    return `
      <div class="detail-header">
        <span class="detail-icon">${RACE_ICONS[race.index] || I.d20}</span>
        <div>
          <h2 class="detail-title">${esc(race.name)}</h2>
          <div class="detail-meta">
            <span class="meta-pill">${I.speed} ${race.speed} ft</span>
            <span class="meta-pill">${I.ruler} ${esc(race.size || 'Medium')}</span>
          </div>
        </div>
      </div>

      ${race.ability_bonuses?.length ? `
        <div class="section">
          <div class="section-label">Ability Score Increases</div>
          <div class="asi-row">
            ${race.ability_bonuses.map(b => `
              <div class="asi-chip">
                ${esc(ABILITY_FULL[b.ability_score.index] || b.ability_score.name)}
                <span class="bonus">+${b.bonus}</span>
              </div>`).join('')}
          </div>
        </div>` : ''}

      ${race.traits?.length ? `
        <div class="section">
          <div class="section-label">Racial Traits</div>
          <div class="trait-list">
            ${race.traits.map(t => `
              <div class="trait-item" id="ti-${t.index}">
                <div class="trait-header" onclick="RaceView.toggleTrait('${t.index}')">
                  <span class="trait-name">${esc(t.name)}</span>
                  <span class="trait-chevron">${I.chevron}</span>
                </div>
                <div class="trait-body" id="tb-${t.index}">
                  <span class="trait-loading">Loading…</span>
                </div>
              </div>`).join('')}
          </div>
        </div>` : ''}

      ${race.languages?.length ? `
        <div class="section">
          <div class="section-label">Languages</div>
          <div class="chip-row">
            ${race.languages.map(l => `<span class="chip">${esc(l.name)}</span>`).join('')}
            ${race.language_options?.choose
              ? `<span class="chip dashed">+ ${race.language_options.choose} of your choice</span>`
              : ''}
          </div>
        </div>` : ''}

      ${race.starting_proficiencies?.length ? `
        <div class="section">
          <div class="section-label">Proficiencies</div>
          <div class="chip-row">
            ${race.starting_proficiencies.map(p => `<span class="chip">${esc(p.name)}</span>`).join('')}
          </div>
        </div>` : ''}

      ${hasSubraces ? `
        <div class="section">
          <div class="section-label">Choose Subrace</div>
          ${subraces.length === 0
            ? `<div class="loading" style="padding:20px"><div class="spinner"></div></div>`
            : `<div class="subrace-grid">
                ${subraces.map(s => {
                  const sel = this.selectedSubrace?.index === s.index;
                  return `
                    <button class="subrace-card ${sel ? 'selected' : ''}"
                            data-sidx="${s.index}"
                            onclick="RaceView.pickSubrace('${s.index}')">
                      <div class="subrace-name">${esc(s.name)}</div>
                      ${s.ability_bonuses?.length
                        ? `<div class="subrace-asis">${esc(asiLabel(s.ability_bonuses))}</div>`
                        : ''}
                      ${s.racial_traits?.length
                        ? `<div class="subrace-traits">Traits: ${s.racial_traits.map(t => t.name).join(', ')}</div>`
                        : ''}
                      ${s.source ? `<div class="subrace-traits" style="margin-top:2px;color:var(--ink-3)">${esc(s.source)}</div>` : ''}
                    </button>`;
                }).join('')}
              </div>`}
        </div>` : ''}`;
  },

  async toggleTrait(traitIndex) {
    const item = document.getElementById(`ti-${traitIndex}`);
    if (!item) return;
    const wasOpen = item.classList.contains('open');
    item.classList.toggle('open', !wasOpen);

    if (!wasOpen) {
      const body = document.getElementById(`tb-${traitIndex}`);
      if (!body || !body.querySelector('.trait-loading')) return;
      if (this.traitDescCache[traitIndex]) {
        body.textContent = this.traitDescCache[traitIndex];
        return;
      }
      try {
        const data = await Api.get(`/traits/${traitIndex}`);
        const desc = data.desc?.join('\n\n') || 'No description available.';
        this.traitDescCache[traitIndex] = desc;
        if (body) body.textContent = desc;
      } catch {
        if (body) body.textContent = 'Could not load description.';
      }
    }
  },

  pickSubrace(subraceIndex) {
    this.selectedSubrace = this.subraceCache[subraceIndex] || null;
    document.querySelectorAll('.subrace-card').forEach(el => {
      el.classList.toggle('selected', el.dataset.sidx === subraceIndex);
    });
    this._syncFooter();
  },

  _syncFooter() {
    const btn  = document.getElementById('continue-btn');
    const hint = document.getElementById('footer-hint');
    if (!btn) return;

    const race        = this.selectedRace;
    const needsSub    = race?.subraces?.length > 0;
    const hasValidSub = !needsSub || this.selectedSubrace !== null;
    const ready       = !!race && hasValidSub;

    btn.disabled = !ready;

    if (!race) {
      hint.textContent = 'Select a race to continue.';
    } else if (needsSub && !hasValidSub) {
      hint.textContent = `Choose a ${race.name} subrace to continue.`;
    } else {
      const sub = this.selectedSubrace ? ` · ${this.selectedSubrace.name}` : '';
      hint.textContent = `${race.name}${sub} — ready!`;
    }
  },

  save() {
    const race = this.selectedRace;
    if (!race) return;

    const char = Store.one(this.charId);
    if (!char) return;

    // A different race invalidates choices that came from the old one
    if (char.race?.index !== race.index || char.subrace?.index !== this.selectedSubrace?.index) {
      char.raceAbilityChoices = []; char.racialProficiencies = []; char.dragonAncestry = null; char.racialCantrips = [];
      char.bonusLanguages = [];
    }

    // Persist only the fields we need (avoid bloating localStorage with full API dumps)
    char.race = {
      index:                  race.index,
      name:                   race.name,
      speed:                  race.speed,
      size:                   race.size,
      ability_bonuses:        race.ability_bonuses || [],
      traits:                 race.traits || [],
      languages:              race.languages || [],
      language_options:       race.language_options || null,
      starting_proficiencies: race.starting_proficiencies || [],
      subraces:               race.subraces || [],
      ability_bonus_options:        race.ability_bonus_options || null,
      starting_proficiency_options: race.starting_proficiency_options || null,
    };

    const sr = this.selectedSubrace;
    char.subrace = sr ? {
      index:          sr.index,
      name:           sr.name,
      ability_bonuses: sr.ability_bonuses || [],
      racial_traits:  sr.racial_traits || [],
      language_options: sr.language_options || null,
      starting_proficiencies: sr.starting_proficiencies || [],
      speed_bonus: sr.speed_bonus || 0,
      cantrips: sr.cantrips || [],
    } : null;

    // Advance, but never move a character backwards if they are re-editing race
    advanceStep(char, 'class');
    Store.save(char);
    Toast.show(`${race.name} saved!`, 'success');
    App.go('class', { charId: this.charId });
  },
};

/* ================================================================
   CLASS VIEW
================================================================ */
const ClassView = {
  charId:        null,
  allClasses:    [],     // full class objects from API
  selectedClass: null,

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell(
      'class',
      `<div class="loading"><div class="spinner"></div><span>Loading classes…</span></div>`,
      `<div style="display:flex;gap:10px;align-items:center">
         <label class="level-pick">Level
           <select id="level-select">${Array.from({ length: 20 }, (_, i) =>
             `<option ${(Store.one(charId)?.level || 1) === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></label>
         <button class="btn btn-outline" onclick="App.go('race', { charId: '${charId}' })">← Race</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="ClassView.save()">
           Save &amp; Continue →
         </button>
       </div>`,
    );
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      const list = await Api.get('/classes');
      const classes = await Promise.all(list.results.map(c => Api.get(`/classes/${c.index}`)));
      classes.sort((a, b) => a.name.localeCompare(b.name));

      this.allClasses    = classes;
      this.selectedClass = char?.klass
        ? (classes.find(c => c.index === char.klass.index) || null)
        : null;

      this._renderPanels();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `
        <div class="error-box">
          <p>Failed to load classes: ${esc(e.message)}</p>
          <button class="btn btn-outline" onclick="ClassView._load()">Retry</button>
        </div>`;
    }
  },

  _renderPanels() {
    document.getElementById('wizard-body').innerHTML = `
      <div class="race-step">
        <div class="race-list-panel">
          <div class="panel-label">Choose Your Class</div>
          ${this.allClasses.map(c => `
            <button class="race-option ${this.selectedClass?.index === c.index ? 'selected' : ''}"
                    data-cidx="${c.index}"
                    onclick="ClassView.pickClass('${c.index}')">
              <span class="race-opt-icon">${CLASS_ICONS[c.index] || I.d20}</span>
              <span>
                <div class="race-opt-name">${esc(c.name)}</div>
                <div class="race-opt-tag">${esc(CLASS_TAGS[c.index] || '')}</div>
              </span>
            </button>`).join('')}
        </div>
        <div class="race-detail-panel" id="class-detail">
          ${this.selectedClass ? this._detailHtml(this.selectedClass) : this._emptyDetail()}
        </div>
      </div>`;
    this._syncFooter();
  },

  _emptyDetail() {
    return `<div class="race-empty">
      <div class="race-empty-icon">${CLASS_ICONS.paladin}</div>
      <p>Select a class from the list to see its proficiencies and features.</p>
    </div>`;
  },

  pickClass(classIndex) {
    const klass = this.allClasses.find(c => c.index === classIndex);
    if (!klass) return;
    this.selectedClass = klass;
    document.querySelectorAll('.race-option').forEach(el => {
      el.classList.toggle('selected', el.dataset.cidx === classIndex);
    });
    const detail = document.getElementById('class-detail');
    detail.innerHTML = this._detailHtml(klass);
    detail.scrollTop = 0;
    this._syncFooter();
  },

  _detailHtml(k) {
    const saves  = (k.saving_throws || []).map(s => ABILITY_FULL[s.index] || s.name);
    const skillChoice = k.proficiency_choices?.[0];
    const skillOpts   = (skillChoice?.from?.options || [])
      .map(o => (o.item?.name || '').replace(/^Skill: /, ''))
      .filter(Boolean);
    const caster = k.spellcasting;

    return `
      <div class="detail-header">
        <span class="detail-icon">${CLASS_ICONS[k.index] || I.d20}</span>
        <div>
          <h2 class="detail-title">${esc(k.name)}</h2>
          <div class="detail-meta">
            <span class="meta-pill">Hit Die d${k.hit_die}</span>
            ${caster
              ? `<span class="meta-pill">Spellcasting · ${esc(ABILITY_FULL[caster.spellcasting_ability?.index] || '')}</span>`
              : ''}
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-label">Saving Throws</div>
        <div class="asi-row">
          ${saves.map(n => `<div class="asi-chip">${esc(n)}</div>`).join('')}
        </div>
      </div>

      ${k.proficiencies?.length ? `
        <div class="section">
          <div class="section-label">Armor, Weapon &amp; Tool Proficiencies</div>
          <div class="chip-row">
            ${k.proficiencies
              .filter(p => !p.index.startsWith('saving-throw-'))
              .map(p => `<span class="chip">${esc(p.name)}</span>`).join('')}
          </div>
        </div>` : ''}

      ${skillChoice ? `
        <div class="section">
          <div class="section-label">Skills — choose ${skillChoice.choose}</div>
          <div class="chip-row">
            ${skillOpts.map(n => `<span class="chip">${esc(n)}</span>`).join('')}
          </div>
        </div>` : ''}

      ${k.starting_equipment?.length ? `
        <div class="section">
          <div class="section-label">Starting Equipment</div>
          <div class="chip-row">
            ${k.starting_equipment.map(e =>
              `<span class="chip">${e.quantity > 1 ? e.quantity + '× ' : ''}${esc(e.equipment.name)}</span>`).join('')}
          </div>
          ${k.starting_equipment_options?.length
            ? `<p style="margin-top:10px;font-size:0.8rem;color:var(--ink-3)">
                 Plus ${k.starting_equipment_options.length} equipment choices, made later.</p>`
            : ''}
        </div>` : ''}`;
  },

  _syncFooter() {
    const btn  = document.getElementById('continue-btn');
    const hint = document.getElementById('footer-hint');
    if (!btn) return;
    const k = this.selectedClass;
    btn.disabled = !k;
    hint.textContent = k ? `${k.name} — ready!` : 'Select a class to continue.';
  },

  save() {
    const k = this.selectedClass;
    if (!k) return;
    const char = Store.one(this.charId);
    if (!char) return;

    // Changing class invalidates class-dependent choices made later
    if (char.klass && char.klass.index !== k.index) {
      Object.assign(char, { skillProficiencies: [], cantrips: [], spells: [], subclassChoice: null, fightingStyle: null,
        equipment: [], asi: {}, toolProficiencies: [], expertise: [], draconicAncestry: null, favoredEnemies: [],
        favoredTerrains: [], subclassSkills: [], useGold: false, startGold: 0 });
    }
    char.level = Number(document.getElementById('level-select')?.value) || 1;

    char.klass = {
      index:                      k.index,
      name:                       k.name,
      hit_die:                    k.hit_die,
      saving_throws:              (k.saving_throws || []).map(s => ({ index: s.index, name: s.name })),
      proficiencies:              (k.proficiencies || []).map(p => ({ index: p.index, name: p.name })),
      proficiency_choices:        k.proficiency_choices || [],
      spellcasting:               k.spellcasting
        ? { ability: k.spellcasting.spellcasting_ability?.index || null }
        : null,
      starting_equipment:         k.starting_equipment || [],
      starting_equipment_options: k.starting_equipment_options || [],
    };

    advanceStep(char, 'abilities');
    Store.save(char);
    Toast.show(`${k.name} saved!`, 'success');
    App.go('abilities', { charId: this.charId });
  },
};

/* ================================================================
   ABILITY VIEW
================================================================ */
const STANDARD_ARRAY = [15, 14, 13, 12, 10, 8];
const POINT_COST = { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 };
const POINT_BUDGET = 27;

function abilityMod(score) { return Math.floor((score - 10) / 2); }
function fmtMod(m) { return (m >= 0 ? '+' : '') + m; }

const AbilityView = {
  charId: null,
  method: 'standard',
  pool:   [],     // pool values for standard/roll
  assign: {},     // ability -> pool index | null
  points: {},     // ability -> score (point buy)
  racial: {},     // ability -> fixed racial bonus
  raceChoices: [],  // abilities chosen for a race's free increases (Half-elf)
  asi: {},          // character level -> ASI choice
  asiLevels: [],    // levels at which an ASI is earned
  feats: [],

  render(root, { charId }) {
    this.charId = charId;
    const char = Store.one(charId);
    this.method = char.abilityMethod || 'standard';
    this.racial = {};
    for (const b of [...(char.race?.ability_bonuses || []), ...(char.subrace?.ability_bonuses || [])]) {
      const k = b.ability_score.index;
      this.racial[k] = (this.racial[k] || 0) + b.bonus;
    }
    const opts = abilityOptionList(char.race);
    this.raceChoices = (char.raceAbilityChoices || []).filter(k => opts.some(o => o.index === k));
    this.asi = {};
    Object.entries(char.asi || {}).forEach(([l, e]) => { if (Number(l) <= (char.level || 1)) this.asi[l] = { ...e }; });
    this.asiLevels = []; this.feats = [];
    this.points = {};
    ABILITY_KEYS.forEach(k => { this.points[k] = 8; });
    if (char.abilityMethod === 'pointbuy') Object.assign(this.points, char.baseScores);
    this.assign = { ...(char.abilityAssign || {}) };
    this._setPool(char.rolledPool);

    root.innerHTML = wizardShell(
      'abilities',
      `<div class="abil-main" id="abil-main"></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('class', { charId: '${charId}' })">← Class</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="AbilityView.save()">
           Save &amp; Continue →
         </button>
       </div>`,
    );
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      if ((char.level || 1) >= 4 && char.klass) {
        this.asiLevels = asiLevels(await classLevels(char.klass.index), char.level);
        if (this.asiLevels.length) this.feats = (await Api.get('/feats')).results || [];
      }
      this._draw();
    } catch (e) {
      document.getElementById('abil-main').innerHTML = `<div class="error-box"><p>Failed to load level data: ${esc(e.message)}</p>
        <button class="btn btn-outline" onclick="AbilityView._load()">Retry</button></div>`;
    }
  },

  _setPool(saved) {
    if (this.method === 'standard') this.pool = [...STANDARD_ARRAY];
    else if (this.method === 'roll') this.pool = saved?.length === 6 ? [...saved] : [];
    else this.pool = [];
  },

  setMethod(m) {
    this.method = m;
    this.assign = {};
    this._setPool(Store.one(this.charId)?.rolledPool);
    this._draw();
  },

  roll() {
    // 4d6, drop the lowest die
    this.pool = Array.from({ length: 6 }, () => {
      const d = Array.from({ length: 4 }, () => 1 + Math.floor(Math.random() * 6));
      return d.reduce((a, b) => a + b, 0) - Math.min(...d);
    });
    this.assign = {};
    this._draw();
  },

  assignScore(ab, val) {
    if (val === '') delete this.assign[ab]; else this.assign[ab] = Number(val);
    this._draw();
  },

  adjust(ab, delta) {
    const next = this.points[ab] + delta;
    if (next < 8 || next > 15) return;
    if (delta > 0 && this._spent() - POINT_COST[this.points[ab]] + POINT_COST[next] > POINT_BUDGET) return;
    this.points[ab] = next;
    this._draw();
  },

  _spent() { return ABILITY_KEYS.reduce((n, k) => n + POINT_COST[this.points[k]], 0); },

  _base(ab) {
    if (this.method === 'pointbuy') return this.points[ab];
    const i = this.assign[ab];
    return i == null ? null : this.pool[i];
  },

  _bonus(ab) {
    const opts = abilityOptionList(Store.one(this.charId).race);
    let n = this.racial[ab] || 0;
    this.raceChoices.forEach(k => { if (k === ab) n += opts.find(o => o.index === k)?.bonus || 1; });
    return n;
  },
  _asiBonus(ab) {
    let n = 0;
    Object.values(this.asi).forEach(e => {
      if (e.mode === 'plus2' && e.a === ab) n += 2;
      if (e.mode === 'plus1') { if (e.a === ab) n++; if (e.b === ab) n++; }
    });
    return n;
  },
  _total(ab) { const b = this._base(ab); return b == null ? null : b + this._bonus(ab) + this._asiBonus(ab); },

  toggleRaceChoice(ab) {
    const need = Store.one(this.charId).race?.ability_bonus_options?.choose || 0;
    const i = this.raceChoices.indexOf(ab);
    if (i >= 0) this.raceChoices.splice(i, 1); else if (this.raceChoices.length < need) this.raceChoices.push(ab);
    this._draw();
  },
  setAsiMode(lvl, mode) { this.asi[lvl] = { mode }; this._draw(); },
  setAsiField(lvl, field, val) {
    const e = this.asi[lvl] = this.asi[lvl] || {};
    if (field === 'feat') e.feat = this.feats.find(f => f.index === val) ? { index: val, name: this.feats.find(f => f.index === val).name } : null;
    else e[field] = val || null;
    this._draw();
  },
  _asiOk(lvl) {
    const e = this.asi[lvl];
    if (!e?.mode) return false;
    if (e.mode === 'plus2') return !!e.a;
    if (e.mode === 'plus1') return !!e.a && !!e.b && e.a !== e.b;
    return !!e.feat;
  },

  _isValid() {
    const need = Store.one(this.charId).race?.ability_bonus_options?.choose || 0;
    if (this.raceChoices.length !== need) return false;
    if (!this.asiLevels.every(l => this._asiOk(l))) return false;
    if (ABILITY_KEYS.some(k => (this._total(k) ?? 0) > 20)) return false;
    if (this.method === 'pointbuy') return this._spent() <= POINT_BUDGET;
    return this.pool.length === 6 && ABILITY_KEYS.every(k => this.assign[k] != null);
  },

  _draw() {
    const used = new Set(Object.values(this.assign));
    const tabs = [['standard', 'Standard Array'], ['pointbuy', 'Point Buy'], ['roll', '4d6 Roll']]
      .map(([id, label]) => `<button class="method-tab ${this.method === id ? 'active' : ''}"
        onclick="AbilityView.setMethod('${id}')">${label}</button>`).join('');

    let note = '', pool = '';
    if (this.method === 'standard') {
      note = 'Assign each value of the standard array to one ability.';
    } else if (this.method === 'pointbuy') {
      note = `Spend up to ${POINT_BUDGET} points. Scores range from 8 to 15.
              <span class="pb-points">${POINT_BUDGET - this._spent()} points left</span>`;
    } else {
      note = 'Roll 4d6 and drop the lowest die, six times, then assign the results.';
      pool = `<button class="btn btn-outline" onclick="AbilityView.roll()">
                ${I.d20} ${this.pool.length ? 'Reroll All' : 'Roll Scores'}</button>`;
    }
    if (this.method !== 'pointbuy' && this.pool.length) {
      pool += this.pool.map((v, i) =>
        `<span class="pool-chip ${used.has(i) ? 'used' : ''}">${v}</span>`).join('');
    }

    const cards = ABILITY_KEYS.map(ab => {
      const base  = this._base(ab);
      const bonus = this._bonus(ab);
      const asiB  = this._asiBonus(ab);
      const total = base == null ? null : base + bonus + asiB;
      let ctl;
      if (this.method === 'pointbuy') {
        const sc = this.points[ab];
        const canUp = sc < 15 && this._spent() - POINT_COST[sc] + POINT_COST[sc + 1] <= POINT_BUDGET;
        ctl = `<div class="abil-ctl">
          <button class="pb-btn" ${sc <= 8 ? 'disabled' : ''} onclick="AbilityView.adjust('${ab}',-1)">−</button>
          <span class="pb-val">${sc}</span>
          <button class="pb-btn" ${canUp ? '' : 'disabled'} onclick="AbilityView.adjust('${ab}',1)">+</button>
        </div>`;
      } else {
        const mine = this.assign[ab];
        ctl = `<select class="abil-select" onchange="AbilityView.assignScore('${ab}', this.value)">
          <option value="">${this.pool.length ? '— assign —' : 'Roll first'}</option>
          ${this.pool.map((v, i) => (used.has(i) && i !== mine) ? '' :
            `<option value="${i}" ${i === mine ? 'selected' : ''}>${v}</option>`).join('')}
        </select>`;
      }
      return `<div class="abil-card">
        <div class="abil-name">${ABILITY_FULL[ab]}</div>
        <div class="abil-total">${total ?? '—'}</div>
        <div class="abil-mod">${total == null ? '' : 'Modifier ' + fmtMod(abilityMod(total))}</div>
        <div class="abil-break">${base ?? '—'} base${bonus ? ` <span class="bonus">+ ${bonus} racial</span>` : ''}${asiB ? ` <span class="bonus">+ ${asiB} improvement</span>` : ''}${total > 20 ? ' <span style="color:var(--blood)">(max 20!)</span>' : ''}</div>
        ${ctl}
      </div>`;
    }).join('');

    const char = Store.one(this.charId);
    const choose = char.race?.ability_bonus_options?.choose || 0;
    const freeHtml = choose ? `<div class="section" style="margin-top:22px">
        <div class="section-label">${esc(char.race.name)} — free ability increases (choose ${choose}) —
          <span class="pick-count">${this.raceChoices.length} / ${choose}</span></div>
        <div class="pick-grid">${abilityOptionList(char.race).map(o => {
          const on = this.raceChoices.includes(o.index);
          return `<button class="pick-chip ${on ? 'selected' : ''}" ${!on && this.raceChoices.length >= choose ? 'disabled' : ''}
            onclick="AbilityView.toggleRaceChoice('${o.index}')">${ABILITY_FULL[o.index]} +${o.bonus}</button>`;
        }).join('')}</div></div>` : '';

    const abOpts = sel => `<option value="">— ability —</option>${ABILITY_KEYS.map(k =>
      `<option value="${k}" ${sel === k ? 'selected' : ''}>${ABILITY_FULL[k]}</option>`).join('')}`;
    const asiHtml = this.asiLevels.length ? `<div class="section" style="margin-top:22px">
        <div class="section-label">Ability Score Improvements</div>
        ${this.asiLevels.map(l => {
          const e = this.asi[l] || {};
          const modeBtn = (m, label) => `<button class="pick-chip ${e.mode === m ? 'selected' : ''}" onclick="AbilityView.setAsiMode(${l},'${m}')">${label}</button>`;
          return `<div class="eq-group"><div class="eq-group-title">Level ${l}</div>
            <div class="pick-grid" style="margin-bottom:8px">${modeBtn('plus2', '+2 to one ability')}${modeBtn('plus1', '+1 to two abilities')}${modeBtn('feat', 'Take a feat')}</div>
            ${e.mode === 'plus2' ? `<select class="abil-select" style="max-width:240px" onchange="AbilityView.setAsiField(${l},'a',this.value)">${abOpts(e.a)}</select>` : ''}
            ${e.mode === 'plus1' ? `<div class="eq-picks"><select class="abil-select" style="max-width:220px" onchange="AbilityView.setAsiField(${l},'a',this.value)">${abOpts(e.a)}</select>
              <select class="abil-select" style="max-width:220px" onchange="AbilityView.setAsiField(${l},'b',this.value)">${abOpts(e.b)}</select></div>
              ${e.a && e.a === e.b ? '<div class="sugg">Pick two different abilities.</div>' : ''}` : ''}
            ${e.mode === 'feat' ? (this.feats.length ? `<select class="abil-select" style="max-width:300px" onchange="AbilityView.setAsiField(${l},'feat',this.value)">
              <option value="">— feat —</option>${this.feats.map(f => `<option value="${f.index}" ${e.feat?.index === f.index ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>`
              : '<div class="sugg">No feats available from the data source.</div>') : ''}
          </div>`;
        }).join('')}</div>` : '';

    document.getElementById('abil-main').innerHTML = `
      <div class="method-tabs">${tabs}</div>
      <p class="abil-note">${note}</p>
      ${pool ? `<div class="pool-row">${pool}</div>` : ''}
      <div class="abil-grid">${cards}</div>
      ${freeHtml}${asiHtml}`;

    const ok = this._isValid();
    document.getElementById('continue-btn').disabled = !ok;
    document.getElementById('footer-hint').textContent = ok
      ? 'Ability scores ready!'
      : this.method === 'roll' && !this.pool.length ? 'Roll your scores to continue.'
      : 'Assign every ability score to continue.';
  },

  save() {
    if (!this._isValid()) return;
    const char = Store.one(this.charId);
    if (!char) return;
    char.abilityMethod = this.method;
    char.baseScores    = Object.fromEntries(ABILITY_KEYS.map(k => [k, this._base(k)]));
    char.rolledPool    = this.method === 'roll' ? this.pool : char.rolledPool || [];
    char.abilityAssign = this.method === 'pointbuy' ? {} : this.assign;
    char.raceAbilityChoices = [...this.raceChoices];
    char.asi = {};
    this.asiLevels.forEach(l => { char.asi[l] = { ...this.asi[l] }; });
    advanceStep(char, 'background');
    Store.save(char);
    Toast.show('Ability scores saved!', 'success');
    App.go('background', { charId: this.charId });
  },
};

/* ================================================================
   BACKGROUND VIEW
================================================================ */
// Option entries are either { string } or { desc, alignments } depending on the pool
function bgOptionText(o) { return o.string || o.desc || ''; }
function bgPool(p) {
  return { choose: p?.choose || 0, options: (p?.from?.options || []).map(bgOptionText).filter(Boolean) };
}

const NUM_WORDS = { one: 1, two: 2, three: 3, four: 4 };

// Open5e backgrounds are free-text strings; map them onto the dnd5eapi shape used by this view.
function normalizeOpen5eBackground(o) {
  const split = str => (str || '').split(/,\s*|\s+and\s+/).map(x => x.trim().replace(/\.$/, '')).filter(Boolean);
  const langs = o.languages || '';
  const m = langs.match(/\b(one|two|three|four|\d)\b/i);
  const chooseN = /of your choice/i.test(langs) && m ? (NUM_WORDS[m[1].toLowerCase()] || Number(m[1])) : 0;
  return {
    index: 'o5e-' + o.slug,
    name: o.name,
    source: o.document__title || 'Open5e',
    starting_proficiencies: split(o.skill_proficiencies).map(n => ({ index: 'skill-' + n.toLowerCase().replace(/\s+/g, '-'), name: 'Skill: ' + n })),
    tool_text: o.tool_proficiencies || '',
    language_options: chooseN ? { choose: chooseN } : null,
    language_text: chooseN ? '' : langs,
    starting_equipment: split(o.equipment).map(n => ({ equipment: { index: null, name: n }, quantity: 1 })),
    feature: o.feature ? { name: o.feature, desc: (o.feature_desc || '').split(/\n+/).filter(Boolean) } : null,
    characteristics_text: o.suggested_characteristics || '',
  };
}

const BackgroundView = {
  charId:      null,
  all:         [],
  selected:    null,

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell(
      'background',
      `<div class="loading"><div class="spinner"></div><span>Loading backgrounds…</span></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('abilities', { charId: '${charId}' })">← Abilities</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="BackgroundView.save()">
           Save &amp; Continue →
         </button>
       </div>`,
    );
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      const list = await Api.get('/backgrounds');
      const all  = await Promise.all(list.results.map(b => Api.get(`/backgrounds/${b.index}`)));
      // Extra backgrounds from Open5e; if it is unreachable, carry on with the SRD set.
      try {
        const have = new Set(all.map(b => b.name.toLowerCase()));
        let url = `${OPEN5E_BASE}/backgrounds/?limit=100`;
        for (let page = 0; url && page < 5; page++) {
          const res = await Api.get(url);
          res.results.forEach(o => { if (!have.has(o.name.toLowerCase())) all.push(normalizeOpen5eBackground(o)); });
          url = res.next;
        }
      } catch { /* Open5e optional */ }
      all.sort((a, b) => a.name.localeCompare(b.name));
      this.all      = all;
      this.selected = char?.background
        ? (all.find(b => b.index === char.background.index) || null) : null;
      this._renderPanels();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `
        <div class="error-box">
          <p>Failed to load backgrounds: ${esc(e.message)}</p>
          <button class="btn btn-outline" onclick="BackgroundView._load()">Retry</button>
        </div>`;
    }
  },

  _renderPanels() {
    document.getElementById('wizard-body').innerHTML = `
      <div class="race-step">
        <div class="race-list-panel">
          <div class="panel-label">Choose Your Background</div>
          ${this.all.map(b => `
            <button class="race-option ${this.selected?.index === b.index ? 'selected' : ''}"
                    data-bidx="${b.index}" onclick="BackgroundView.pick('${b.index}')">
              <span class="race-opt-icon">${BG_ICONS[b.index] || SCROLL}</span>
              <span><div class="race-opt-name">${esc(b.name)}</div></span>
            </button>`).join('')}
        </div>
        <div class="race-detail-panel" id="bg-detail">
          ${this.selected ? this._detailHtml(this.selected) : `<div class="race-empty">
            <div class="race-empty-icon">${SCROLL}</div>
            <p>Select a background to see its skills, feature and equipment.</p></div>`}
        </div>
      </div>`;
    this._syncFooter();
  },

  pick(index) {
    const b = this.all.find(x => x.index === index);
    if (!b) return;
    this.selected = b;
    document.querySelectorAll('.race-option').forEach(el => {
      el.classList.toggle('selected', el.dataset.bidx === index);
    });
    const d = document.getElementById('bg-detail');
    d.innerHTML = this._detailHtml(b);
    d.scrollTop = 0;
    this._syncFooter();
  },

  _detailHtml(b) {
    const profs = (b.starting_proficiencies || []).map(p => p.name.replace(/^Skill: /, ''));
    const langs = b.language_options;
    const gear  = b.starting_equipment || [];
    const flavor = [
      ['Personality Traits', bgPool(b.personality_traits)],
      ['Ideals',             bgPool(b.ideals)],
      ['Bonds',              bgPool(b.bonds)],
      ['Flaws',              bgPool(b.flaws)],
    ].filter(([, p]) => p.options.length);

    return `
      <div class="detail-header">
        <span class="detail-icon">${BG_ICONS[b.index] || SCROLL}</span>
        <div><h2 class="detail-title">${esc(b.name)}</h2>
          ${b.source ? `<div class="detail-meta"><span class="meta-pill">${esc(b.source)}</span></div>` : ''}</div>
      </div>

      ${profs.length ? `
        <div class="section"><div class="section-label">Skill Proficiencies</div>
          <div class="chip-row">${profs.map(n => `<span class="chip">${esc(n)}</span>`).join('')}</div>
        </div>` : ''}

      ${b.tool_text ? `
        <div class="section"><div class="section-label">Tool Proficiencies</div>
          <div class="chip-row"><span class="chip">${esc(b.tool_text)}</span></div>
        </div>` : ''}

      ${langs?.choose || b.language_text ? `
        <div class="section"><div class="section-label">Languages</div>
          <div class="chip-row">${langs?.choose
            ? `<span class="chip dashed">${langs.choose} of your choice</span>`
            : `<span class="chip">${esc(b.language_text)}</span>`}</div>
        </div>` : ''}

      ${gear.length ? `
        <div class="section"><div class="section-label">Starting Equipment</div>
          <div class="chip-row">${gear.map(e =>
            `<span class="chip">${e.quantity > 1 ? e.quantity + '× ' : ''}${esc(e.equipment.name)}</span>`).join('')}</div>
        </div>` : ''}

      ${b.feature ? `
        <div class="section"><div class="section-label">Feature — ${esc(b.feature.name)}</div>
          <p style="font-size:0.85rem;color:var(--ink-2);line-height:1.65;white-space:pre-line">${esc((b.feature.desc || []).join('\n\n'))}</p>
        </div>` : ''}

      ${b.characteristics_text ? `
        <div class="section"><div class="section-label">Suggested Characteristics</div>
          <p style="font-size:0.82rem;color:var(--ink-2);line-height:1.6;white-space:pre-line">${esc(b.characteristics_text)}</p>
        </div>` : ''}

      ${flavor.map(([label, p]) => `
        <div class="section"><div class="section-label">${label}${p.choose ? ` — choose ${p.choose}` : ''}</div>
          <div class="trait-list">${p.options.map(t =>
            `<div class="trait-item"><div class="trait-header"><span class="trait-name" style="font-weight:400">${esc(t)}</span></div></div>`).join('')}</div>
        </div>`).join('')}`;
  },

  _syncFooter() {
    const btn = document.getElementById('continue-btn');
    const hint = document.getElementById('footer-hint');
    if (!btn) return;
    btn.disabled = !this.selected;
    hint.textContent = this.selected ? `${this.selected.name} — ready!` : 'Select a background to continue.';
  },

  save() {
    const b = this.selected;
    if (!b) return;
    const char = Store.one(this.charId);
    if (!char) return;

    // A different background invalidates previously chosen personality flavor
    if (char.background && char.background.index !== b.index) {
      char.personalityTraits = []; char.ideal = ''; char.bond = ''; char.flaw = '';
      char.equipment = [];
    }

    char.background = {
      index:               b.index,
      name:                b.name,
      skill_proficiencies: (b.starting_proficiencies || []).map(p => ({ index: p.index, name: p.name })),
      source:              b.source || 'SRD',
      tool_text:           b.tool_text || '',
      language_text:       b.language_text || '',
      characteristics_text: b.characteristics_text || '',
      language_options:    b.language_options ? { choose: b.language_options.choose } : null,
      starting_equipment:  b.starting_equipment || [],
      starting_equipment_options: b.starting_equipment_options || [],
      feature:             b.feature ? { name: b.feature.name, desc: b.feature.desc || [] } : null,
      personality_traits:  bgPool(b.personality_traits),
      ideals:              bgPool(b.ideals),
      bonds:               bgPool(b.bonds),
      flaws:               bgPool(b.flaws),
    };

    advanceStep(char, 'choices');
    Store.save(char);
    Toast.show(`${b.name} saved!`, 'success');
    App.go('choices', { charId: this.charId });
  },
};

/* ================================================================
   CHOICES VIEW  (level-1 class choices)
================================================================ */
const ChoicesView = {
  charId: null,
  need:   null,
  lists:  { cantrips: [], spells: [], heCantrips: [] },
  sel:    null,
  descCache: {},

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell(
      'choices',
      `<div class="loading"><div class="spinner"></div><span>Loading class options…</span></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('background', { charId: '${charId}' })">← Background</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="ChoicesView.save()">
           Save &amp; Continue →
         </button>
       </div>`,
    );
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      const k = char.klass;
      if (!k) { App.go('class', { charId: this.charId }); return; }
      const level = char.level || 1;

      this.levels = await classLevels(k.index);
      const byName = (a, b) => a.name.localeCompare(b.name);
      this.lists = { cantrips: [], spells: [], heCantrips: [] };

      const need = { sp: null, subclass: null, styles: [], dragon: char.race?.index === 'dragonborn',
                     highElf: char.subrace?.index === 'high-elf', ranger: k.index === 'ranger' };

      const [subLevel, subLabel] = SUBCLASS_RULES[k.index] || [99, ''];
      if (level >= subLevel) {
        const cls  = await Api.get(`/classes/${k.index}`);
        const subs = await Promise.all((cls.subclasses || []).map(x => Api.get(`/subclasses/${x.index}`)));
        // Player's Handbook subclasses the SRD data lacks
        (EXTRA_SUBCLASSES[k.index] || []).filter(e => !subs.some(x => x.index === e.index))
          .forEach(e => subs.push({ index: e.index, name: e.name, desc: [e.summary], source: e.source }));
        need.subclass = { label: subLabel, options: subs };
      }

      if (level >= (FIGHTING_STYLE_LEVEL[k.index] || 99)) {
        need.styles = Object.entries(FIGHTING_STYLES).filter(([, f]) => f.classes.includes(k.index))
          .map(([index, f]) => ({ index, name: f.name, desc: [f.desc] }));
      }

      if (need.highElf) {
        const wiz = await Api.get('/classes/wizard/spells');
        this.lists.heCantrips = wiz.results.filter(x => x.level === 0).sort(byName);
      }

      this.need = need;
      const keep = (arr, list, max) => new Set((arr || []).filter(i => list.some(x => x.index === i)).slice(0, max));
      this.sel = {
        cantrips:   new Set(char.cantrips || []),
        spells:     new Set(char.spells || []),
        heCantrip:  keep(char.racialCantrips, this.lists.heCantrips, 1),
        subclass:   need.subclass?.options.some(o => o.index === char.subclassChoice?.index) ? char.subclassChoice.index : null,
        style:      need.styles.some(o => o.index === char.fightingStyle?.index) ? char.fightingStyle.index : null,
        dragon:     char.dragonAncestry,
        draconic:   char.draconicAncestry,
        enemies:    new Set((char.favoredEnemies || []).slice(0, enemyCount(level))),
        terrains:   new Set((char.favoredTerrains || []).slice(0, terrainCount(level))),
      };
      await this._refreshSpells();
      this._draw();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `
        <div class="error-box">
          <p>Failed to load class options: ${esc(e.message)}</p>
          <button class="btn btn-outline" onclick="ChoicesView._load()">Retry</button>
        </div>`;
    }
  },

  // Spell counts and lists depend on the chosen subclass (Eldritch Knight, Arcane Trickster)
  async _refreshSpells() {
    const char = Store.one(this.charId), k = char.klass, level = char.level || 1;
    const tmp = { ...char, subclassChoice: this.sel.subclass ? { index: this.sel.subclass } : null };
    const sp = spellNeeds(tmp, this.levels[level - 1]);
    const byName = (a, b) => a.name.localeCompare(b.name);
    this.need.sp = sp;
    this.lists.cantrips = []; this.lists.spells = [];
    if (sp.casts) {
      const all = await Api.get(`/classes/${isThirdCaster(tmp) ? 'wizard' : k.index}/spells`);
      this.lists.cantrips = all.results.filter(x => x.level === 0).sort(byName);
      this.lists.spells   = all.results.filter(x => x.level >= 1 && x.level <= sp.maxLevel)
        .sort((a, b) => a.level - b.level || byName(a, b));
    }
    const trim = (set, list, max) => new Set([...set].filter(i => list.some(x => x.index === i)).slice(0, max));
    this.sel.cantrips = trim(this.sel.cantrips, this.lists.cantrips, sp.cantrips);
    this.sel.spells   = trim(this.sel.spells, this.lists.spells, sp.spells);
  },

  _max(key) {
    return key === 'cantrips' ? this.need.sp.cantrips : key === 'spells' ? this.need.sp.spells : 1;
  },

  _spellSection(key, title, list) {
    const sel = this.sel[key], need = this._max(key);
    const full = sel.size >= need;
    let lastLevel = null;
    const rows = list.map(sp => {
      const on = sel.has(sp.index);
      const head = key === 'spells' && sp.level !== lastLevel
        ? `<div class="spell-group-label">Level ${(lastLevel = sp.level)}</div>` : '';
      return `${head}
        <div class="spell-row ${on ? 'selected' : ''}" id="sp-${sp.index}">
          <div class="spell-head">
            <button class="spell-pick" ${!on && full ? 'disabled' : ''}
                    onclick="ChoicesView.toggleSpell('${key}','${sp.index}')">
              <span class="spell-check">${on ? '✓' : ''}</span>${esc(sp.name)}
            </button>
            <button class="spell-info" title="Description" onclick="ChoicesView.toggleDesc('${sp.index}')">${I.chevron}</button>
          </div>
          <div class="spell-desc" id="sd-${sp.index}"></div>
        </div>`;
    }).join('');
    return `<div class="section">
      <div class="section-label">${title} — <span class="pick-count">${sel.size} / ${need}</span></div>
      <div class="spell-list">${rows}</div></div>`;
  },

  _optionCards(group, items, selected, label) {
    return `<div class="section">
        <div class="section-label">${label}</div>
        <div class="subrace-grid">
          ${items.map(o => `
            <button class="subrace-card ${selected === o.index ? 'selected' : ''}"
                    onclick="ChoicesView.pickOption('${group}','${o.index}')">
              <div class="subrace-name">${esc(o.name)}</div>
              ${o.desc ? `<div class="subrace-traits">${esc(o.desc[0] || '')}</div>` : ''}
            </button>`).join('')}
        </div></div>`;
  },

  _dragonCards(group, label, selected) {
    const items = Object.entries(DRAGON_ANCESTRY).map(([c, d]) => ({
      index: c, name: titleCase(c) + ' Dragon',
      desc: [group === 'dragon'
        ? `${d.damage} damage · ${d.shape === 'line' ? '5×30 ft line' : '15 ft cone'} · ${ABILITY_FULL[d.save]} save`
        : `${d.damage} damage affinity`] }));
    return this._optionCards(group, items, selected, label);
  },

  _chipPick(key, label, options, max) {
    const set = this.sel[key];
    return `<div class="section"><div class="section-label">${label} — <span class="pick-count">${set.size} / ${max}</span></div>
      <div class="pick-grid">${options.map(o => {
        const on = set.has(o);
        return `<button class="pick-chip ${on ? 'selected' : ''}" ${!on && set.size >= max ? 'disabled' : ''}
          onclick="ChoicesView.toggleMulti('${key}','${esc(o)}',${max})">${esc(o)}</button>`;
      }).join('')}</div></div>`;
  },

  _draw() {
    const main = document.getElementById('wizard-body');
    const y = window.scrollY;
    const n = this.need, sp = n.sp, char = Store.one(this.charId), level = char.level || 1;
    const dom = domainSpells({ ...char, subclassChoice: { index: this.sel.subclass } });
    const nothing = !sp.casts && !n.subclass && !n.styles.length && !n.dragon && !n.highElf && !n.ranger;

    main.innerHTML = `<div class="choices-main">
      <h2>Class Choices</h2>
      <p class="choices-sub">${nothing
        ? `Your class has no choices to make at level ${level}.`
        : `Choices for a level ${level} ${esc(char.klass.name)}.`}</p>
      ${n.dragon ? this._dragonCards('dragon', 'Draconic Ancestry', this.sel.dragon) : ''}
      ${n.highElf ? this._spellSection('heCantrip', 'High Elf Cantrip (any wizard cantrip)', this.lists.heCantrips) : ''}
      ${n.subclass ? this._optionCards('subclass', n.subclass.options, this.sel.subclass, n.subclass.label) : ''}
      ${this.sel.subclass === 'draconic' ? this._dragonCards('draconic', 'Draconic Ancestry (Sorcerer)', this.sel.draconic) : ''}
      ${n.styles.length ? this._optionCards('style', n.styles, this.sel.style, 'Fighting Style') : ''}
      ${n.ranger ? this._chipPick('enemies', 'Favored Enemy', FAVORED_ENEMIES, enemyCount(level))
                   + this._chipPick('terrains', 'Favored Terrain', FAVORED_TERRAINS, terrainCount(level)) : ''}
      ${dom.length ? `<div class="section"><div class="section-label">Domain Spells (always prepared)</div>
        <div class="chip-row">${dom.map(i => `<span class="chip">${esc(spellLabel(i))}</span>`).join('')}</div></div>` : ''}
      ${(SUBCLASS_CANTRIPS[this.sel.subclass] || []).length ? `<div class="section"><div class="section-label">Bonus Cantrip</div>
        <div class="chip-row">${SUBCLASS_CANTRIPS[this.sel.subclass].map(c => `<span class="chip">${esc(c.name)}</span>`).join('')}</div></div>` : ''}
      ${sp.cantrips ? this._spellSection('cantrips', 'Cantrips', this.lists.cantrips) : ''}
      ${sp.spells ? this._spellSection('spells', sp.label, this.lists.spells) : ''}
    </div>`;
    window.scrollTo(0, y);
    this._syncFooter();
  },

  toggleSpell(key, index) {
    const set = this.sel[key];
    if (set.has(index)) set.delete(index);
    else if (set.size < this._max(key)) set.add(index);
    this._redrawKeepingOpen();
  },

  toggleMulti(key, val, max) {
    const set = this.sel[key];
    if (set.has(val)) set.delete(val); else if (set.size < max) set.add(val);
    this._draw();
  },

  _redrawKeepingOpen() {
    const open = [...document.querySelectorAll('.spell-row.open')].map(el => el.id);
    this._draw();
    open.forEach(id => {
      const row = document.getElementById(id);
      if (!row) return;
      row.classList.add('open');
      const idx = id.slice(3);
      if (this.descCache[idx]) document.getElementById('sd-' + idx).textContent = this.descCache[idx];
    });
  },

  async toggleDesc(index) {
    const row = document.getElementById('sp-' + index);
    const body = document.getElementById('sd-' + index);
    if (!row) return;
    const open = row.classList.toggle('open');
    if (!open || this.descCache[index]) { if (open) body.textContent = this.descCache[index]; return; }
    body.textContent = 'Loading…';
    try {
      const d = await Api.get(`/spells/${index}`);
      const head = [d.school?.name, d.casting_time, d.range, d.duration].filter(Boolean).join(' · ');
      this.descCache[index] = head + '\n\n' + (d.desc || []).join('\n\n');
      body.textContent = this.descCache[index];
    } catch { body.textContent = 'Could not load description.'; }
  },

  async pickOption(group, index) {
    this.sel[group] = index;
    if (group === 'subclass') {
      if (index !== 'draconic') this.sel.draconic = null;
      await this._refreshSpells();
    }
    this._draw();
  },

  _isValid() {
    const n = this.need, s = this.sel;
    if (!n) return false;
    const level = Store.one(this.charId).level || 1;
    return s.cantrips.size === n.sp.cantrips && s.spells.size === n.sp.spells
      && (!n.subclass || !!s.subclass) && (!n.styles.length || !!s.style)
      && (!n.dragon || !!s.dragon) && (s.subclass !== 'draconic' || !!s.draconic)
      && (!n.highElf || s.heCantrip.size === 1)
      && (!n.ranger || (s.enemies.size === enemyCount(level) && s.terrains.size === terrainCount(level)));
  },

  _syncFooter() {
    const btn = document.getElementById('continue-btn');
    const hint = document.getElementById('footer-hint');
    if (!btn) return;
    const ok = this._isValid();
    btn.disabled = !ok;
    hint.textContent = ok ? 'Class choices complete!' : 'Make all required choices to continue.';
  },

  save() {
    if (!this._isValid()) return;
    const char = Store.one(this.charId);
    if (!char) return;
    const n = this.need, s = this.sel;
    char.spellNames = {};
    [...this.lists.cantrips, ...this.lists.spells, ...this.lists.heCantrips].forEach(x => { char.spellNames[x.index] = x.name; });
    const domInfo = allDomainSpellInfo();
    Object.entries(domInfo).forEach(([i, d]) => { char.spellNames[i] = d.name; });
    char.spellLevels = {};
    [...this.lists.cantrips, ...this.lists.spells, ...this.lists.heCantrips].forEach(x => { char.spellLevels[x.index] = x.level; });
    Object.entries(domInfo).forEach(([i, d]) => { char.spellLevels[i] = d.level; });
    char.spellSlots     = n.sp.slots;
    char.cantrips       = [...s.cantrips];
    char.spells         = [...s.spells];
    char.racialCantrips = [...s.heCantrip];
    const sub = n.subclass?.options.find(o => o.index === s.subclass);
    if (char.subclassChoice?.index !== sub?.index) char.subclassSkills = [];
    char.subclassChoice = sub ? { index: sub.index, name: sub.name } : null;
    const st = n.styles.find(o => o.index === s.style);
    char.fightingStyle  = st ? { index: st.index, name: st.name } : null;
    char.dragonAncestry   = n.dragon ? s.dragon : null;
    char.draconicAncestry = s.subclass === 'draconic' ? s.draconic : null;
    char.favoredEnemies   = n.ranger ? [...s.enemies] : [];
    char.favoredTerrains  = n.ranger ? [...s.terrains] : [];

    advanceStep(char, 'skills');
    Store.save(char);
    Toast.show('Class choices saved!', 'success');
    App.go('skills', { charId: this.charId });
  },
};

  ['performance','Performance','cha'], ['persuasion','Persuasion','cha'], ['religion','Religion','int'],
  ['sleight-of-hand','Sleight of Hand','dex'], ['stealth','Stealth','dex'], ['survival','Survival','wis'],
].map(([i, name, ab]) => ({ index: 'skill-' + i, name, ab }));

// Skills a character already has from race and background
function fixedSkillSet(char) {
  const set = new Set();
  (char.background?.skill_proficiencies || []).forEach(p => set.add(p.index));
  (char.race?.starting_proficiencies || []).forEach(p => { if (p.index.startsWith('skill-')) set.add(p.index); });
  return set;
}
// Every skill the character is proficient in
function allSkillProfs(char) {
  const set = fixedSkillSet(char);
  (char.skillProficiencies || []).forEach(i => set.add(i));
  (char.subclassSkills || []).forEach(i => set.add(i));
  (char.racialProficiencies || []).forEach(p => { if (p.index.startsWith('skill-')) set.add(p.index); });
  return set;
}

// A proficiency choice from the API: options are either listed items or a whole equipment category
function pickGroup(pc) {
  const items = [], cats = [], f = pc.from || {};
  if (f.equipment_category) cats.push(f.equipment_category.index);
  (f.options || []).forEach(o => {
    const it = o.item || o.of;
    if (it) items.push({ index: it.index, name: it.name });
    const c = o.choice?.from?.equipment_category;
    if (c) cats.push(c.index);
  });
  return { choose: pc.choose || 1, items, cats, desc: pc.desc || '' };
}
const isSkillGroup = g => g.items.length > 0 && g.items.every(i => i.index.startsWith('skill-'));

function bonusLanguageCount(char) {
  return (char.race?.language_options?.choose || 0)
       + (char.subrace?.language_options?.choose || 0)
       + (char.background?.language_options?.choose || 0)
       + (SUBCLASS_PICKS[char.subclassChoice?.index]?.languages || 0);
}

const SkillsView = {
  charId: null, groups: [], picks: {}, expertise: new Set(), fixed: new Set(),
  langs: [], langNeed: 0, known: new Set(), selLangs: new Set(),

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell('skills',
      `<div class="loading"><div class="spinner"></div><span>Loading…</span></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('choices', { charId: '${charId}' })">← Choices</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="SkillsView.save()">Save &amp; Continue →</button>
       </div>`);
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      this.fixed = fixedSkillSet(char);

      const raw = [
        ...(char.klass?.proficiency_choices || []).map((pc, i) => ({ pc, key: 'class' + i, source: 'class' })),
        ...(char.race?.starting_proficiency_options ? [{ pc: char.race.starting_proficiency_options, key: 'race', source: 'race' }] : []),
      ];
      this.groups = await Promise.all(raw.map(async r => {
        const g = pickGroup(r.pc);
        const cats = await Promise.all(g.cats.map(c => Api.get(`/equipment-categories/${c}`)));
        cats.forEach(c => (c.equipment || []).forEach(e => {
          if (!g.items.some(x => x.index === e.index)) g.items.push({ index: e.index, name: e.name });
        }));
        g.items.sort((a, b) => a.name.localeCompare(b.name));
        const skill = isSkillGroup(g);
        return { ...g, key: r.key, source: r.source, skill,
          label: skill ? (r.source === 'race' ? `${char.race.name} Skills` : 'Class Skills')
                       : (r.source === 'race' ? `${char.race.name} Proficiency` : (g.desc || 'Class Proficiencies')),
          choose: Math.min(g.choose, g.items.length) };
      }));

      const subPick = SUBCLASS_PICKS[char.subclassChoice?.index]?.skills;
      if (subPick) this.groups.push({ key: 'sub', source: 'sub', skill: true, cats: [], desc: '', choose: subPick.choose,
        label: `${char.subclassChoice.name} Skills`,
        items: subPick.options.map(o => ({ index: 'skill-' + o, name: SKILLS.find(x => x.index === 'skill-' + o).name })) });

      const saved = { 'class-skill': char.skillProficiencies || [], race: (char.racialProficiencies || []).map(p => p.index),
                      tool: (char.toolProficiencies || []).map(p => p.index) };
      this.picks = {};
      this.groups.forEach(g => {
        const src = g.source === 'race' ? saved.race : g.source === 'sub' ? (char.subclassSkills || [])
          : g.skill ? saved['class-skill'] : saved.tool;
        this.picks[g.key] = new Set(src.filter(i => g.items.some(x => x.index === i)).slice(0, g.choose));
      });
      this.expertise = new Set(char.expertise || []);

      this.langNeed = bonusLanguageCount(char);
      this.known = new Set((char.race?.languages || []).map(l => l.index));
      this.langs = this.langNeed ? (await Api.get('/languages')).results : [];
      const langOk = new Set(this.langs.map(l => l.index));
      this.selLangs = new Set((char.bonusLanguages || []).map(l => l.index).filter(i => langOk.has(i) && !this.known.has(i)));
      this._draw();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `<div class="error-box"><p>Failed to load: ${esc(e.message)}</p>
        <button class="btn btn-outline" onclick="SkillsView._load()">Retry</button></div>`;
    }
  },

  // Skills currently picked in any group
  _pickedSkills() {
    const out = new Set();
    this.groups.filter(g => g.skill).forEach(g => this.picks[g.key].forEach(i => out.add(i)));
    return out;
  },

  _expertiseOptions(char) {
    const prof = new Set([...this.fixed, ...this._pickedSkills()]);
    const opts = SKILLS.filter(sk => prof.has(sk.index)).map(sk => ({ index: sk.index, name: sk.name }));
    if (char.klass?.index === 'rogue') opts.push({ index: 'thieves-tools', name: "Thieves' Tools" });
    return opts;
  },

  _draw() {
    const char = Store.one(this.charId);
    const taken = new Set([...this.fixed, ...this._pickedSkills()]);
    const expNeed = expertiseCount(char.klass?.index, char.level || 1);
    const expOpts = this._expertiseOptions(char);
    this.expertise = new Set([...this.expertise].filter(i => expOpts.some(o => o.index === i)));
    const langsFull = this.selLangs.size >= this.langNeed;

    const groupHtml = this.groups.map(g => {
      const set = this.picks[g.key], full = set.size >= g.choose;
      return `<div class="section"><div class="section-label">${esc(g.label)} — <span class="pick-count">${set.size} / ${g.choose}</span></div>
        <div class="pick-grid">${g.items.map(it => {
          const on = set.has(it.index);
          const dup = g.skill && taken.has(it.index) && !on;
          return `<button class="pick-chip ${on ? 'selected' : ''}" ${dup || (!on && full) ? 'disabled' : ''}
            onclick="SkillsView.toggle('${g.key}','${it.index}')">${esc(it.name.replace(/^Skill: /, ''))}</button>`;
        }).join('')}</div></div>`;
    }).join('');

    document.getElementById('wizard-body').innerHTML = `<div class="form-main">
      <h2>Skills &amp; Languages</h2>
      <p class="choices-sub">Proficiencies from your race and background are applied automatically.</p>
      ${this.fixed.size ? `<div class="section"><div class="section-label">Already Proficient</div>
        <div class="pick-grid">${[...this.fixed].map(i => `<span class="pick-chip fixed">${esc(SKILLS.find(x => x.index === i)?.name || i)}</span>`).join('')}</div></div>` : ''}
      ${groupHtml}
      ${expNeed ? `<div class="section"><div class="section-label">Expertise (double proficiency) — <span class="pick-count">${this.expertise.size} / ${expNeed}</span></div>
        <div class="pick-grid">${expOpts.map(o => {
          const on = this.expertise.has(o.index);
          return `<button class="pick-chip ${on ? 'selected' : ''}" ${!on && this.expertise.size >= expNeed ? 'disabled' : ''}
            onclick="SkillsView.toggleExpertise('${o.index}', ${expNeed})">${esc(o.name)}</button>`;
        }).join('')}</div></div>` : ''}
      ${this.langNeed ? `<div class="section"><div class="section-label">Bonus Languages — <span class="pick-count">${this.selLangs.size} / ${this.langNeed}</span></div>
        <div class="pick-grid">${this.langs.map(l => {
          const dup = this.known.has(l.index), on = this.selLangs.has(l.index);
          return `<button class="pick-chip ${on ? 'selected' : ''}" ${dup || (!on && langsFull) ? 'disabled' : ''}
            onclick="SkillsView.toggleLang('${l.index}')">${esc(l.name)}</button>`;
        }).join('')}</div></div>` : ''}
      ${!this.groups.length && !expNeed && !this.langNeed ? '<p class="choices-sub">Nothing to choose here.</p>' : ''}
    </div>`;
    const ok = this._valid();
    document.getElementById('continue-btn').disabled = !ok;
    document.getElementById('footer-hint').textContent = ok ? 'Skills & languages ready!' : 'Make all required picks to continue.';
  },

  toggle(key, index) {
    const g = this.groups.find(x => x.key === key), set = this.picks[key];
    if (set.has(index)) set.delete(index); else if (set.size < g.choose) set.add(index);
    this._draw();
  },
  toggleExpertise(index, max) {
    if (this.expertise.has(index)) this.expertise.delete(index); else if (this.expertise.size < max) this.expertise.add(index);
    this._draw();
  },
  toggleLang(index) {
    if (this.selLangs.has(index)) this.selLangs.delete(index); else if (this.selLangs.size < this.langNeed) this.selLangs.add(index);
    this._draw();
  },

  _valid() {
    const char = Store.one(this.charId);
    return this.groups.every(g => this.picks[g.key].size === g.choose)
      && this.expertise.size === expertiseCount(char.klass?.index, char.level || 1)
      && this.selLangs.size === this.langNeed;
  },

  save() {
    if (!this._valid()) return;
    const char = Store.one(this.charId);
    const chosen = g => g.items.filter(it => this.picks[g.key].has(it.index)).map(it => ({ index: it.index, name: it.name }));
    char.skillProficiencies = this.groups.filter(g => g.skill && g.source === 'class').flatMap(g => [...this.picks[g.key]]);
    char.subclassSkills = this.groups.filter(g => g.source === 'sub').flatMap(g => [...this.picks[g.key]]);
    char.racialProficiencies = this.groups.filter(g => g.source === 'race').flatMap(chosen);
    char.toolProficiencies   = this.groups.filter(g => !g.skill && g.source === 'class').flatMap(chosen);
    char.expertise = [...this.expertise];
    char.bonusLanguages = this.langs.filter(l => this.selLangs.has(l.index)).map(l => ({ index: l.index, name: l.name }));
    advanceStep(char, 'equipment');
    Store.save(char);
    Toast.show('Skills saved!', 'success');
    App.go('equipment', { charId: this.charId });
  },
};

// Starting wealth if you skip equipment: [dice, sides, multiplier]
const START_GOLD = {
  barbarian: [2,4,10], bard: [5,4,10], cleric: [5,4,10], druid: [2,4,10], fighter: [5,4,10], monk: [5,4,1],
  paladin: [5,4,10], ranger: [5,4,10], rogue: [4,4,10], sorcerer: [3,4,10], warlock: [4,4,10], wizard: [4,4,10],
};

// Turn an API equipment option into parts: fixed items, or "pick N from a category"
function eqParseOption(o) {
  switch (o.option_type) {
    case 'counted_reference': return [{ fixed: { index: o.of.index, name: o.of.name, qty: o.count } }];
    case 'reference': return [{ fixed: { index: o.item.index, name: o.item.name, qty: 1 } }];
    case 'choice': {
      const f = o.choice.from;
      return f?.equipment_category ? [{ pick: { n: o.choice.choose || 1, cat: f.equipment_category.index, catName: f.equipment_category.name } }] : [];
    }
    case 'multiple': return (o.items || []).flatMap(eqParseOption);
    default: return [];
  }
}
function eqParseGroup(g, source) {
  const f = g.from || {};
  const alts = f.option_set_type === 'equipment_category' && f.equipment_category
    ? [[{ pick: { n: g.choose || 1, cat: f.equipment_category.index, catName: f.equipment_category.name } }]]
    : (f.options || []).map(eqParseOption).filter(a => a.length);
  return { source, desc: g.desc || '', alts };
}
function eqPartLabel(part) {
  if (part.fixed) return (part.fixed.qty > 1 ? part.fixed.qty + '× ' : '') + part.fixed.name;
  return `${part.pick.n > 1 ? part.pick.n + '× ' : ''}any ${part.pick.catName.toLowerCase()}`;
}

const EquipmentView = {
  charId: null, groups: [], cats: {}, alt: {}, picks: {}, useGold: false, gold: 0,

  render(root, { charId }) {
    this.charId = charId;
    root.innerHTML = wizardShell('equipment',
      `<div class="loading"><div class="spinner"></div><span>Loading equipment…</span></div>`,
      `<div style="display:flex;gap:10px">
         <button class="btn btn-outline" onclick="App.go('skills', { charId: '${charId}' })">← Skills</button>
         <button class="btn btn-primary" id="continue-btn" disabled onclick="EquipmentView.save()">Save &amp; Continue →</button>
       </div>`);
    this._load();
  },

  async _load() {
    try {
      const char = Store.one(this.charId);
      this.groups = [
        ...(char.klass?.starting_equipment_options || []).map(g => eqParseGroup(g, 'class')),
        ...(char.background?.starting_equipment_options || []).map(g => eqParseGroup(g, 'background')),
      ].filter(g => g.alts.length);
      const cats = new Set(this.groups.flatMap(g => g.alts.flat().filter(p => p.pick).map(p => p.pick.cat)));
      await Promise.all([...cats].map(async c => {
        const d = await Api.get(`/equipment-categories/${c}`);
        this.cats[c] = [...(d.equipment || [])].sort((a, b) => a.name.localeCompare(b.name));
      }));
      this.alt = {}; this.picks = {};
      this.groups.forEach((g, gi) => { if (g.alts.length === 1) this.alt[gi] = 0; });
      this.useGold = !!char.useGold;
      this.gold = char.startGold || 0;
      this._draw();
    } catch (e) {
      document.getElementById('wizard-body').innerHTML = `<div class="error-box"><p>Failed to load: ${esc(e.message)}</p>
        <button class="btn btn-outline" onclick="EquipmentView._load()">Retry</button></div>`;
    }
  },

  _active() { return this.groups.map((g, gi) => ({ g, gi })).filter(x => !(this.useGold && x.g.source === 'class')); },

  _draw() {
    const char = Store.one(this.charId);
    const fixedClass = this.useGold ? [] : (char.klass?.starting_equipment || []);
    const fixedBg = char.background?.starting_equipment || [];
    const fmt = e => `<span class="pick-chip fixed">${e.quantity > 1 ? e.quantity + '× ' : ''}${esc(e.equipment.name)}</span>`;
    const gr = START_GOLD[char.klass?.index];

    const groupHtml = this._active().map(({ g, gi }) => {
      const sel = this.alt[gi];
      return `<div class="eq-group">
        <div class="eq-group-title">${esc(g.source === 'class' ? char.klass.name : char.background.name)} — choose one</div>
        ${g.alts.map((parts, ai) => `
          <button class="eq-alt ${sel === ai ? 'selected' : ''}" onclick="EquipmentView.setAlt(${gi},${ai})">
            ${esc(parts.map(eqPartLabel).join(' + '))}
          </button>`).join('')}
        ${sel != null ? g.alts[sel].map((part, pi) => !part.pick ? '' : `
          <div class="eq-picks">${Array.from({ length: part.pick.n }, (_, slot) => {
            const key = `${gi}.${pi}.${slot}`;
            return `<select class="abil-select" style="max-width:260px" onchange="EquipmentView.setPick('${key}', this.value)">
              <option value="">— ${esc(part.pick.catName)} —</option>
              ${(this.cats[part.pick.cat] || []).map(it =>
                `<option value="${it.index}" ${this.picks[key] === it.index ? 'selected' : ''}>${esc(it.name)}</option>`).join('')}
            </select>`;
          }).join('')}</div>`).join('') : ''}
      </div>`;
    }).join('');

    document.getElementById('wizard-body').innerHTML = `<div class="form-main">
      <h2>Equipment</h2>
      <p class="choices-sub">Starting gear from your class and background.</p>
      ${gr ? `<div class="section"><div class="section-label">Starting Gold Alternative</div>
        <div class="gold-box">
          <button class="pick-chip ${this.useGold ? 'selected' : ''}" onclick="EquipmentView.toggleGold()">
            Take gold instead of class equipment</button>
          ${this.useGold ? `<button class="btn btn-outline" onclick="EquipmentView.rollGold()">${I.d20} ${this.gold ? 'Reroll' : 'Roll'} ${gr[0]}d${gr[1]}${gr[2] > 1 ? ' × ' + gr[2] : ''}</button>
            <span class="gold-amt">${this.gold ? this.gold + ' gp' : ''}</span>` : ''}
        </div></div>` : ''}
      ${fixedClass.length || fixedBg.length ? `<div class="section"><div class="section-label">You Receive</div>
        <div class="pick-grid">${[...fixedClass, ...fixedBg].map(fmt).join('')}</div></div>` : ''}
      ${groupHtml ? `<div class="section"><div class="section-label">Choices</div>${groupHtml}</div>` : ''}
    </div>`;
    const ok = this._valid();
    document.getElementById('continue-btn').disabled = !ok;
    document.getElementById('footer-hint').textContent = ok ? 'Equipment ready!'
      : this.useGold && !this.gold ? 'Roll your starting gold to continue.' : 'Make all equipment choices to continue.';
  },

  setAlt(gi, ai) {
    this.alt[gi] = ai;
    Object.keys(this.picks).filter(k => k.startsWith(gi + '.')).forEach(k => delete this.picks[k]);
    this._draw();
  },
  setPick(key, val) { if (val) this.picks[key] = val; else delete this.picks[key]; this._draw(); },
  toggleGold() { this.useGold = !this.useGold; if (!this.useGold) this.gold = 0; this._draw(); },
  rollGold() {
    const [n, sides, mult] = START_GOLD[Store.one(this.charId).klass.index];
    let t = 0; for (let i = 0; i < n; i++) t += 1 + Math.floor(Math.random() * sides);
    this.gold = t * mult; this._draw();
  },

  _valid() {
    if (this.useGold && !this.gold) return false;
    return this._active().every(({ g, gi }) => {
      const a = this.alt[gi];
      if (a == null) return false;
      return g.alts[a].every((part, pi) => !part.pick ||
        Array.from({ length: part.pick.n }, (_, slot) => this.picks[`${gi}.${pi}.${slot}`]).every(Boolean));
    });
  },

  _resolve(char) {
    const out = new Map();
    const add = (index, name, qty) => {
      const k = index || name;
      if (out.has(k)) out.get(k).quantity += qty; else out.set(k, { index: index || null, name, quantity: qty });
    };
    if (!this.useGold) (char.klass?.starting_equipment || []).forEach(e => add(e.equipment.index, e.equipment.name, e.quantity));
    (char.background?.starting_equipment || []).forEach(e => add(e.equipment.index, e.equipment.name, e.quantity));
    this._active().forEach(({ g, gi }) => {
      g.alts[this.alt[gi]].forEach((part, pi) => {
        if (part.fixed) add(part.fixed.index, part.fixed.name, part.fixed.qty);
        else for (let slot = 0; slot < part.pick.n; slot++) {
          const idx = this.picks[`${gi}.${pi}.${slot}`];
          const it = (this.cats[part.pick.cat] || []).find(x => x.index === idx);
          if (it) add(it.index, it.name, 1);
        }
      });
    });
    return [...out.values()];
  },

  save() {
    if (!this._valid()) return;
    const char = Store.one(this.charId);
    char.equipment = this._resolve(char);
    char.useGold = this.useGold;
    char.startGold = this.useGold ? this.gold : 0;
    advanceStep(char, 'details');
    Store.save(char);
    Toast.show('Equipment saved!', 'success');
    App.go('details', { charId: this.charId });
  },
};

        <div class="appearance-grid">${APPEARANCE_FIELDS.map(([k, label]) => `<div class="field"><label for="d-ap-${k}">${label}</label>
          <input type="text" id="d-ap-${k}" maxlength="40" value="${esc(c.appearance?.[k] || '')}"></div>`).join('')}</div></div>
      ${area('d-backstory', 'Backstory', c.backstory, null)}
      ${area('d-allies', 'Allies &amp; Organizations', c.allies, null)}
      ${area('d-notes', 'Notes', c.notes, null)}
    </div>`,
    `<div style="display:flex;gap:10px">
       <button class="btn btn-outline" onclick="DetailsView.persist();App.go('equipment', { charId: '${charId}' })">← Equipment</button>
       <button class="btn btn-primary" id="continue-btn" disabled onclick="DetailsView.save()">Finish ✓</button>
     </div>`);
    this._drawPortrait();
    this.sync();
  },

  _v(id) { return (document.getElementById(id)?.value || '').trim(); },
  fill(id, sel) { if (sel.value) { document.getElementById(id).value = sel.value; sel.value = ''; } },

  sync() {
    const ok = !!this._v('d-name') && !!this._v('d-align');
    document.getElementById('continue-btn').disabled = !ok;
    document.getElementById('footer-hint').textContent = ok ? 'Ready to finish!' : 'Enter a name and alignment to finish.';
  },

  _drawPortrait() {
    const c = Store.one(this.charId);
    document.getElementById('portrait-box').innerHTML = this.portrait
      ? `<img src="${esc(this.portrait)}" alt="Portrait">` : (RACE_ICONS[c.race?.index] || I.d20);
  },
  clearPortrait() { this.portrait = null; this._drawPortrait(); },

  upload(file) {
    if (!file) return;
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      // Downscale to keep localStorage small
      const max = 320, scale = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      this.portrait = cv.toDataURL('image/jpeg', 0.82);
      URL.revokeObjectURL(url);
      this._drawPortrait();
    };
    img.onerror = () => { URL.revokeObjectURL(url); Toast.show('Could not read that image.', 'error'); };
    img.src = url;
  },

  persist(char = Store.one(this.charId)) {
    char.portrait = this.portrait;
    char.name = this._v('d-name');
    char.alignment = document.getElementById('d-align').value;
    char.personalityTraits = [this._v('d-trait0'), this._v('d-trait1')].filter(Boolean);
    char.ideal = this._v('d-ideal'); char.bond = this._v('d-bond'); char.flaw = this._v('d-flaw');
    char.appearance = Object.fromEntries(APPEARANCE_FIELDS.map(([k]) => [k, this._v('d-ap-' + k)]));
    char.backstory = this._v('d-backstory'); char.allies = this._v('d-allies'); char.notes = this._v('d-notes');
    Store.save(char);
  },

  save() {
    const char = Store.one(this.charId);
    this.persist(char);
    char.step = 'complete';
    Store.save(char);
    Toast.show(`${char.name} is ready!`, 'success');
    App.go('sheet', { charId: this.charId });
  },
};
